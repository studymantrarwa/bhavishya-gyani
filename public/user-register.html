<!doctype html><html lang="hi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>User Registration — Bhavishya Gyani</title></head><body style="background:#070707;color:#fff;font-family:system-ui;padding:20px"><main style="max-width:460px;margin:auto;background:#151515;padding:22px;border-radius:18px"><h1>User Registration</h1><p>इस account type में email/mobile unique होंगे। वही email Astrologer और Admin के लिए अलग से इस्तेमाल किया जा सकता है।</p><div id="m"></div><form id="f"><p>Name<br><input id="n" required style="width:100%;padding:12px"></p><p>Mobile<br><input id="ph" inputmode="numeric" style="width:100%;padding:12px"></p><p>Email<br><input id="e" type="email" required style="width:100%;padding:12px"></p><p>Password<br><input id="p" type="password" minlength="6" required style="width:100%;padding:12px"></p><p>Confirm Password<br><input id="p2" type="password" minlength="6" required style="width:100%;padding:12px"></p><button style="width:100%;padding:13px">Create User Account</button></form><p><a href="/user-login.html">User Login</a></p></main><script src="/supabase-client.js"></script><script>const $=s=>document.querySelector(s);$('#f').onsubmit=async e=>{e.preventDefault();if($('#p').value!==$('#p2').value)return $('#m').textContent='Passwords match नहीं हैं';try{const r=await fetch('/api/register',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name:$('#n').value.trim(),phone:$('#ph').value,email:$('#e').value.trim(),password:$('#p').value})});const j=await r.json();if(!r.ok)throw Error(j.error);const l=await fetch('/api/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({account_type:'user',email:$('#e').value.trim(),password:$('#p').value})});const lj=await l.json();if(l.ok){SM_SUPABASE._saveToken(lj.token,'user');location.href='/dashboard.html'}else $('#m').textContent=j.message||'Registration successful. Login करें.'}catch(x){$('#m').textContent=x.message}}</script></body></html>

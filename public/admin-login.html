<!doctype html><html lang="hi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin Login — Bhavishya Gyani</title></head><body style="background:#070707;color:#fff;font-family:system-ui;padding:20px"><main style="max-width:460px;margin:auto;background:#151515;padding:22px;border-radius:18px"><h1>Bhavishya Gyani Admin</h1><p>यह पूरी तरह अलग Admin account system है। Same email User/Astrologer में भी हो सकता है।</p><div id="m"></div><form id="f"><p>Admin Email<br><input id="e" type="email" required style="width:100%;padding:12px"></p><p>Admin Password<br><input id="p" type="password" minlength="6" required style="width:100%;padding:12px"></p><button style="width:100%;padding:13px">Admin Login</button></form><p><button id="r" type="button" style="width:100%;padding:12px">New Admin Registration</button></p></main><script src="/supabase-client.js"></script><script>const $=s=>document.querySelector(s);$('#f').onsubmit=async e=>{e.preventDefault();try{const r=await fetch('/api/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({account_type:'admin',email:$('#e').value.trim(),password:$('#p').value})});const j=await r.json();if(!r.ok)throw Error(j.error);SM_SUPABASE._saveToken(j.token,'admin');location.href='/admin-panel.html'}catch(x){$('#m').textContent=x.message}};$('#r').onclick=()=>location.href='/admin-register.html';</script></body></html>

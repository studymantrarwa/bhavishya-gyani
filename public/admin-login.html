<!doctype html><html lang="hi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Bhavishya Gyani — Admin Login</title><script src="/supabase-client.js"></script><style>*{box-sizing:border-box}body{margin:0;min-height:100vh;background:#070707;color:#fff;font-family:system-ui,-apple-system,"Noto Sans Devanagari",sans-serif;display:grid;place-items:center;padding:18px}.card{width:min(430px,100%);background:#111;border:1px solid #292929;border-radius:20px;padding:24px;box-shadow:0 20px 60px #000}.logo{text-align:center;font-size:30px;color:#f2bd18}.brand{text-align:center;font-size:24px;font-weight:900;margin:5px}.sub{text-align:center;color:#999;font-size:13px;margin:6px 0 20px}.field{margin:12px 0}.field label{display:block;color:#ddd;font-size:13px;margin-bottom:6px}.field input{width:100%;padding:13px;border-radius:10px;border:1px solid #363636;background:#080808;color:#fff}.btn{width:100%;padding:13px;border:0;border-radius:10px;background:#f2bd18;color:#111;font-weight:900;margin-top:8px}.secondary{background:#222;color:#fff}.msg{display:none;padding:11px;border-radius:10px;margin:12px 0;font-size:13px}.msg.show{display:block}.err{background:#3a1111;color:#ffbaba;border:1px solid #692222}.ok{background:#10321f;color:#baf5cf;border:1px solid #236b40}.small{text-align:center;color:#777;font-size:12px;margin-top:14px}a{color:#f2bd18;text-decoration:none}</style></head><body><div class="card"><div class="logo">☀</div><div class="brand">Bhavishya Gyani Admin</div><div class="sub">Admin Panel में प्रवेश के लिए Admin email और password जरूरी है।</div><div id="msg" class="msg"></div><form id="f"><div class="field"><label>Admin Email / Mobile</label><input id="email" type="text" autocomplete="username" required placeholder="admin@example.com"></div><div class="field"><label>Admin Password</label><input id="pass" type="password" autocomplete="current-password" required minlength="6" placeholder="Password"></div><button class="btn" id="submit">Admin Login</button></form><button class="btn secondary" id="forgot" type="button">Password भूल गए?</button><button class="btn secondary" id="register" type="button">➕ New Admin Registration</button><div class="small"><a href="/">← Home</a> &nbsp;|&nbsp; सामान्य account के लिए <a href="/auth.html">Login</a></div></div><script>const $=s=>document.querySelector(s);function msg(t,c='err'){const e=$('#msg');e.textContent=t;e.className='msg show '+c}$('#f').onsubmit=async e=>{e.preventDefault();$('#submit').disabled=true;try{const r=await fetch('/api/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({identifier:$('#email').value.trim(),password:$('#pass').value,account_type:'admin'})});const j=await r.json().catch(()=>({}));if(!r.ok)throw Error(j.error||'Admin Login failed');window.SM_SUPABASE._saveToken(j.token,'admin');msg('Admin Login सफल। Panel खोला जा रहा है…','ok');setTimeout(()=>location.href='/admin-panel.html',250)}catch(err){msg(err.message||'Admin Login failed')}finally{$('#submit').disabled=false}};$('#register').onclick=()=>location.href='/admin-register.html';</script></body></html>

<!doctype html><html lang="hi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Bhavishya Gyani — User Login</title><style>*{box-sizing:border-box}body{margin:0;min-height:100vh;background:#070707;color:#fff;font-family:system-ui,-apple-system,"Noto Sans Devanagari",sans-serif;display:grid;place-items:center;padding:18px}.card{width:min(440px,100%);background:#111;border:1px solid #292929;border-radius:20px;padding:24px}.logo{text-align:center;font-size:30px;color:#f2bd18}.brand{text-align:center;font-size:24px;font-weight:900}.sub{text-align:center;color:#999;font-size:13px;margin:6px 0 20px}.field{margin:12px 0}.field label{display:block;color:#ddd;font-size:13px;margin-bottom:6px}.field input{width:100%;padding:13px;border-radius:10px;border:1px solid #363636;background:#080808;color:#fff}.btn{width:100%;padding:13px;border:0;border-radius:10px;background:#f2bd18;color:#111;font-weight:900;margin-top:8px}.secondary{background:#222;color:#fff}.msg{display:none;padding:11px;border-radius:10px;margin:12px 0;font-size:13px}.msg.show{display:block}.err{background:#3a1111;color:#ffbaba}.ok{background:#10321f;color:#baf5cf}.links{text-align:center;color:#888;font-size:12px;margin-top:14px}.links a{color:#f2bd18;text-decoration:none}</style></head><body><div class="card"><div class="logo">☀</div><div class="brand">Bhavishya Gyani</div><div class="sub">यह केवल <b>User Account</b> का login/registration है। Astrologer और Admin के accounts अलग हैं।</div><div id="msg" class="msg"></div><form id="login"><div class="field"><label>Email</label><input id="le" type="email" required></div><div class="field"><label>Password</label><input id="lp" type="password" minlength="6" required></div><button class="btn">User Login</button></form><button class="btn secondary" id="reg" type="button">New User Registration</button><div class="links"><a href="/astrologer-login.html">Astrologer Login</a> · <a href="/astrologer-register.html">Astrologer Registration</a></div></div><script>const $=s=>document.querySelector(s);function msg(t,c='err'){const e=$('#msg');e.textContent=t;e.className='msg show '+c}async function call(path,body){const r=await fetch(path,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});const j=await r.json().catch(()=>({}));if(!r.ok)throw Error(j.error||'Request failed');return j}$('#login').onsubmit=async e=>{e.preventDefault();try{const j=await call('/api/login',{account_type:'user',email:$('#le').value.trim(),password:$('#lp').value});window.SM_SUPABASE._saveToken(j.token,'user');msg('Login सफल — User Panel खोला जा रहा है…','ok');setTimeout(()=>location.replace('/dashboard.html'),250)}catch(x){msg(x.message)}};$('#reg').onclick=()=>location.href='/user-register.html';</script><script src="/supabase-client.js"></script></body></html>

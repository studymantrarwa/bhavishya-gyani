<!doctype html><html lang="hi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Bhavishya Gyani — Login</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="/supabase-client.js?v=20260921fix"></script><style>*{box-sizing:border-box}body{margin:0;min-height:100vh;background:#070707;color:#fff;font-family:system-ui,-apple-system,"Noto Sans Devanagari",sans-serif;display:grid;place-items:center;padding:18px}.card{width:min(440px,100%);background:#111;border:1px solid #292929;border-radius:20px;padding:24px;box-shadow:0 20px 60px #000}.logo{text-align:center;font-size:30px;color:#f2bd18}.brand{text-align:center;font-size:24px;font-weight:900}.sub{text-align:center;color:#999;font-size:13px;margin:6px 0 20px}.field{margin:12px 0}.field label{display:block;color:#ddd;font-size:13px;margin-bottom:6px}.field input{width:100%;padding:13px;border-radius:10px;border:1px solid #363636;background:#080808;color:#fff}.btn{width:100%;padding:13px;border:0;border-radius:10px;background:#f2bd18;color:#111;font-weight:900;margin-top:8px}.msg{display:none;padding:11px;border-radius:10px;margin:12px 0;font-size:13px}.msg.show{display:block}.err{background:#3a1111;color:#ffbaba}.ok{background:#10321f;color:#baf5cf}.links{text-align:center;color:#888;font-size:12px;margin-top:14px}.links a{color:#f2bd18;text-decoration:none}.tabs{display:flex;gap:8px;margin-bottom:14px}.tab{flex:1;background:#222;color:#ddd}.tab.active{background:#f2bd18;color:#111}</style></head><body><div class="card"><div class="logo">☀</div><div class="brand">Bhavishya Gyani</div><div class="sub">Login करने पर account की वास्तविक Supabase role के अनुसार सही panel खुलेगा।</div><div class="tabs"><button class="btn tab active" id="loginTab" type="button">Login</button><button class="btn tab" id="signupTab" type="button">Sign Up</button></div><div id="msg" class="msg"></div><form id="loginForm"><div class="field"><label>Email</label><input id="loginEmail" type="email" required autocomplete="username"></div><div class="field"><label>Password</label><input id="loginPassword" type="password" required autocomplete="current-password"></div><button class="btn" type="submit">Login</button></form><form id="signupForm" style="display:none"><div class="field"><label>Full Name</label><input id="signupName" required></div><div class="field"><label>Email</label><input id="signupEmail" type="email" required></div><div class="field"><label>Phone</label><input id="signupPhone" type="tel"></div><div class="field"><label>Account Type</label><select id="signupType" style="width:100%;padding:13px;border-radius:10px;background:#080808;color:#fff;border:1px solid #363636"><option value="user">User</option><option value="astrologer">Astrologer</option></select></div><div class="field"><label>Password</label><input id="signupPassword" type="password" minlength="6" required></div><div class="field"><label>Confirm Password</label><input id="signupConfirm" type="password" minlength="6" required></div><button class="btn" type="submit">Create Account</button></form><div class="links"><a href="/astrologer-login.html">Astrologer Login</a> · <a href="/admin-login.html">Admin Login</a> · <a href="/user-login.html">User Login</a></div></div><script>
const $=s=>document.querySelector(s);
function message(t,kind='err'){const e=$('#msg');e.textContent=t;e.className='msg show '+kind}
async function client(){const s=await window.SM_SUPABASE.init();if(!s)throw Error('Supabase configure नहीं है।');return s}
async function getRole(token){const r=await fetch('/api/me',{headers:{Authorization:'Bearer '+token}});const j=await r.json();if(!r.ok)throw Error(j.error||'Account role check failed');const role=j.user?.role;if(!['user','astrologer','admin'].includes(role))throw Error('Invalid account role');return role}
function routeForRole(role){if(role==='admin')return '/admin-panel.html';if(role==='astrologer')return '/astrologer-dashboard.html';return '/dashboard.html'}
function roleText(role){return role==='admin'?'Admin Panel':role==='astrologer'?'Astrologer Panel':'User Panel'}
$('#loginTab').onclick=()=>{$('#loginForm').style.display='block';$('#signupForm').style.display='none';$('#loginTab').classList.add('active');$('#signupTab').classList.remove('active')};
$('#signupTab').onclick=()=>{$('#loginForm').style.display='none';$('#signupForm').style.display='block';$('#signupTab').classList.add('active');$('#loginTab').classList.remove('active')};
$('#loginForm').onsubmit=async e=>{e.preventDefault();const b=e.target.querySelector('button[type=submit]');b.disabled=true;try{const s=await client();const {data,error}=await s.auth.signInWithPassword({email:$('#loginEmail').value.trim(),password:$('#loginPassword').value});if(error)throw error;if(!data.session)throw Error('Login session नहीं मिली।');localStorage.setItem('studyMantraToken',data.session.access_token);const role=await getRole(data.session.access_token);const target=routeForRole(role);message('Login सफल — '+roleText(role)+' खोला जा रहा है…','ok');setTimeout(()=>location.replace(target),250)}catch(err){message(err.message||'Login failed')}finally{b.disabled=false}};
$('#signupForm').onsubmit=async e=>{e.preventDefault();const name=$('#signupName').value.trim(),email=$('#signupEmail').value.trim(),phone=$('#signupPhone').value.trim(),type=$('#signupType').value,p1=$('#signupPassword').value,p2=$('#signupConfirm').value;if(p1!==p2)return message('दोनों passwords एक जैसे होने चाहिए।');const b=e.target.querySelector('button[type=submit]');b.disabled=true;try{const s=await client();const {data,error}=await s.auth.signUp({email,password:p1,options:{data:{full_name:name,phone,account_type:type}}});if(error)throw error;if(data.session){localStorage.setItem('studyMantraToken',data.session.access_token);const role=await getRole(data.session.access_token);message('Account बना — '+roleText(role)+' खोला जा रहा है…','ok');setTimeout(()=>location.replace(routeForRole(role)),250)}else{message('Signup सफल। Email confirmation के बाद Login करें।','ok');$('#loginTab').click();$('#loginEmail').value=email}}catch(err){message(err.message||'Signup failed')}finally{b.disabled=false}};
(async()=>{try{const s=await client();const {data}=await s.auth.getSession();if(!data.session)return;localStorage.setItem('studyMantraToken',data.session.access_token);const role=await getRole(data.session.access_token);location.replace(routeForRole(role))}catch(e){}})();
</script></body></html>

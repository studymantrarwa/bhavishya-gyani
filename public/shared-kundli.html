<!doctype html><html lang="hi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Shared Kundli — Bhavishya Gyani</title><style>:root{--gold:#ffc400;--bg:#111;--card:#1d1e21;--line:#34353a}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:#fff;font-family:system-ui,-apple-system,"Noto Sans Devanagari",sans-serif}.wrap{max-width:680px;margin:auto;padding:15px}.top{display:flex;align-items:center;gap:10px}.top a{color:#fff;text-decoration:none;font-size:27px}.card{background:var(--card);border:1px solid var(--line);border-radius:15px;padding:15px;margin:11px 0}.row{display:grid;grid-template-columns:1fr 1fr;gap:9px}.item{padding:10px;border-radius:10px;background:#292a2e}.muted{color:#aaa;font-size:12px}.btn{border:0;border-radius:10px;padding:11px 13px;background:var(--gold);color:#111;font-weight:900;cursor:pointer}.full{width:100%}@media(max-width:480px){.row{grid-template-columns:1fr}}</style></head><body><div class="wrap"><div class="top"><a href="javascript:history.back()">‹</a><h2>Open Kundli</h2></div><div id="content" class="card">Loading…</div></div><script>
const p=new URLSearchParams(location.search);const token=()=>localStorage.getItem('studyMantraToken');const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));async function run(){const t=await window.SM_SUPABASE.getAccessToken();if(!t)throw Object.assign(new Error('LOGIN_REQUIRED'),{status:401});const q=p.get('conversation_id')?'conversation_id='+encodeURIComponent(p.get('conversation_id')):'kundali_id='+encodeURIComponent(p.get('kundali_id')||'');const r=await fetch('/api/shared-kundli?'+q,{headers:{Authorization:'Bearer '+t}});const j=await r.json();if(!r.ok)throw Error(j.error||'Unable to open Kundli');const k=j.kundli,d=k.calculation_data||{};localStorage.setItem('studyMantraLastKundli',JSON.stringify(d));const bd=d.birthDetails||{},bc=bd.birthChart||{};document.getElementById('content').innerHTML=`<h3 style="margin-top:0">${esc(k.name)}</h3><div class="row"><div class="item"><b>DOB</b><br>${esc(k.dob)}</div><div class="item"><b>Birth Time</b><br>${esc(k.birth_time)}</div><div class="item"><b>Birth Place</b><br>${esc(k.place)}</div><div class="item"><b>Lagna / Rashi</b><br>${esc(bc.lagnaHi||d.lagna?.signName||'—')} / ${esc(bc.rashiHi||'—')}</div></div><p class="muted">यह Kundli chat permission के अंतर्गत shared हुई है। Email/mobile यहाँ intentionally नहीं दिखाया जाता।</p><button class="btn full" onclick="location.href='/kundli.html'">Open Full Kundli</button>`}run().catch(e=>document.getElementById('content').innerHTML='<b>Error:</b> '+esc(e.message));
</script></body></html>

<!doctype html><html lang="hi"><head><script src="/auth-guard.js"></script><script>BG_AUTH.check(["user","astrologer"]);</script><script src="/supabase-client.js"></script><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Shared Kundli — Bhavishya Gyani</title><style>:root{--gold:#ffc400;--bg:#111;--card:#1d1e21;--line:#34353a}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:#fff;font-family:system-ui,-apple-system,"Noto Sans Devanagari",sans-serif}.wrap{max-width:680px;margin:auto;padding:15px}.top{display:flex;align-items:center;gap:10px}.top a{color:#fff;text-decoration:none;font-size:27px}.card{background:var(--card);border:1px solid var(--line);border-radius:15px;padding:15px;margin:11px 0}.row{display:grid;grid-template-columns:1fr 1fr;gap:9px}.item{padding:10px;border-radius:10px;background:#292a2e}.muted{color:#aaa;font-size:12px}.btn{border:0;border-radius:10px;padding:11px 13px;background:var(--gold);color:#111;font-weight:900;cursor:pointer}.full{width:100%}@media(max-width:480px){.row{grid-template-columns:1fr}}</style></head><body><div class="wrap"><div class="top"><a href="javascript:history.back()">‹</a><h2>Open Kundli</h2></div><div id="content" class="card">Loading…</div></div><script>
const p=new URLSearchParams(location.search),esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
async function run(){try{const t=await window.SM_SUPABASE.getAccessToken();if(!t)throw Error('LOGIN_REQUIRED');const q=p.get('conversation_id')?'conversation_id='+encodeURIComponent(p.get('conversation_id')):'kundali_id='+encodeURIComponent(p.get('kundali_id')||'');if(!q||q.endsWith('='))throw Error('Kundli reference missing');const r=await fetch('/api/shared-kundli?'+q,{headers:{Authorization:'Bearer '+t}}),j=await r.json();if(!r.ok)throw Error(j.error||'Unable to open Kundli');const k=j.kundli;let calc=k.calculation_data||{};if(typeof calc==='string'){try{calc=JSON.parse(calc)}catch(e){calc={}}}const bd=calc.birthDetails||{},bc=bd.birthChart||{};localStorage.setItem('studyMantraLastKundli',JSON.stringify(calc));if(calc&&calc.charts){location.replace('/kundli.html?shared=1');return;}document.getElementById('content').innerHTML=`<h3 style="margin-top:0">${esc(k.name)}</h3><div class="row"><div class="item"><b>DOB</b><br>${esc(k.dob)}</div><div class="item"><b>Birth Time</b><br>${esc(k.birth_time)}</div><div class="item"><b>Birth Place</b><br>${esc(k.place)}</div><div class="item"><b>Lagna / Rashi</b><br>${esc(bc.lagnaHi||calc.lagna?.signName||'—')} / ${esc(bc.rashiHi||'—')}</div></div><p class="muted">यह Kundli chat permission के अंतर्गत shared हुई है। Email/mobile यहाँ नहीं दिखाया जाता।</p><button class="btn full" onclick="location.href='/kundli.html'">Open Full Kundli</button>`}catch(e){document.getElementById('content').innerHTML='<b>Error:</b> '+esc(e.message)}}run();
</script><script src="/astrologer-global-chat.js"></script></body></html>

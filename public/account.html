<!doctype html><html lang="hi"><head><script id="bg-auth-guard">
(function(){
  var token=null;
  try{token=localStorage.getItem('bhavishyaGyaniToken')||localStorage.getItem('studyMantraToken')}catch(e){}
  if(!token){location.replace('/?next='+encodeURIComponent(location.pathname+location.search));return;}
  fetch('/api/me',{headers:{Authorization:'Bearer '+token},cache:'no-store'}).then(function(r){
    if(!r.ok)throw new Error('unauthorized');
  }).catch(function(){
    try{localStorage.removeItem('bhavishyaGyaniToken');localStorage.removeItem('studyMantraToken')}catch(e){}
    location.replace('/?next='+encodeURIComponent(location.pathname+location.search));
  });
})();
</script><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Bhavishya Gyani — My Account</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="/supabase-client.js"></script><style>:root{--gold:#ffc400;--bg:#090a0b;--card:#17181b;--line:#303136;--muted:#aaa}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:#fff;font-family:system-ui,-apple-system,"Noto Sans Devanagari",sans-serif}.app{max-width:620px;margin:auto;min-height:100vh}.top{height:62px;background:var(--gold);color:#111;display:flex;align-items:center;padding:0 15px;gap:12px}.top a{font-size:27px;color:#111;text-decoration:none}.brand{font-size:20px;font-weight:900}.card{margin:14px;background:var(--card);border:1px solid var(--line);border-radius:17px;padding:17px}.field{margin:12px 0}.field label{display:block;font-size:13px;margin-bottom:6px}.field input{width:100%;padding:12px;border-radius:10px;border:1px solid #444;background:#0d0d0d;color:#fff}.btn{width:100%;padding:12px;border:0;border-radius:10px;background:var(--gold);color:#111;font-weight:900}.msg{display:none;padding:11px;border-radius:10px;margin:12px 14px}.msg.show{display:block}.ok{background:#10321f;color:#baf5cf}.err{background:#3a1111;color:#ffbaba}</style></head><body><div class="app"><header class="top"><a href="/">‹</a><div class="brand">मेरा अकाउंट</div></header><div id="msg" class="msg"></div><form id="f" class="card"><div style="display:flex;gap:14px;align-items:center;margin-bottom:16px"><img id="avatar" style="width:76px;height:76px;border-radius:50%;object-fit:cover;background:#333;border:2px solid #ffc400" alt=""><div><b>User Profile</b><div style="color:#aaa;font-size:12px">यह section केवल आपके user profile की details रखता है.</div></div></div><div class="field"><label>Profile Photo</label><input id="photo" type="file" accept="image/jpeg,image/png,image/webp"></div><div class="field"><label>नाम</label><input id="name" required></div><div class="field"><label>Mobile</label><input id="phone"></div><div class="field"><label>Email</label><input id="email" disabled></div><button class="btn">Save Changes</button></form></div><script>const $=s=>document.querySelector(s);function msg(t,ok=false){$('#msg').textContent=t;$('#msg').className='msg show '+(ok?'ok':'err')}function compress(file){return new Promise((resolve,reject)=>{const fr=new FileReader();fr.onload=()=>{const im=new Image();im.onload=()=>{let w=700,h=Math.round(im.height*700/im.width);if(h>700){h=700;w=Math.round(im.width*700/im.height)}const c=document.createElement('canvas');c.width=w;c.height=h;c.getContext('2d').drawImage(im,0,0,w,h);resolve(c.toDataURL('image/jpeg',.82))};im.onerror=reject;im.src=fr.result};fr.onerror=reject;fr.readAsDataURL(file)})}async function run(){try{const t=await window.SM_SUPABASE.getAccessToken();const r=await fetch('/api/role-profile',{headers:{Authorization:'Bearer '+t}}),j=await r.json();if(!r.ok)throw Error(j.error||'Account load failed');const p=j.profile||{};$('#name').value=p.full_name||'';$('#phone').value=p.phone||'';$('#email').value=p.email||'';$('#avatar').src=p.avatar_url||''}catch(e){msg(e.message)}}$('#f').onsubmit=async e=>{e.preventDefault();try{const b={full_name:$('#name').value.trim(),phone:$('#phone').value.trim()};const f=$('#photo').files[0];if(f)b.avatar_data_url=await compress(f);const t=await window.SM_SUPABASE.getAccessToken();const r=await fetch('/api/role-profile',{method:'PATCH',headers:{Authorization:'Bearer '+t,'Content-Type':'application/json'},body:JSON.stringify(b)}),j=await r.json();if(!r.ok)throw Error(j.error||'Save failed');$('#avatar').src=j.profile?.avatar_url||$('#avatar').src;msg('User profile updated','ok')}catch(e){msg(e.message)}};run();</script></body></html>

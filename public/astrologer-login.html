<!doctype html><html lang="hi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Astrologer Login — Bhavishya Gyani</title><script src="/supabase-client.js"></script><style>:root{--gold:#ffc400;--bg:#070707;--card:#151515;--line:#333;--muted:#aaa}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at top,#2a2108,#070707 45%);color:#fff;font-family:system-ui,-apple-system,"Noto Sans Devanagari",sans-serif;padding:18px}.wrap{max-width:460px;margin:auto}.top{display:flex;align-items:center;gap:12px;margin:8px 0 18px}.top a{font-size:28px;text-decoration:none}.brand{font-size:21px;font-weight:900}.card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:22px}h1{font-size:24px;margin:0 0 6px}.muted{color:var(--muted);font-size:13px;line-height:1.5}.field{margin:13px 0}label{display:block;font-size:13px;margin-bottom:6px}input{width:100%;padding:13px;border-radius:11px;border:1px solid #444;background:#0a0a0a;color:#fff}button{width:100%;padding:13px;border:0;border-radius:11px;background:var(--gold);font-weight:900;font-size:15px}.msg{margin:12px 0;padding:11px;border-radius:10px;display:none;font-size:13px}.msg.show{display:block}.err{background:#3b1010;color:#ffb8b8}.ok{background:#0c2d1c;color:#b8f5ce}.links{margin-top:15px;text-align:center;font-size:12px;color:#aaa}.links a{color:#ffc400;font-weight:800}</style></head><body><div class="wrap"><div class="top"><a href="/">‹</a><div class="brand">☀ Bhavishya Gyani</div></div><div class="card"><h1>Astrologer Login</h1><div class="muted">केवल approved Astrologer account के लिए.</div><div id="msg" class="msg"></div><form id="f"><div class="field"><label>Email / Mobile</label><input id="email" type="text" required autocomplete="email"></div><div class="field"><label>Password</label><input id="password" type="password" required minlength="6" autocomplete="current-password"></div><button id="go">Login</button></form><div class="links"><a href="/astrologer-register.html">New Astrologer Registration</a></div></div></div><script>const $=s=>document.querySelector(s);function msg(t,ok=false){$('#msg').textContent=t;$('#msg').className='msg show '+(ok?'ok':'err')}$('#f').onsubmit=async e=>{e.preventDefault();$('#go').disabled=true;try{const r=await fetch('/api/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({identifier:$('#email').value.trim(),password:$('#password').value,account_type:'astrologer'})});const j=await r.json().catch(()=>({}));if(!r.ok)throw Error(j.error||'Login failed');window.SM_SUPABASE._saveToken(j.token);msg('Login सफल। Panel खोला जा रहा है…',true);setTimeout(()=>location.href='/astrologer-dashboard.html',250)}catch(e){msg(e.message)}finally{$('#go').disabled=false}};</script></body></html>

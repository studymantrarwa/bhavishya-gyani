<!doctype html><html lang="hi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Astrologer Login — Bhavishya Gyani</title></head><body style="background:#070707;color:#fff;font-family:system-ui;padding:20px"><main style="max-width:460px;margin:auto;background:#151515;padding:22px;border-radius:18px"><h1>Astrologer Login</h1><p>यह केवल अलग Astrologer account के लिए है। Admin approval जरूरी है।</p><div id="m"></div><form id="f"><p>Email<br><input id="e" type="email" required style="width:100%;padding:12px"></p><p>Password<br><input id="p" type="password" minlength="6" required style="width:100%;padding:12px"></p><button style="width:100%;padding:13px">Astrologer Login</button></form><p><a href="/astrologer-register.html">New Astrologer Registration</a></p></main><script src="/supabase-client.js"></script><script>const $=s=>document.querySelector(s);$('#f').onsubmit=async e=>{e.preventDefault();try{const r=await fetch('/api/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({account_type:'astrologer',email:$('#e').value.trim(),password:$('#p').value})});const j=await r.json();if(!r.ok)throw Error(j.error);SM_SUPABASE._saveToken(j.token,'astrologer');location.href='/astrologer-dashboard.html'}catch(x){$('#m').textContent=x.message}}</script></body></html>

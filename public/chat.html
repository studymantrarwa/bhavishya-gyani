<!doctype html><html lang="hi"><head>
<script src="/auth-guard.js"></script><script>BG_AUTH.check("user");</script><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Bhavishya Gyani — Chat</title><script src="/supabase-client.js"></script>
<style>:root{--bg:#0b0d10;--panel:#15181d;--line:#2a2f37;--text:#f5f7fa;--muted:#9da5b1;--gold:#ffc400;--green:#27d86a;--blue:#1689ff;--bubble:#20262d;--mine:#075e54}*{box-sizing:border-box}html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Noto Sans Devanagari",sans-serif}button,input,textarea{font:inherit}.app{height:100%;max-width:980px;margin:auto;display:grid;grid-template-columns:340px 1fr;background:var(--panel)}.list{border-right:1px solid var(--line);display:flex;flex-direction:column;min-width:0}.top{height:64px;background:#111419;border-bottom:1px solid var(--line);display:flex;align-items:center;padding:0 15px;gap:10px}.brand{font-weight:900;font-size:19px;flex:1}.sub{font-size:11px;color:var(--muted)}.icon{border:0;background:transparent;color:#fff;font-size:22px;padding:7px;cursor:pointer}.search{padding:9px 12px;background:#111419;border-bottom:1px solid var(--line)}.search input{width:100%;border:1px solid var(--line);border-radius:10px;background:#0b0d10;color:#fff;padding:10px 12px;outline:none}.tabs{display:flex;gap:5px;padding:8px;border-bottom:1px solid var(--line);overflow:auto}.tabs button{white-space:nowrap;border:0;background:#20242a;color:#aeb5c0;border-radius:99px;padding:7px 11px;font-size:11px}.tabs button.active{background:var(--gold);color:#111;font-weight:800}.rows{overflow:auto;flex:1}.row{display:flex;align-items:center;gap:11px;padding:13px;border-bottom:1px solid #22262c;cursor:pointer}.row.active{background:#20242a}.avatar{width:49px;height:49px;border-radius:50%;object-fit:cover;background:#30353c;display:grid;place-items:center;font-weight:900;flex:none}.rowmain{min-width:0;flex:1}.rowtop{display:flex;justify-content:space-between;gap:8px}.name{font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.time{font-size:10px;color:var(--muted);white-space:nowrap}.preview{color:var(--muted);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:4px}.badge{display:inline-block;margin-top:5px;background:#3a4048;color:#dce2ea;border-radius:99px;padding:3px 7px;font-size:9px}.badge.green{background:#123e26;color:#7df2a3}.badge.gold{background:#594700;color:#ffe16b}.chat{display:flex;flex-direction:column;min-width:0;background:#0f1216}.chathead{height:64px;background:#15191e;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px;padding:0 13px}.chathead .info{flex:1;min-width:0}.chathead .info b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.chathead .info small{color:var(--muted);font-size:11px}.online{color:#50e47d}.offline{color:var(--muted)}.messages{flex:1;overflow:auto;padding:18px 13px;background:radial-gradient(circle at top,#171b21,#0f1216 55%);display:flex;flex-direction:column;gap:6px}.empty{margin:auto;text-align:center;color:var(--muted);padding:25px}.bubble{max-width:min(78%,520px);padding:8px 10px 6px;border-radius:12px;background:var(--bubble);align-self:flex-start}.bubble.mine{align-self:flex-end;background:var(--mine)}.body{font-size:14px;white-space:pre-wrap;word-break:break-word}.meta{display:flex;justify-content:flex-end;gap:5px;margin-top:3px;font-size:9px;color:#aeb6c0}.ticks.read{color:#54b8ff}.composer{display:flex;gap:8px;padding:9px;background:#171b20;border-top:1px solid var(--line)}.composer textarea{flex:1;resize:none;max-height:100px;min-height:44px;border:1px solid var(--line);border-radius:12px;background:#0d1014;color:#fff;padding:11px;outline:none}.send{width:48px;height:44px;border:0;border-radius:12px;background:var(--gold);color:#111;font-weight:900}.typing{height:20px;padding:0 14px;color:#75d9ff;font-size:11px;background:#171b20}.requestbar{padding:10px 13px;background:#30280d;border-bottom:1px solid #574900;font-size:12px}.requestbar button{border:0;border-radius:8px;padding:7px 10px;margin:3px;font-weight:800}.accept{background:var(--green)}.blue{background:var(--blue);color:#fff}.support{margin:10px;border:1px solid #2d3948;border-radius:12px;background:#18212b;color:#cbd7e4;padding:11px;font-size:12px}@media(max-width:720px){.app{display:block;position:relative}.list{height:100%;border-right:0}.chat{position:fixed;inset:0;z-index:20;display:none}.chat.open{display:flex}.mobileBack{display:inline-block}.top{height:58px}.brand{font-size:18px}.bubble{max-width:86%}}</style></head><body><div class="app"><section class="list" id="list"><header class="top"><div><div class="brand">Bhavishya Gyani</div><div class="sub" id="meLabel">Chat</div></div><button class="icon" onclick="location.href='/'">⌂</button></header><div class="search"><input id="search" placeholder="Search chat..."></div><div class="tabs"><button class="active" data-tab="all">All</button><button data-tab="active">Active</button><button data-tab="requests">Requests</button><button data-tab="closed">Closed</button></div><div class="rows" id="rows"></div><div class="support">🔒 Conversation access केवल authorized participants के लिए है।</div></section><section class="chat" id="chat"><header class="chathead"><button class="icon mobileBack" id="back">‹</button><div class="avatar" id="headAvatar">?</div><div class="info"><b id="headName">Chat चुनें</b><small id="headStatus">Connecting…</small></div><button class="icon" id="refresh">↻</button><button class="icon" id="close">⋮</button></header><div id="requestbar"></div><div class="messages" id="messages"><div class="empty">बाईं तरफ से कोई chat चुनें।</div></div><div class="typing" id="typing"></div><div class="composer"><textarea id="input" placeholder="Message लिखें…" rows="1" disabled></textarea><button class="send" id="send" disabled>➤</button></div></section></div>
<script>
const $=s=>document.querySelector(s);let session=null,me=null,convs=[],current=null,realtime=null,userRealtime=null,tab='all',poll=null,typingTimer=null;
const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
async function api(url,opt={}){const t=await window.SM_SUPABASE.getAccessToken();if(!t)throw Error('Login required');opt.headers={...(opt.headers||{}),Authorization:'Bearer '+t};const r=await fetch(url,opt);const j=await r.json().catch(()=>({}));if(!r.ok)throw Error(j.error||'Request failed');return j}
function other(c){if(c.user_id===me.id)return c.astrologer||c.admin||{full_name:'Support'};return c.user||c.admin||c.astrologer||{full_name:'User'}}
function fmt(v){try{return new Date(v).toLocaleTimeString('en-IN',{hour:'2-digit',minute:'2-digit'})}catch(e){return ''}}
function avatar(p){return p?.avatar_url?`<img class="avatar" src="${esc(p.avatar_url)}" alt="">`:`<div class="avatar">${esc((p?.full_name||'?').slice(0,1))}</div>`}
function badge(c){if(c.status==='accepted')return '<span class="badge green">Active</span>';if(['requested','astrologer_accepted'].includes(c.status))return '<span class="badge gold">Request</span>';return `<span class="badge">${esc(c.status)}</span>`}
function renderList(){const q=$('#search').value.trim().toLowerCase();const rows=convs.filter(c=>{const ok=tab==='all'||(tab==='active'&&c.status==='accepted')||(tab==='requests'&&['requested','astrologer_accepted'].includes(c.status))||(tab==='closed'&&c.status==='closed');const p=other(c);return ok&&(!q||(`${p?.full_name||''} ${c.channel||''}`).toLowerCase().includes(q))});$('#rows').innerHTML=rows.map(c=>{const p=other(c);return `<div class="row ${current?.id===c.id?'active':''}" data-id="${esc(c.id)}">${avatar(p)}<div class="rowmain"><div class="rowtop"><span class="name">${esc(p?.full_name||'Chat')}</span><span class="time">${fmt(c.last_message_at||c.created_at)}</span></div><div class="preview">${esc(c.channel==='support'?'Admin Support':(c.channel||'chat'))}</div>${badge(c)}</div></div>`}).join('')||'<div class="empty">इस section में कोई chat नहीं है।</div>';document.querySelectorAll('.row[data-id]').forEach(x=>x.onclick=()=>openChat(x.dataset.id))}
async function loadConversations(){const x=await api('/api/chat');convs=x.conversations||[];renderList();if(current){const f=convs.find(c=>c.id===current.id);if(f)current=f}}
function setHeader(){const p=other(current);$('#headName').textContent=p?.full_name||'Chat';const old=$('#headAvatar');const el=p?.avatar_url?document.createElement('img'):document.createElement('div');el.className='avatar';el.id='headAvatar';if(p?.avatar_url){el.src=p.avatar_url;el.alt=''}else el.textContent=(p?.full_name||'?').slice(0,1);old.replaceWith(el)}
function requestBar(c){if(c.status==='requested')return `<div class="requestbar">Request भेजी गई है। Astrologer के पास 2 मिनट हैं accept करने के लिए.</div>`;if(c.status==='astrologer_accepted'&&me.role==='user')return `<div class="requestbar">Astrologer ने accept किया है। <button class="accept" id="confirmBtn">Confirm & Start Chat</button></div>`;if(c.status==='astrologer_accepted')return `<div class="requestbar">आपने accept किया है। User confirmation pending है.</div>`;if(c.status==='accepted'&&c.channel==='call')return `<div class="requestbar">Call active है। <button class="blue" id="callBtn">Start Voice Call</button></div>`;if(c.status==='closed')return '<div class="requestbar">Chat closed है। History सुरक्षित है.</div>';if(c.status==='missed')return `<div class="requestbar">Request missed (${esc(c.missed_by||'unknown')}).</div>`;return ''}
async function renderCurrent(data){current=data.conversation;setHeader();$('#requestbar').innerHTML=requestBar(current);$('#messages').innerHTML='';(data.messages||[]).forEach(addMessage);const active=current.status==='accepted';$('#input').disabled=!active;$('#send').disabled=!active;$('#requestbar').querySelector('#confirmBtn')?.addEventListener('click',confirmChat);$('#requestbar').querySelector('#callBtn')?.addEventListener('click',()=>location.href='/call.html?conversation_id='+encodeURIComponent(current.id));if(innerWidth<=720)$('#chat').classList.add('open');markRead();await setupRealtime()}
async function openChat(id){try{const x=await api('/api/chat?conversation_id='+encodeURIComponent(id));await renderCurrent(x);renderList()}catch(e){alert(e.message)}}
function addMessage(m){if(document.querySelector(`[data-message="${CSS.escape(String(m.id))}"]`))return;const d=document.createElement('div');d.className='bubble '+(m.sender_id===me.id?'mine':'');d.dataset.message=m.id;d.innerHTML=`<div class="body">${esc(m.body)}</div><div class="meta">${fmt(m.created_at)} ${m.sender_id===me.id?`<span class="ticks ${m.read_at?'read':''}">${m.read_at?'✓✓':'✓'}</span>`:''}</div>`;$('#messages').appendChild(d);$('#messages').scrollTop=$('#messages').scrollHeight}
async function refreshCurrent(){if(!current)return;await openChat(current.id)}
async function markRead(){if(!current||current.status!=='accepted')return;try{await api('/api/messages',{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify({conversationId:current.id,action:'read'})})}catch(e){}}
async function send(){const text=$('#input').value.trim();if(!text||!current||current.status!=='accepted')return;$('#input').value='';try{const x=await api('/api/messages',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({conversationId:current.id,body:text})});addMessage(x.message);await loadConversations()}catch(e){alert(e.message)}}
async function confirmChat(){try{await api('/api/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action:'user-confirm',conversationId:current.id})});await openChat(current.id)}catch(e){alert(e.message)}}
async function closeCurrent(){if(!current||!confirm('इस chat को close करें? History सुरक्षित रहेगी।'))return;try{await api('/api/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action:'close',conversationId:current.id})});await openChat(current.id);await loadConversations()}catch(e){alert(e.message)}}
async function setupUserRealtime(){try{if(userRealtime)await userRealtime.unsubscribe();const sb=await window.SM_SUPABASE.init();if(!sb||!me)return;userRealtime=sb.channel('user:'+me.id);userRealtime.on('postgres_changes',{event:'*',schema:'public',table:'conversations'},()=>loadConversations().catch(()=>{}));await userRealtime.subscribe()}catch(e){}}
async function setupRealtime(){try{if(realtime){await realtime.unsubscribe();realtime=null}const sb=await window.SM_SUPABASE.init();if(!sb||!current)return;realtime=sb.channel('chat:'+current.id);realtime.on('postgres_changes',{event:'INSERT',schema:'public',table:'messages',filter:'conversation_id=eq.'+current.id},payload=>{if(payload.new?.sender_id!==me.id){addMessage(payload.new);markRead()}loadConversations()}).on('postgres_changes',{event:'UPDATE',schema:'public',table:'messages',filter:'conversation_id=eq.'+current.id},payload=>{const el=document.querySelector(`[data-message="${CSS.escape(String(payload.new?.id||''))}"]`);if(el&&payload.new?.read_at){const tick=el.querySelector('.ticks');if(tick){tick.textContent='✓✓';tick.classList.add('read')}}}).on('postgres_changes',{event:'UPDATE',schema:'public',table:'conversations',filter:'id=eq.'+current.id},()=>openChat(current.id)).on('broadcast',{event:'typing'},e=>{if(e.payload?.user_id!==me.id)$('#typing').textContent=e.payload?.typing?'Typing…':''});await realtime.subscribe(status=>{if(status==='SUBSCRIBED')$('#headStatus').textContent='● Live Chat';else if(status==='CHANNEL_ERROR'||status==='TIMED_OUT')$('#headStatus').textContent='○ Reconnecting…'})}catch(e){$('#headStatus').textContent='● Realtime reconnecting'}}
$('#input').addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();send()}if(current&&realtime){clearTimeout(typingTimer);realtime.send({type:'broadcast',event:'typing',payload:{user_id:me.id,typing:true}});typingTimer=setTimeout(()=>realtime?.send({type:'broadcast',event:'typing',payload:{user_id:me.id,typing:false}}),900)}});
$('#send').onclick=send;$('#refresh').onclick=refreshCurrent;$('#close').onclick=closeCurrent;$('#back').onclick=()=>$('#chat').classList.remove('open');$('#search').oninput=renderList;document.querySelectorAll('.tabs button').forEach(b=>b.onclick=()=>{document.querySelectorAll('.tabs button').forEach(x=>x.classList.remove('active'));b.classList.add('active');tab=b.dataset.tab;renderList()});
async function startNew(){const p=new URLSearchParams(location.search),type=p.get('new'),aid=p.get('astrologer_id');if(!type)return;if(type==='chat'||type==='call'){const x=await api('/api/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action:type==='chat'?'request':type,astrologerId:aid})});history.replaceState({},'',`/chat.html?conversation_id=${encodeURIComponent(x.conversation.id)}`);await loadConversations();await openChat(x.conversation.id)}}
(async()=>{try{session=await window.SM_SUPABASE.getSession();if(!session)return location.replace('/');const x=await api('/api/me');me=x.user;if(!me?.id)throw Error('Account identity नहीं मिली');$('#meLabel').textContent=(me.name||me.email||'Account')+' • '+me.role;await loadConversations();await setupUserRealtime();const p=new URLSearchParams(location.search);if(p.get('conversation_id'))await openChat(p.get('conversation_id'));else if(p.get('support')==='1'&&me.role==='user'){const x=await api('/api/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action:'request'})});history.replaceState({},'',`/chat.html?conversation_id=${encodeURIComponent(x.conversation.id)}`);await loadConversations();await openChat(x.conversation.id)}else await startNew();poll=setInterval(()=>loadConversations().catch(()=>{}),5000)}catch(e){alert(e.message);location.replace('/')}})();
</script></body></html>

<!doctype html><html lang="hi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Chat — Bhavishya Gyani</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="/supabase-client.js"></script><style>
:root{--gold:#ffd21a;--bg:#0f1012;--list:#15171a;--line:#2d3136;--text:#fff;--muted:#9ea5ae;--mine:#c8f7a5;--other:#fff;--chat:#e9e5db;--blue:#1f91ff;--green:#43d96f}*{box-sizing:border-box}body{margin:0;background:#08090a;font-family:system-ui,-apple-system,"Noto Sans Devanagari",sans-serif;color:#111}.app{max-width:900px;margin:auto;height:100vh;background:var(--chat);display:flex;flex-direction:column}.top{height:62px;flex:0 0 62px;background:var(--gold);display:flex;align-items:center;gap:10px;padding:0 12px}.top a{color:#111;text-decoration:none;font-size:28px}.brand{font-weight:900;font-size:18px;flex:1;color:#111}.top button{border:0;background:#111;color:#fff;border-radius:8px;padding:8px;font-weight:800}.listView{height:100%;display:flex;flex-direction:column;background:var(--list);color:var(--text)}.search{margin:10px 12px;border:1px solid var(--line);background:#202328;color:#fff;border-radius:22px;padding:11px 15px;outline:none}.tabs{display:grid;grid-template-columns:repeat(4,1fr);border-bottom:1px solid var(--line)}.tabs button{border:0;background:transparent;color:#9299a2;padding:12px 4px;font-weight:800}.tabs button.active{color:var(--gold);border-bottom:2px solid var(--gold)}.rows{flex:1;overflow:auto}.row{display:flex;gap:11px;align-items:center;padding:12px;border-bottom:1px solid #25282d;cursor:pointer}.avatar{width:50px;height:50px;border-radius:50%;background:#555;color:#fff;display:grid;place-items:center;font-weight:900;overflow:hidden;flex:0 0 50px}.avatar img{width:100%;height:100%;object-fit:cover}.rowmain{flex:1;min-width:0}.rowname{font-weight:900}.preview{color:#9ea5ae;font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:3px}.rowmeta{text-align:right;color:#858c95;font-size:10px}.pill{display:inline-block;background:#2b2f35;border-radius:999px;padding:3px 6px;margin-top:5px;font-size:9px}.empty{padding:45px 25px;text-align:center;color:#8e959e}.chatView{display:none;height:100%;flex-direction:column}.chathead{height:62px;flex:0 0 62px;background:var(--gold);display:flex;align-items:center;gap:9px;padding:0 9px}.chathead .back{font-size:28px;border:0;background:none}.headmain{flex:1;min-width:0}.headname{font-weight:900;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.headsub{font-size:10px;color:#5d5200}.headactions{display:flex;gap:5px}.headactions button{border:0;background:#111;color:#fff;border-radius:8px;padding:7px 8px;font-size:10px;font-weight:800}.state{background:#fff5c5;padding:9px;text-align:center;font-size:11px}.state.confirm{background:#dff2ff;color:#125a8f}.state.danger{background:#ffe0e2;color:#8b151b}.info{background:#fff;padding:7px 10px;border-bottom:1px solid #ccc}.birth{display:flex;gap:8px;flex-wrap:wrap;color:#555;font-size:10px}.open{margin-top:5px;border:0;background:var(--blue);color:#fff;border-radius:7px;padding:6px 9px;font-size:10px;font-weight:800}.messages{flex:1;overflow:auto;padding:10px;background:var(--chat)}.bubble{max-width:78%;width:max-content;background:var(--other);border-radius:9px;padding:7px 9px;margin:5px 0;box-shadow:0 1px 2px #0002;font-size:14px;white-space:pre-wrap;overflow-wrap:anywhere}.mine{margin-left:auto;background:var(--mine)}.time{font-size:9px;color:#777;text-align:right;margin-top:3px}.typing{height:19px;background:var(--chat);font-size:10px;color:#777;padding:0 12px}.composer{display:flex;gap:7px;padding:8px;background:#f4f3ee;border-top:1px solid #ccc}.composer input{flex:1;border:1px solid #ccc;border-radius:22px;padding:11px 13px;outline:none;font-size:14px}.composer button{width:45px;border:0;border-radius:50%;background:var(--gold);font-size:19px}.archive{background:#edf6ff;color:#16527d;padding:7px 10px;font-size:10px}.listHead{padding:13px 14px 4px;font-size:18px;font-weight:900}.fab{position:absolute;right:18px;bottom:18px;border:0;background:var(--gold);width:54px;height:54px;border-radius:50%;font-size:25px;font-weight:900;box-shadow:0 4px 15px #0005}
</style></head><body><div class="app"><section id="listView" class="listView"><header class="top"><a href="/dashboard.html">‹</a><div class="brand">Bhavishya Gyani</div><button onclick="loadList()">↻</button></header><div class="listHead">Chats</div><input id="search" class="search" placeholder="Search chats…" oninput="renderList()"><div class="tabs"><button class="active" data-tab="all" onclick="setTab('all')">All</button><button data-tab="active" onclick="setTab('active')">Active</button><button data-tab="requests" onclick="setTab('requests')">Requests</button><button data-tab="closed" onclick="setTab('closed')">Closed</button></div><div id="rows" class="rows"></div><button class="fab" onclick="location.href='/dashboard.html#astrologers'">＋</button></section><section id="chatView" class="chatView"><header class="chathead"><button class="back" onclick="showList()">‹</button><div id="av"></div><div class="headmain"><div id="name" class="headname">Chat</div><div id="sub" class="headsub">Connecting…</div></div><div class="headactions"><button onclick="openKundli()">Kundli</button><button onclick="endChat()">End</button></div></header><div id="info" class="info"></div><div id="state"></div><div id="archive"></div><div id="messages" class="messages"></div><div id="typing" class="typing"></div><form id="composer" class="composer"><input id="input" autocomplete="off" placeholder="Message लिखें…"><button type="submit">➤</button></form></section></div><script>
const $=s=>document.querySelector(s),token=()=>localStorage.getItem('studyMantraToken'),params=new URLSearchParams(location.search);let cid=params.get('conversation_id'),me=null,conv=null,all=[],tab='all',channel=null,poll=null,typingTimer=null;const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));async function api(url,opt={}){opt.headers={...(opt.headers||{}),Authorization:'Bearer '+token()};const r=await fetch(url,opt);const j=await r.json().catch(()=>({}));if(!r.ok)throw Error(j.error||'Request failed');return j}
function avatar(p){return p?.avatar_url?`<div class="avatar"><img src="${esc(p.avatar_url)}"></div>`:`<div class="avatar">${esc((p?.full_name||'A').slice(0,1))}</div>`}function label(c){return c.status==='accepted'?'Active':c.status==='requested'?'Request pending':c.status==='astrologer_accepted'?'Confirm required':c.status==='closed'?'Closed':c.status==='missed'?'Missed':c.status||''}function showList(){if(poll){clearInterval(poll);poll=null}if(channel&&window.SM_SUPABASE){try{channel.unsubscribe()}catch(e){}}channel=null;$('#chatView').style.display='none';$('#listView').style.display='flex';cid=null;history.replaceState({},'', '/chat.html');loadList()}
function setTab(t){tab=t;document.querySelectorAll('.tabs button').forEach(b=>b.classList.toggle('active',b.dataset.tab===t));renderList()}function renderList(){const q=($('#search').value||'').toLowerCase().trim();const rows=all.filter(c=>{const ok=tab==='all'||(tab==='active'&&c.status==='accepted')||(tab==='requests'&&['requested','astrologer_accepted'].includes(c.status))||(tab==='closed'&&['closed','missed','rejected'].includes(c.status));const o=c.user_id===me.user.id?c.astrologer:c.user;return ok&&(!q||String(o?.full_name||'').toLowerCase().includes(q))}).map(c=>{const o=c.user_id===me.user.id?c.astrologer:c.user;const d=c.last_message_at||c.closed_at||c.created_at;return `<div class="row" onclick="openChat('${esc(c.id)}')">${avatar(o)}<div class="rowmain"><div class="rowname">${esc(o?.full_name||'Astrologer')}</div><div class="preview">${esc(c.status==='accepted'?'Open one-to-one chat':'View request status')}</div><span class="pill">${esc(label(c))}</span></div><div class="rowmeta">${d?new Date(d).toLocaleDateString([], {day:'2-digit',month:'short'}):''}</div></div>`}).join('');$('#rows').innerHTML=rows||'<div class="empty">अभी इस section में कोई chat नहीं है। Dashboard से astrologer चुनकर Chat request भेजें।</div>'}
async function loadList(){try{const x=await api('/api/chat');all=x.conversations||[];renderList()}catch(e){$('#rows').innerHTML=`<div class="empty">${esc(e.message)}</div>`}}
function openChat(id){cid=id;history.replaceState({},'', '/chat.html?conversation_id='+encodeURIComponent(id));$('#listView').style.display='none';$('#chatView').style.display='flex';loadChat();poll=setInterval(loadChat,8000)}
function renderMessages(rows){const box=$('#messages'),near=box.scrollHeight-box.scrollTop-box.clientHeight<100;box.innerHTML=(rows||[]).map(m=>`<div class="bubble ${m.sender_id===me.user.id?'mine':''}">${esc(m.body)}<div class="time">${new Date(m.created_at).toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'})}${m.sender_id===me.user.id?' ✓✓':''}</div></div>`).join('')||'<div class="empty">अभी कोई message नहीं है।</div>';if(near)box.scrollTop=box.scrollHeight}
function renderState(){if(!conv)return;let h='';if(conv.status==='requested')h=`<div class="state">Astrologer acceptance pending · <b data-deadline="${esc(new Date(new Date(conv.requested_at).getTime()+120000).toISOString())}">02:00</b></div>`;else if(conv.status==='astrologer_accepted'&&me.user.role==='user')h=`<div class="state confirm">Astrologer ने accept किया। Confirmation दें · <b data-deadline="${esc(conv.user_confirm_deadline)}">02:00</b><br><button class="open" onclick="confirmChat()">Confirm Chat</button></div>`;else if(conv.status==='astrologer_accepted')h='<div class="state confirm">User confirmation का इंतज़ार है।</div>';else if(conv.status==='missed')h=`<div class="state danger">Request missed${conv.missed_by?' by '+esc(conv.missed_by):''}.</div>`;else if(conv.status==='closed')h='<div class="state">Chat ended. History available है।</div>';$('#state').innerHTML=h;$('#archive').innerHTML=conv.history_visibility==='permanent_archive'?'<div class="archive">📚 Permanent Archive — read only</div>':'';$('#composer').style.display=conv.status==='accepted'&&conv.channel==='chat'?'flex':'none'}
function renderInfo(){const other=me.user.role==='astrologer'?conv?.user:conv?.astrologer;$('#av').innerHTML=avatar(other);$('#name').textContent=other?.full_name||'User';$('#sub').textContent=conv?.status==='accepted'?'● Live Chat':label(conv);const k=conv?.kundli;$('#info').innerHTML=k?`<div class="birth"><span><b>नाम:</b> ${esc(k.name)}</span><span><b>DOB:</b> ${esc(k.dob)}</span><span><b>Time:</b> ${esc(k.birth_time)}</span><span><b>Place:</b> ${esc(k.place)}</span></div><button class="open" onclick="openKundli()">▣ Open Kundli</button>`:'<div class="birth">Kundli details confirmation के बाद उपलब्ध होंगे।</div>'}
async function loadChat(){if(!cid)return;try{const x=await api('/api/chat?conversation_id='+encodeURIComponent(cid));conv=x.conversation;renderInfo();renderState();renderMessages(x.messages||[]);startDeadlineTimer();if(!channel)setupRealtime()}catch(e){$('#messages').innerHTML=`<div class="empty">${esc(e.message)}</div>`}}
async function confirmChat(){try{await api('/api/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action:'user-confirm',conversationId:cid})});await loadChat()}catch(e){alert(e.message);await loadChat()}}async function endChat(){if(!conv||!['accepted','astrologer_accepted'].includes(conv.status))return;if(!confirm('Chat end करना है?'))return;try{await api('/api/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action:'close',conversationId:cid})});await loadChat()}catch(e){alert(e.message)}}async function send(){const v=$('#input').value.trim();if(!v||conv?.status!=='accepted')return;$('#input').value='';try{await api('/api/messages',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({conversationId:cid,body:v})});await loadChat()}catch(e){alert(e.message);$('#input').value=v}}
function startDeadlineTimer(){document.querySelectorAll('[data-deadline]').forEach(el=>{if(el._timer)clearInterval(el._timer);const tick=()=>{const ms=new Date(el.dataset.deadline).getTime()-Date.now();if(ms<=0){el.textContent='00:00';loadChat();clearInterval(el._timer)}else{const s=Math.floor(ms/1000);el.textContent=String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0')}};tick();el._timer=setInterval(tick,1000)})}
async function setupRealtime(){try{const sb=await window.SM_SUPABASE?.init();if(!sb)return;channel=sb.channel('bg-chat-'+cid);channel.on('postgres_changes',{event:'INSERT',schema:'public',table:'messages',filter:'conversation_id=eq.'+cid},p=>{if(p.new?.sender_id!==me.user.id)loadChat()});channel.on('postgres_changes',{event:'UPDATE',schema:'public',table:'conversations',filter:'id=eq.'+cid},()=>loadChat());await channel.subscribe()}catch(e){channel=null}}
$('#input').addEventListener('input',()=>{if(channel){channel.send({type:'broadcast',event:'typing',payload:{sender_id:me.user.id,typing:true}});clearTimeout(typingTimer);typingTimer=setTimeout(()=>channel.send({type:'broadcast',event:'typing',payload:{sender_id:me.user.id,typing:false}}),900)}});$('#composer').onsubmit=e=>{e.preventDefault();send()};function openKundli(){if(conv?.kundli?.id)location.href='/shared-kundli.html?kundali_id='+encodeURIComponent(conv.kundli.id);else alert('Kundli अभी available नहीं है।')} 
(async()=>{try{if(!token())return location.href='/auth.html';me=await api('/api/me');if(me.user?.role==='admin')return location.href='/admin-panel.html';if(me.user?.role==='astrologer'&&!cid)return location.href='/astrologer-dashboard.html';if(cid){$('#listView').style.display='none';$('#chatView').style.display='flex';await loadChat();poll=setInterval(loadChat,8000)}else await loadList()}catch(e){alert(e.message);location.href='/auth.html'}})();
</script></body></html>

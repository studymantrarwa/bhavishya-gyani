<!doctype html><html lang="hi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Bhavishya Gyani — Chats</title><script src="/supabase-client.js"></script><style>
:root{--bg:#0b0d10;--panel:#15181d;--line:#2a2f37;--text:#f5f7fa;--muted:#9da5b1;--gold:#ffc400;--green:#27d86a;--blue:#1689ff;--bubble:#20262d;--mine:#075e54}*{box-sizing:border-box}html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Noto Sans Devanagari",sans-serif}button,input,textarea{font:inherit}.app{height:100%;max-width:1000px;margin:auto;display:grid;grid-template-columns:350px 1fr;background:var(--panel)}.list{border-right:1px solid var(--line);display:flex;flex-direction:column;min-width:0}.top{height:64px;background:#111419;border-bottom:1px solid var(--line);display:flex;align-items:center;padding:0 15px;gap:10px}.brand{font-weight:900;font-size:19px;flex:1}.sub{font-size:11px;color:var(--muted)}.icon{border:0;background:transparent;color:#fff;font-size:22px;padding:7px;cursor:pointer}.search{padding:9px 12px;background:#111419;border-bottom:1px solid var(--line)}.search input{width:100%;border:1px solid var(--line);border-radius:10px;background:#0b0d10;color:#fff;padding:10px 12px;outline:none}.tabs{display:flex;gap:5px;padding:8px;border-bottom:1px solid var(--line);overflow:auto}.tabs button{white-space:nowrap;border:0;background:#20242a;color:#aeb5c0;border-radius:99px;padding:7px 11px;font-size:11px}.tabs button.active{background:var(--gold);color:#111;font-weight:800}.rows{overflow:auto;flex:1}.row{display:flex;align-items:center;gap:11px;padding:13px;border-bottom:1px solid #22262c;cursor:pointer}.row.active{background:#20242a}.avatar{width:49px;height:49px;border-radius:50%;object-fit:cover;background:#30353c;display:grid;place-items:center;font-weight:900;flex:none}.rowmain{min-width:0;flex:1}.rowtop{display:flex;justify-content:space-between;gap:8px}.name{font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.time{font-size:10px;color:var(--muted);white-space:nowrap}.preview{color:var(--muted);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:4px}.badge{display:inline-block;margin-top:5px;background:#3a4048;color:#dce2ea;border-radius:99px;padding:3px 7px;font-size:9px}.badge.green{background:#123e26;color:#7df2a3}.badge.gold{background:#594700;color:#ffe16b}.chat{display:flex;flex-direction:column;min-width:0;background:#0f1216}.chathead{height:64px;background:#15191e;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px;padding:0 13px}.chathead .name{flex:1}.messages{flex:1;overflow:auto;padding:15px 12px;background:radial-gradient(circle at 50% 20%,#151b20,#0f1216 55%)}.empty{padding:35px 18px;text-align:center;color:var(--muted)}.bubble{max-width:min(78%,650px);margin:7px 0;padding:8px 10px;border-radius:12px;background:var(--bubble);box-shadow:0 1px 1px #0005;white-space:pre-wrap;word-break:break-word}.bubble.mine{margin-left:auto;background:var(--mine)}.meta{font-size:9px;color:#b8c0ca;text-align:right;margin-top:3px}.ticks{font-size:13px;margin-left:4px}.ticks.read{color:#56b7ff}.composer{display:flex;gap:8px;padding:9px;border-top:1px solid var(--line);background:#15191e}.composer textarea{flex:1;resize:none;max-height:120px;border:1px solid var(--line);border-radius:12px;background:#0b0d10;color:#fff;padding:11px;outline:none}.send{width:48px;border:0;border-radius:12px;background:var(--gold);color:#111;font-size:20px;font-weight:900}.send:disabled,.composer textarea:disabled{opacity:.4}.requestbar{padding:10px 12px;background:#1a1e24;border-bottom:1px solid var(--line);font-size:12px}.requestbar button{margin-left:8px;border:0;border-radius:8px;padding:8px 10px;background:var(--gold);font-weight:900}.requestbar .blue{background:var(--blue);color:#fff}.typing{height:18px;padding:0 12px;color:#8fa0b2;font-size:10px;background:#15191e}.intake-backdrop{position:fixed;inset:0;background:#000b;display:none;align-items:center;justify-content:center;padding:14px;z-index:100}.intake{width:min(500px,100%);max-height:92vh;overflow:auto;background:#171a1f;border:1px solid #3b424b;border-radius:18px;padding:17px}.intake h2{margin:0 0 5px}.intake p{color:#aeb6c0;font-size:12px;margin:0 0 14px}.field{margin:10px 0}.field label{display:block;font-size:12px;color:#c9cfd7;margin-bottom:5px}.field input,.field select{width:100%;padding:11px;border-radius:10px;border:1px solid #3b424b;background:#0d1014;color:#fff}.suggestions{display:none;border:1px solid #3b424b;border-radius:10px;background:#0d1014;margin-top:4px;max-height:160px;overflow:auto}.suggestions button{display:block;width:100%;text-align:left;border:0;border-bottom:1px solid #252a31;background:transparent;color:#fff;padding:10px}.saved{display:grid;gap:7px;margin-top:7px}.saved button{border:1px solid #3b424b;border-radius:10px;background:#0d1014;color:#fff;text-align:left;padding:10px}.saved button.sel{border-color:var(--gold);background:#2b250d}.intake-actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:14px}.intake-actions button{border:0;border-radius:10px;padding:11px;font-weight:900}.cancel{background:#30353c;color:#fff}.primary{background:var(--gold);color:#111}.msgerr{color:#ff9c9c;font-size:12px;min-height:18px;margin-top:7px}
@media(max-width:720px){.app{display:block}.list{height:100%}.chat{position:fixed;inset:0;z-index:20;transform:translateX(100%);transition:transform .2s}.chat.open{transform:translateX(0)}.top{height:58px}.row{padding:11px}.messages{padding-bottom:10px}}
</style></head><body><div class="app"><section class="list"><header class="top"><button class="icon" id="home">‹</button><div class="brand">मेरे Chats<div class="sub" id="meLabel">Loading…</div></div><button class="icon" id="refresh">↻</button></header><div class="search"><input id="search" placeholder="Chat खोजें…"></div><div class="tabs"><button class="active" data-tab="all">All</button><button data-tab="active">Active</button><button data-tab="requests">Requests</button><button data-tab="closed">History</button></div><div class="rows" id="rows"><div class="empty">Chats loading…</div></div></section><section class="chat" id="chat"><header class="chathead"><button class="icon" id="back">‹</button><div id="headAvatar" class="avatar">?</div><div style="min-width:0;flex:1"><div class="name" id="headName">Chat</div><div class="sub" id="headStatus">Offline</div></div><button class="icon" id="close">⋮</button></header><div id="requestbar"></div><div class="messages" id="messages"><div class="empty">बाईं तरफ से कोई chat चुनें।</div></div><div class="typing" id="typing"></div><div class="composer"><textarea id="input" placeholder="Message लिखें…" rows="1" disabled></textarea><button class="send" id="send" disabled>➤</button></div></section></div>
<div class="intake-backdrop" id="intakeBackdrop"><div class="intake"><h2>Chat शुरू करने से पहले</h2><p>अपनी जन्म जानकारी भरें या पहले से saved Kundli चुनें। यह जानकारी Astrologer को request accept करने से पहले दिखाई जाएगी।</p><div class="field"><label>Saved Kundli</label><div id="saved" class="saved">Loading…</div></div><div class="field"><label>नाम</label><input id="iName"></div><div class="field"><label>जन्म तारीख</label><input id="iDob" type="date"></div><div class="field"><label>जन्म समय</label><input id="iTime" type="time"></div><div class="field"><label>जन्म स्थान</label><input id="iPlace" autocomplete="off"><div id="suggestions" class="suggestions"></div></div><div class="msgerr" id="iErr"></div><div class="intake-actions"><button class="cancel" id="iCancel">Cancel</button><button class="primary" id="iContinue">Continue</button></div></div></div>
<script>
const $=s=>document.querySelector(s);let me=null,convs=[],current=null,realtime=null,userRealtime=null,tab='all',poll=null;const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
async function api(url,opt={}){const t=await window.SM_SUPABASE.getAccessToken();if(!t)throw Error('Login required');opt.headers={...(opt.headers||{}),Authorization:'Bearer '+t};const r=await fetch(url,opt);const j=await r.json().catch(()=>({}));if(!r.ok)throw Error(j.error||'Request failed');return j}
function other(c){if(c.user_id===me.id)return c.astrologer||c.admin||{full_name:'Support'};return c.user||c.admin||c.astrologer||{full_name:'User'}}
function fmt(v){try{return new Date(v).toLocaleTimeString('en-IN',{hour:'2-digit',minute:'2-digit'})}catch(e){return ''}}
function avatar(p){return p?.avatar_url?`<img class="avatar" src="${esc(p.avatar_url)}" alt="">`:`<div class="avatar">${esc((p?.full_name||'?').slice(0,1))}</div>`}
function badge(c){if(c.status==='accepted')return '<span class="badge green">Active</span>';if(['requested','astrologer_accepted'].includes(c.status))return '<span class="badge gold">Request</span>';if(c.status==='closed')return '<span class="badge">Ended • History</span>';return `<span class="badge">${esc(c.status)}</span>`}
function renderList(){const q=$('#search').value.trim().toLowerCase();const rows=convs.filter(c=>{const ok=tab==='all'||(tab==='active'&&c.status==='accepted')||(tab==='requests'&&['requested','astrologer_accepted'].includes(c.status))||(tab==='closed'&&['closed','missed','rejected'].includes(c.status));const p=other(c);return ok&&(!q||(`${p?.full_name||''} ${c.channel||''} ${c.status||''}`).toLowerCase().includes(q))});$('#rows').innerHTML=rows.map(c=>{const p=other(c);return `<div class="row ${current?.id===c.id?'active':''}" data-id="${esc(c.id)}">${avatar(p)}<div class="rowmain"><div class="rowtop"><span class="name">${esc(p?.full_name||'Chat')}</span><span class="time">${fmt(c.last_message_at||c.created_at)}</span></div><div class="preview">${esc(c.channel==='support'?'Admin Support':(c.channel||'chat'))}</div>${badge(c)}</div></div>`}).join('')||'<div class="empty">इस section में कोई chat नहीं है।</div>';document.querySelectorAll('.row[data-id]').forEach(x=>x.onclick=()=>openChat(x.dataset.id))}
async function loadConversations(){const x=await api('/api/chat');convs=x.conversations||[];renderList();if(current){const f=convs.find(c=>c.id===current.id);if(f)current=f}}
function setHeader(){const p=other(current||{});$('#headName').textContent=p?.full_name||'Chat';const old=$('#headAvatar');const el=p?.avatar_url?document.createElement('img'):document.createElement('div');el.className='avatar';el.id='headAvatar';if(p?.avatar_url){el.src=p.avatar_url;el.alt=''}else el.textContent=(p?.full_name||'?').slice(0,1);old.replaceWith(el)}
function requestBar(c){if(c.status==='requested')return '<div class="requestbar">Request भेजी गई है। Astrologer के पास 2 मिनट हैं accept करने के लिए.</div>';if(c.status==='astrologer_accepted'&&me.role==='user')return '<div class="requestbar">Astrologer ने accept किया है। <button id="confirmBtn">Confirm & Start Chat</button></div>';if(c.status==='astrologer_accepted')return '<div class="requestbar">आपने accept किया है। User confirmation pending है.</div>';if(c.status==='closed')return '<div class="requestbar">Chat ended है। <b>पूरी history हमेशा उपलब्ध रहेगी।</b></div>';if(c.status==='missed')return '<div class="requestbar">Request missed ('+esc(c.missed_by||'unknown')+').</div>';if(c.status==='rejected')return '<div class="requestbar">Request rejected हुई थी। पुरानी history सुरक्षित है।</div>';return ''}
function addMessage(m){if(String(m.body||'').startsWith('__BG_CHAT_INTAKE__')){if(document.querySelector('[data-intake="'+CSS.escape(String(m.id))+'"]'))return;const lines=String(m.body).split('\n');const vals={};lines.slice(1).forEach(x=>{const i=x.indexOf(':');if(i>0)vals[x.slice(0,i).trim()]=x.slice(i+1).trim()});const d=document.createElement('div');d.className='bubble';d.dataset.intake=m.id;d.innerHTML='<b>📜 Kundli / Birth Details</b><div style="margin-top:6px;font-size:12px">नाम: '+esc(vals['नाम']||'—')+'<br>जन्म तारीख: '+esc(vals['जन्म तारीख']||'—')+'<br>जन्म समय: '+esc(vals['जन्म समय']||'—')+'<br>जन्म स्थान: '+esc(vals['जन्म स्थान']||'—')+'</div>'+(current?.astrologer_id?' <button style="margin-top:8px;border:0;border-radius:8px;padding:7px 9px;background:#ffc400;font-weight:900" onclick="location.href=\'/shared-kundli.html?conversation_id='+encodeURIComponent(current.id)+'\'">📜 Open Kundli</button>':'');$('#messages').appendChild(d);$('#messages').scrollTop=$('#messages').scrollHeight;return}if(document.querySelector('[data-message="'+CSS.escape(String(m.id))+'"]'))return;const d=document.createElement('div');d.className='bubble '+(m.sender_id===me.id?'mine':'');d.dataset.message=m.id;d.innerHTML='<div class="body">'+esc(m.body)+'</div><div class="meta">'+fmt(m.created_at)+' '+(m.sender_id===me.id?'<span class="ticks '+(m.read_at?'read':'')+'">'+(m.read_at?'✓✓':'✓')+'</span>':'')+'</div>';$('#messages').appendChild(d);$('#messages').scrollTop=$('#messages').scrollHeight}
async function renderCurrent(data){current=data.conversation;setHeader();$('#requestbar').innerHTML=requestBar(current);$('#messages').innerHTML='';if(data.messages?.length){data.messages.forEach(addMessage)}else if(data.prechat){addMessage({id:'prechat-'+current.id,body:'__BG_CHAT_INTAKE__\nनाम: '+(data.prechat.name||'')+'\nजन्म तारीख: '+(data.prechat.dob||'')+'\nजन्म समय: '+(data.prechat.birth_time||'')+'\nजन्म स्थान: '+(data.prechat.place||'')})}else if(['requested','astrologer_accepted'].includes(current.status))$('#messages').innerHTML='<div class="empty">Chat अभी start नहीं हुई है।</div>';else $('#messages').innerHTML='<div class="empty">इस chat में अभी कोई message नहीं है।</div>';const active=current.status==='accepted';$('#input').disabled=!active;$('#send').disabled=!active;$('#requestbar').querySelector('#confirmBtn')?.addEventListener('click',confirmChat);if(innerWidth<=720)$('#chat').classList.add('open');await markRead();await setupRealtime()}
async function openChat(id){try{const x=await api('/api/chat?conversation_id='+encodeURIComponent(id));await renderCurrent(x);renderList()}catch(e){alert(e.message)}}
async function refreshCurrent(){if(current)await openChat(current.id);else await loadConversations()}
async function markRead(){if(!current||current.status!=='accepted')return;try{await api('/api/messages',{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify({conversationId:current.id,action:'read'})})}catch(e){}}
async function send(){const text=$('#input').value.trim();if(!text||!current||current.status!=='accepted')return;$('#input').value='';try{const x=await api('/api/messages',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({conversationId:current.id,body:text})});addMessage(x.message);await loadConversations()}catch(e){alert(e.message)}}
async function confirmChat(){try{await api('/api/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action:'user-confirm',conversationId:current.id})});await openChat(current.id)}catch(e){alert(e.message)}}
async function closeCurrent(){if(!current||!confirm('इस chat को end करें? User की history हमेशा सुरक्षित रहेगी।'))return;try{await api('/api/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action:'close',conversationId:current.id})});await openChat(current.id);await loadConversations()}catch(e){alert(e.message)}}
async function setupUserRealtime(){try{if(userRealtime)await userRealtime.unsubscribe();const sb=await window.SM_SUPABASE.init();if(!sb||!me)return;userRealtime=sb.channel('user:'+me.id);userRealtime.on('postgres_changes',{event:'*',schema:'public',table:'conversations'},()=>loadConversations().catch(()=>{}));await userRealtime.subscribe()}catch(e){}}
async function setupRealtime(){try{if(realtime){await realtime.unsubscribe();realtime=null}const sb=await window.SM_SUPABASE.init();if(!sb||!current)return;realtime=sb.channel('chat:'+current.id);realtime.on('postgres_changes',{event:'INSERT',schema:'public',table:'messages',filter:'conversation_id=eq.'+current.id},payload=>{if(payload.new?.sender_id!==me.id){addMessage(payload.new);markRead()}loadConversations()}).on('postgres_changes',{event:'UPDATE',schema:'public',table:'messages',filter:'conversation_id=eq.'+current.id},payload=>{const el=document.querySelector('[data-message="'+CSS.escape(String(payload.new?.id||''))+'"]');if(el&&payload.new?.read_at){const tick=el.querySelector('.ticks');if(tick){tick.textContent='✓✓';tick.classList.add('read')}}}).on('postgres_changes',{event:'UPDATE',schema:'public',table:'conversations',filter:'id=eq.'+current.id},()=>openChat(current.id));await realtime.subscribe(status=>{if(status==='SUBSCRIBED')$('#headStatus').textContent='● Live Chat';else if(status==='CHANNEL_ERROR'||status==='TIMED_OUT')$('#headStatus').textContent='○ Reconnecting…'})}catch(e){$('#headStatus').textContent='● Live reconnecting'}}
let intakeMode=null,intakeAstro=null,savedKundlis=[];
function closeIntake(){ $('#intakeBackdrop').style.display='none';intakeMode=null;intakeAstro=null;$('#iErr').textContent=''}
function selectSaved(k){$('#saved button').forEach(b=>b.classList.remove('sel'));const b=document.querySelector('[data-kid="'+CSS.escape(String(k.id))+'"]');if(b)b.classList.add('sel');$('#saved').dataset.selected=k.id;$('#iName').value=k.name||'';$('#iDob').value=k.dob||'';$('#iTime').value=k.birth_time||'';$('#iPlace').value=k.place||''}
async function openIntake(aid){intakeAstro=aid;delete $('#saved').dataset.selected;$('#iName').value='';$('#iDob').value='';$('#iTime').value='';$('#iPlace').value='';delete $('#iPlace').dataset.lat;delete $('#iPlace').dataset.lon;delete $('#iPlace').dataset.tz;$('#intakeBackdrop').style.display='flex';$('#iErr').textContent='';$('#saved').innerHTML='Loading…';try{const x=await api('/api/my-kundlis');savedKundlis=x.kundlis||[];$('#saved').innerHTML=savedKundlis.length?savedKundlis.map(k=>'<button data-kid="'+esc(k.id)+'">'+esc(k.name)+' · '+esc(k.dob)+' · '+esc(k.birth_time)+' · '+esc(k.place)+'</button>').join(''):'<div style="color:#888;font-size:12px">कोई saved Kundli नहीं। नीचे नई details भरें।</div>';savedKundlis.forEach(k=>document.querySelector('[data-kid="'+CSS.escape(String(k.id))+'"]')?.addEventListener('click',()=>selectSaved(k)))}catch(e){$('#saved').innerHTML='<div style="color:#f99">'+esc(e.message)+'</div>'}}
async function submitIntake(){try{$('#iContinue').disabled=true;$('#iErr').textContent='';let kid=$('#saved').dataset.selected||'';if(!kid){const name=$('#iName').value.trim(),dob=$('#iDob').value,time=$('#iTime').value,place=$('#iPlace').value.trim();if(!name||!dob||!time||!place)throw Error('नाम, जन्म तारीख, जन्म समय और जन्म स्थान भरें');const lat=Number($('#iPlace').dataset.lat),lon=Number($('#iPlace').dataset.lon),tz=Number($('#iPlace').dataset.tz||5.5);if(!Number.isFinite(lat)||!Number.isFinite(lon))throw Error('कृपया birth place की सूची से स्थान चुनें');await api('/api/kundli',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name,dob,time,place,latitude:lat,longitude:lon,timezone:tz,gender:''})});const y=await api('/api/my-kundlis');const match=(y.kundlis||[]).find(k=>k.name===name&&k.dob===dob&&k.birth_time===time&&k.place===place);if(!match)throw Error('Kundli save हुई लेकिन उसका record नहीं मिला');kid=match.id}const x=await api('/api/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action:'request',astrologerId:intakeAstro,kundaliId:kid})});closeIntake();history.replaceState({},'',`/chat.html?conversation_id=${encodeURIComponent(x.conversation.id)}`);await loadConversations();await openChat(x.conversation.id)}catch(e){$('#iErr').textContent=e.message}finally{$('#iContinue').disabled=false}}
let placeTimer=null;$('#iPlace').addEventListener('input',()=>{delete $('#iPlace').dataset.lat;delete $('#iPlace').dataset.lon;clearTimeout(placeTimer);const q=$('#iPlace').value.trim();if(q.length<2){$('#suggestions').style.display='none';return}placeTimer=setTimeout(async()=>{try{const x=await api('/api/places?q='+encodeURIComponent(q));const rows=x.places||[];$('#suggestions').innerHTML=rows.map(p=>'<button data-lat="'+esc(p.latitude)+'" data-lon="'+esc(p.longitude)+'" data-tz="'+esc(p.tzOffset??5.5)+'">'+esc(p.name||p.display_name||'Place')+'</button>').join('');$('#suggestions').style.display=rows.length?'block':'none';rows.forEach((p,i)=>{const b=$('#suggestions').children[i];b.onclick=()=>{$('#iPlace').value=p.name||p.display_name||'';$('#iPlace').dataset.lat=p.latitude;$('#iPlace').dataset.lon=p.longitude;$('#iPlace').dataset.tz=p.tzOffset??5.5;$('#suggestions').style.display='none'}})}catch(e){}},300)});
$('#send').onclick=send;$('#refresh').onclick=refreshCurrent;$('#close').onclick=closeCurrent;$('#home').onclick=()=>location.href='/';$('#back').onclick=()=>$('#chat').classList.remove('open');$('#search').oninput=renderList;document.querySelectorAll('.tabs button').forEach(b=>b.onclick=()=>{document.querySelectorAll('.tabs button').forEach(x=>x.classList.remove('active'));b.classList.add('active');tab=b.dataset.tab;renderList()});$('#iCancel').onclick=closeIntake;$('#iContinue').onclick=submitIntake;
async function startNew(){const p=new URLSearchParams(location.search),type=p.get('new'),aid=p.get('astrologer_id');if(!type)return;if(type==='chat'){if(!aid)throw Error('Astrologer ID missing');return openIntake(aid)}if(type==='call'){const x=await api('/api/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action:'call',astrologerId:aid})});history.replaceState({},'',`/chat.html?conversation_id=${encodeURIComponent(x.conversation.id)}`);await loadConversations();await openChat(x.conversation.id)}}
(async()=>{try{const s=await window.SM_SUPABASE.getSession();if(!s)throw Error('Login required');const x=await api('/api/me');me=x.user;if(!me?.id)throw Error('Account identity नहीं मिली');$('#meLabel').textContent=(me.name||me.email||'Account')+' • '+me.role;await loadConversations();await setupUserRealtime();const p=new URLSearchParams(location.search);if(p.get('conversation_id'))await openChat(p.get('conversation_id'));else if(p.get('support')==='1'&&me.role==='user'){const x=await api('/api/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action:'request'})});history.replaceState({},'',`/chat.html?conversation_id=${encodeURIComponent(x.conversation.id)}`);await loadConversations();await openChat(x.conversation.id)}else await startNew();poll=setInterval(()=>loadConversations().catch(()=>{}),5000)}catch(e){alert(e.message);location.replace('/')}})();

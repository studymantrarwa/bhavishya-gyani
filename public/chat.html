<!doctype html>
<html lang="hi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Chat — Bhavishya Gyani</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="/supabase-client.js"></script>
<style>
:root{--green:#075e54;--light:#efeae2;--card:#fff;--mine:#d9fdd3;--line:#ddd}*{box-sizing:border-box}body{margin:0;background:#111;color:#111;font-family:system-ui,-apple-system,"Noto Sans Devanagari",sans-serif}.app{max-width:720px;margin:auto;height:100vh;display:flex;flex-direction:column;background:var(--light)}.top{height:64px;background:var(--green);color:#fff;display:flex;align-items:center;gap:10px;padding:0 12px;flex:0 0 auto}.top a{color:#fff;text-decoration:none;font-size:28px}.brand{font-weight:900;font-size:19px;flex:1}.search{padding:9px;background:#f0f2f5}.search input{width:100%;padding:10px 13px;border:0;border-radius:22px;outline:0}.tabs{display:grid;grid-template-columns:repeat(4,1fr);background:#fff;border-bottom:1px solid #ddd}.tabs button{border:0;background:#fff;padding:11px 3px;font-weight:800;color:#666}.tabs button.active{color:var(--green);border-bottom:3px solid var(--green)}.list{flex:1;overflow:auto;background:#fff}.row{display:flex;align-items:center;gap:12px;padding:13px 12px;border-bottom:1px solid #eee;cursor:pointer}.avatar{width:48px;height:48px;border-radius:50%;background:#777;color:#fff;display:grid;place-items:center;font-weight:900;flex:0 0 auto}.rowmain{min-width:0;flex:1}.rowtop{display:flex;justify-content:space-between;gap:8px}.name{font-weight:900;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.time{font-size:10px;color:#777}.preview{font-size:12px;color:#777;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:3px}.status{font-size:10px;color:#188038}.empty{text-align:center;padding:45px 20px;color:#777}.fab{position:fixed;right:max(18px,calc((100vw - 720px)/2 + 18px));bottom:22px;width:56px;height:56px;border:0;border-radius:50%;background:#25d366;color:#fff;font-size:27px;box-shadow:0 4px 14px #0005}.chatview{display:none;height:100%;flex-direction:column}.chatview.open{display:flex}.chathead{height:64px;background:var(--green);color:#fff;display:flex;align-items:center;gap:9px;padding:0 10px}.chathead button{border:0;background:transparent;color:#fff;font-size:25px}.chathead .head{flex:1;min-width:0}.sub{font-size:11px;opacity:.85}.messages{flex:1;overflow:auto;padding:12px 10px;background:var(--light)}.bubble{max-width:82%;padding:8px 10px;border-radius:8px;background:#fff;margin:5px 0;white-space:pre-wrap;font-size:14px;box-shadow:0 1px 1px #0002}.mine{margin-left:auto;background:var(--mine)}.bt{font-size:9px;color:#777;text-align:right;margin-top:3px}.state{padding:9px;background:#fff6c7;text-align:center;font-size:12px}.composer{display:none;gap:7px;padding:8px;background:#f0f2f5}.composer input{flex:1;border:1px solid #ccc;border-radius:22px;padding:11px 14px}.composer button{width:45px;border:0;border-radius:50%;background:#25d366;color:#fff;font-size:19px}
</style></head><body><div class="app">
<div id="listView"><header class="top"><a href="/dashboard.html">‹</a><div class="brand">Bhavishya Gyani · Chat</div></header><div class="search"><input id="search" placeholder="Search chats…"></div><div class="tabs"><button class="active" data-tab="all">All</button><button data-tab="active">Active</button><button data-tab="requests">Requests</button><button data-tab="closed">Closed</button></div><div id="list" class="list"><div class="empty">Chats loading…</div></div><button class="fab" onclick="location.href='/dashboard.html#astrologers'">＋</button></div>
<div id="chatView" class="chatview"><header class="chathead"><button onclick="showList()">‹</button><div id="cav" class="avatar">A</div><div class="head"><div id="cname" class="name">Chat</div><div id="csub" class="sub">Connecting…</div></div></header><div id="state" class="state" style="display:none"></div><div id="messages" class="messages"></div><form id="composer" class="composer"><input id="input" placeholder="Message लिखें…" autocomplete="off"><button>➤</button></form></div></div>
<script>
const $=s=>document.querySelector(s), token=()=>localStorage.getItem('studyMantraToken');let me=null,all=[],conv=null,cid=null,poll=null;const params=new URLSearchParams(location.search);cid=params.get('conversation_id');
const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
async function api(url,opt={}){opt.headers={...(opt.headers||{}),Authorization:'Bearer '+token()};const r=await fetch(url,opt);const j=await r.json().catch(()=>({}));if(!r.ok)throw Error(j.error||'Request failed');return j}
function other(c){return c.user_id===me.user.id?c.astrologer:c.user}
function renderList(){const q=$('#search').value.toLowerCase().trim(),tab=document.querySelector('.tabs .active')?.dataset.tab||'all';let rows=all.filter(c=>{const o=other(c),n=(o?.full_name||'').toLowerCase();const okq=!q||n.includes(q);const okt=tab==='all'||(tab==='active'&&['accepted','astrologer_accepted','requested'].includes(c.status))||(tab==='requests'&&c.status==='requested')||(tab==='closed'&&['closed','missed','rejected'].includes(c.status));return okq&&okt}).map(c=>{const o=other(c),t=c.last_message_at||c.created_at;return `<div class="row" onclick="openChat('${esc(c.id)}')"><div class="avatar">${esc((o?.full_name||'A').slice(0,1))}</div><div class="rowmain"><div class="rowtop"><span class="name">${esc(o?.full_name||'Astrologer')}</span><span class="time">${new Date(t).toLocaleDateString([], {day:'2-digit',month:'short'})}</span></div><div class="preview">${esc(c.status)}${c.channel?' · '+esc(c.channel):''}</div><div class="status">${c.status==='accepted'?'● Active':''}</div></div></div>`}).join('');$('#list').innerHTML=rows||'<div class="empty">अभी कोई chat नहीं है। Dashboard से astrologer चुनकर Chat request भेजें।</div>'}
async function loadList(){try{const x=await api('/api/chat');all=x.conversations||[];renderList()}catch(e){$('#list').innerHTML='<div class="empty">'+esc(e.message)+'</div>'}}
function showList(){cid=null;conv=null;clearInterval(poll);$('#chatView').classList.remove('open');$('#listView').style.display='block';loadList()}
async function openChat(id){cid=id;$('#listView').style.display='none';$('#chatView').classList.add('open');$('#messages').innerHTML='<div class="empty">Messages loading…</div>';await loadChat();clearInterval(poll);poll=setInterval(loadChat,8000)}
async function loadChat(){try{const x=await api('/api/chat?conversation_id='+encodeURIComponent(cid));conv=x.conversation;const o=other(conv);$('#cname').textContent=o?.full_name||'Chat';$('#csub').textContent=conv.status==='accepted'?'● Live Chat':conv.status;$('#cav').textContent=(o?.full_name||'A').slice(0,1);$('#messages').innerHTML=(x.messages||[]).map(m=>`<div class="bubble ${m.sender_id===me.user.id?'mine':''}">${esc(m.body)}<div class="bt">${new Date(m.created_at).toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'})} ✓✓</div></div>`).join('')||'<div class="empty">No messages yet.</div>';const can=conv.status==='accepted'&&conv.channel==='chat';$('#composer').style.display=can?'flex':'none';if(can){$('#state').style.display='none'}else{$('#state').style.display='block';$('#state').textContent=conv.status==='requested'?'Astrologer acceptance pending.':conv.status==='astrologer_accepted'?'Astrologer ने accept किया है; confirmation pending.':conv.status==='closed'?'Chat ended.':'Chat status: '+conv.status}$('#messages').scrollTop=$('#messages').scrollHeight}catch(e){$('#messages').innerHTML='<div class="empty">'+esc(e.message)+'</div>'}}
$('#composer').onsubmit=async e=>{e.preventDefault();const v=$('#input').value.trim();if(!v||!conv)return;$('#input').value='';try{await api('/api/messages',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({conversationId:cid,body:v})});await loadChat()}catch(err){alert(err.message);$('#input').value=v}};
$('#search').oninput=renderList;document.querySelectorAll('.tabs button').forEach(b=>b.onclick=()=>{document.querySelectorAll('.tabs button').forEach(x=>x.classList.remove('active'));b.classList.add('active');renderList()});
(async()=>{try{if(!token())return location.href='/auth.html';me=await api('/api/me');if(cid)await openChat(cid);else await loadList()}catch(e){alert(e.message);location.href='/auth.html'}})();
</script></body></html>

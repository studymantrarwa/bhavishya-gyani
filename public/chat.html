<!doctype html><html lang="hi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Chat — Bhavishya Gyani</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="/supabase-client.js"></script><style>
:root{--gold:#ffc400;--bg:#101112;--chat:#e8e5dc;--mine:#d6f8a8;--other:#fff;--line:#ddd}*{box-sizing:border-box}body{margin:0;background:#111;color:#111;font-family:system-ui,-apple-system,"Noto Sans Devanagari",sans-serif}.app{max-width:720px;margin:auto;height:100vh;display:flex;flex-direction:column;background:var(--chat)}.top{height:64px;background:var(--gold);display:flex;align-items:center;gap:10px;padding:0 12px;flex:0 0 auto}.top a{color:#111;text-decoration:none;font-size:28px}.avatar{width:43px;height:43px;border-radius:50%;object-fit:cover;background:#777;display:grid;place-items:center;color:#fff;font-weight:900}.head{flex:1;min-width:0}.head .name{font-weight:900;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.head .sub{font-size:11px;color:#5d5200;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.headactions{display:flex;gap:7px}.headactions button{border:0;background:#111;color:#fff;border-radius:9px;padding:7px 8px;font-weight:800;font-size:11px}.info{background:#fff;border-bottom:1px solid #ccc;padding:8px 11px}.birth{display:flex;gap:8px;flex-wrap:wrap;font-size:11px;color:#555}.open{margin-top:6px;border:0;background:#1689ff;color:#fff;border-radius:8px;padding:7px 10px;font-weight:800}.messages{flex:1;overflow:auto;padding:12px 10px 18px;background:linear-gradient(#e8e5dc,#e8e5dc)}.bubble{max-width:80%;background:var(--other);border-radius:9px;padding:8px 10px;margin:5px 0;box-shadow:0 1px 1px #0002;white-space:pre-wrap;font-size:14px}.mine{margin-left:auto;background:var(--mine)}.time{font-size:9px;color:#777;text-align:right;margin-top:4px}.typing{height:20px;padding:0 14px;font-size:11px;color:#666;background:var(--chat)}.composer{display:flex;gap:7px;padding:8px;background:#f5f4ef;border-top:1px solid #ccc}.composer input{flex:1;border:1px solid #ccc;border-radius:22px;padding:11px 14px;font-size:14px;outline:none}.composer button{width:48px;border:0;border-radius:50%;background:var(--gold);font-size:20px}.state{padding:10px;background:#fff5cc;text-align:center;font-size:12px}.archiveNote{padding:8px 11px;background:#eef7ff;color:#16527d;border-bottom:1px solid #cbdbe8;font-size:11px}.danger{background:#ffe0e2;color:#8b151b}.confirm{background:#dff2ff;color:#125a8f}.empty{padding:35px;text-align:center;color:#777}
</style></head><body><div class="app"><header class="top"><a href="javascript:history.back()">‹</a><div id="av"></div><div class="head"><div id="name" class="name">Chat</div><div id="sub" class="sub">Connecting…</div></div><div class="headactions"><button onclick="openKundli()">Kundli</button><button onclick="endChat()">End</button></div></header><div id="info" class="info"></div><div id="state"></div><div id="archiveNote"></div><div id="messages" class="messages"><div class="empty">Messages loading…</div></div><div id="typing" class="typing"></div><form id="composer" class="composer"><input id="input" autocomplete="off" placeholder="Message लिखें…"><button>➤</button></form></div>
<script>
const $=s=>document.querySelector(s);const token=()=>localStorage.getItem('studyMantraToken');const params=new URLSearchParams(location.search);const cid=params.get('conversation_id');let me=null,conv=null,sb=null,channel=null,poll=null;let typingTimer=null;
const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
async function api(url,opt={}){opt.headers={...(opt.headers||{}),Authorization:'Bearer '+token()};const r=await fetch(url,opt);const j=await r.json().catch(()=>({}));if(!r.ok)throw Error(j.error||'Request failed');return j}
function renderAvatar(p){$('#av').innerHTML=p?.avatar_url?`<img class="avatar" src="${esc(p.avatar_url)}">`:`<div class="avatar">${esc((p?.full_name||'A').slice(0,1))}</div>`}
function renderMessages(rows){const box=$('#messages');const atBottom=box.scrollHeight-box.scrollTop-box.clientHeight<90;box.innerHTML=(rows||[]).map(m=>`<div class="bubble ${m.sender_id===me.user.id?'mine':''}">${esc(m.body)}<div class="time">${new Date(m.created_at).toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'})}</div></div>`).join('')||'<div class="empty">No messages yet.</div>';if(atBottom)box.scrollTop=box.scrollHeight}
function renderState(){if(!conv)return;let html='';if(conv.status==='requested')html=`<div class="state">Astrologer acceptance pending. <b data-deadline="${esc(new Date(new Date(conv.requested_at).getTime()+120000).toISOString())}">02:00</b></div>`;if(conv.status==='astrologer_accepted'&&me.user.role==='user')html=`<div class="state confirm">Astrologer ने accept किया। आपको <b data-deadline="${esc(conv.user_confirm_deadline)}">02:00</b> में confirmation देना है। <button class="open" onclick="confirmChat()">Confirm Chat</button></div>`;if(conv.status==='astrologer_accepted'&&me.user.role==='astrologer')html='<div class="state confirm">User confirmation का इंतज़ार है — 2 मिनट का window.</div>';if(conv.status==='missed')html=`<div class="state danger">Missed by ${esc(conv.missed_by)}. यह request अब active नहीं है।</div>`;if(conv.status==='rejected')html='<div class="state danger">Request rejected.</div>';if(conv.status==='closed')html='<div class="state">Chat ended. History 2 days तक उपलब्ध रहेगी।</div>';if(conv.status==='accepted'&&conv.channel==='call')html='<div class="state confirm">Call request accepted by both sides. <button class="open" onclick="startCall()">☎ Start Voice Call</button></div>';$('#archiveNote').innerHTML=conv?.history_visibility==='permanent_archive'?'<div class="archiveNote">📚 यह chat 48 घंटे के बाद Permanent Archive में सुरक्षित है। आप इसे पढ़ सकते हैं; पुरानी chat read-only है।</div>':'';$('#state').innerHTML=html;$('#composer').style.display=conv.status==='accepted'&&conv.channel==='chat'?'flex':'none'}
function renderInfo(){const p=conv?.user;const k=conv?.kundli;const other=me.user.role==='astrologer'?p:conv?.astrologer;renderAvatar(other);$('#name').textContent=other?.full_name||'User';$('#sub').textContent=conv?.channel==='call'?'☎ Call request':'● Live Chat';$('#info').innerHTML=k?`<div class="birth"><span><b>नाम:</b> ${esc(k.name)}</span><span><b>DOB:</b> ${esc(k.dob)}</span><span><b>Time:</b> ${esc(k.birth_time)}</span><span><b>Place:</b> ${esc(k.place)}</span></div><button class="open" onclick="openKundli()">▣ Open Kundli</button>`:`<div class="birth">Birth details shared after both sides confirm the chat.</div>`}
async function load(){const x=await api('/api/chat?conversation_id='+encodeURIComponent(cid));conv=x.conversation;renderInfo();renderState();renderMessages(x.messages);startTimers();if(!sb)await setupRealtime();}
async function confirmChat(){try{const x=await api('/api/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action:'user-confirm',conversationId:cid})});conv=x.conversation;await load()}catch(e){alert(e.message);load()}}
async function endChat(){if(!conv||!['accepted','astrologer_accepted'].includes(conv.status))return;try{await api('/api/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action:'close',conversationId:cid})});await load()}catch(e){alert(e.message)}}
async function send(){const v=$('#input').value.trim();if(!v)return;$('#input').value='';try{await api('/api/messages',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({conversationId:cid,body:v})});if(sb)channel?.send({type:'broadcast',event:'new_message',payload:{at:Date.now()}});await load()}catch(e){alert(e.message);$('#input').value=v}}
function startTimers(){setInterval(()=>document.querySelectorAll('[data-deadline]').forEach(el=>{const ms=new Date(el.dataset.deadline).getTime()-Date.now();if(ms<=0){el.textContent='00:00';load()}else{const s=Math.floor(ms/1000);el.textContent=String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0')}}),500)}
async function setupRealtime(){try{sb=await window.SM_SUPABASE.setRealtimeAuth();if(!sb)return;channel=sb.channel('chat:'+cid,{config:{private:true}});channel.on('postgres_changes',{event:'INSERT',schema:'public',table:'messages',filter:'conversation_id=eq.'+cid},payload=>{if(payload.new?.sender_id!==me.user.id)load()});channel.on('postgres_changes',{event:'UPDATE',schema:'public',table:'conversations',filter:'id=eq.'+cid},()=>load());channel.on('broadcast',{event:'typing'},p=>{if(p.payload?.sender_id!==me.user.id){$('#typing').textContent=p.payload?.typing?'typing…':''}});await channel.subscribe((status,err)=>{if(status==='CHANNEL_ERROR'||status==='TIMED_OUT'){console.warn('Realtime chat error',status,err);$('#typing').textContent='Live connection retrying…'}});}catch(e){console.warn('Realtime unavailable',e)} }
$('#input').addEventListener('input',()=>{if(channel){channel.send({type:'broadcast',event:'typing',payload:{sender_id:me.user.id,typing:true}});clearTimeout(typingTimer);typingTimer=setTimeout(()=>channel.send({type:'broadcast',event:'typing',payload:{sender_id:me.user.id,typing:false}}),900)}});
$('#composer').onsubmit=e=>{e.preventDefault();if(conv?.status!=='accepted')return;send()};function startCall(){location.href='/call.html?conversation_id='+encodeURIComponent(conv.id)}
function openKundli(){if(conv?.kundli?.id)location.href='/shared-kundli.html?kundali_id='+encodeURIComponent(conv.kundli.id);else alert('Kundli अभी available नहीं है। दोनों sides confirm होने के बाद available होगी।')}
(async()=>{try{if(!token()||!cid)return location.href='/auth.html';const x=await api('/api/me');me=x;await load();poll=setInterval(()=>load().catch(()=>{$('#sub').textContent='Connection retry…'}),5000)}catch(e){$('#messages').innerHTML='<div class="empty">Chat load नहीं हो पाया: '+esc(e.message)+'<br><button class="open" onclick="location.reload()">Retry</button></div>';$('#sub').textContent='Connection error'}})();
</script></body></html>

<!doctype html>
<html lang="hi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Chat — Bhavishya Gyani</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="/supabase-client.js"></script>
<style>
:root{--green:#075e54;--green2:#128c7e;--gold:#ffc400;--bg:#efeae2;--white:#fff;--mine:#d9fdd3;--line:#e5e5e5;--muted:#667781;--blue:#53bdeb}
*{box-sizing:border-box}html,body{margin:0;height:100%;background:#111;font-family:system-ui,-apple-system,"Noto Sans Devanagari",sans-serif}button,input{font:inherit}.app{width:100%;max-width:720px;height:100dvh;margin:auto;background:var(--bg);display:flex;flex-direction:column;overflow:hidden}.top{height:64px;background:var(--green);color:#fff;display:flex;align-items:center;gap:10px;padding:0 10px;flex:0 0 64px}.back{width:34px;border:0;background:transparent;color:#fff;font-size:29px;line-height:1;cursor:pointer}.avatar{width:43px;height:43px;border-radius:50%;object-fit:cover;background:#83919a;display:grid;place-items:center;color:#fff;font-weight:900;flex:0 0 43px}.head{min-width:0;flex:1}.head .name{font-size:16px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.head .sub{font-size:11px;opacity:.85;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.head-actions{display:flex;gap:5px}.head-actions button{border:0;background:transparent;color:#fff;font-size:20px;width:34px;height:34px;border-radius:50%;cursor:pointer}.view{min-height:0;flex:1;display:flex;flex-direction:column}.list-head{background:#fff;padding:11px 12px;border-bottom:1px solid var(--line)}.search{display:flex;align-items:center;gap:8px;background:#f0f2f5;border-radius:22px;padding:7px 12px}.search input{border:0;outline:0;background:transparent;width:100%;font-size:14px}.tabs{display:flex;background:#fff;border-bottom:1px solid var(--line)}.tab{flex:1;padding:11px 4px;border:0;background:#fff;color:var(--muted);font-weight:800;font-size:12px}.tab.active{color:var(--green2);border-bottom:3px solid var(--green2)}.chat-list{overflow:auto;flex:1;background:#fff}.row{display:flex;align-items:center;gap:11px;padding:11px 12px;border-bottom:1px solid #eee;cursor:pointer}.row:hover{background:#f7f7f7}.row-main{min-width:0;flex:1}.row-top{display:flex;align-items:center;gap:6px}.row-name{font-weight:800;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:#111}.row-time{font-size:10px;color:var(--muted)}.preview{display:flex;gap:5px;align-items:center;margin-top:3px;color:var(--muted);font-size:12px}.preview-text{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1}.badge{min-width:19px;height:19px;padding:0 6px;border-radius:20px;background:var(--green2);color:#fff;font-size:10px;display:grid;place-items:center}.status-pill{font-size:10px;padding:3px 7px;border-radius:10px;background:#edf7f5;color:var(--green2);white-space:nowrap}.empty{padding:45px 20px;text-align:center;color:var(--muted);font-size:13px}.fab{position:fixed;right:max(18px,calc((100vw - 720px)/2 + 18px));bottom:24px;width:54px;height:54px;border:0;border-radius:50%;background:var(--green2);color:#fff;font-size:24px;box-shadow:0 4px 12px #0004}.chat-view{display:none;min-height:0;flex:1;flex-direction:column}.chat-view.open{display:flex}.chat-bg{flex:1;min-height:0;overflow:auto;padding:12px 9px 14px;background-color:#efeae2;background-image:radial-gradient(#d9d0c5 1px,transparent 1px);background-size:18px 18px}.bubble{max-width:min(78%,520px);width:max-content;background:#fff;border-radius:8px;padding:7px 9px 5px;margin:3px 0;box-shadow:0 1px 1px #0002;white-space:pre-wrap;overflow-wrap:anywhere;font-size:14px;line-height:1.35}.bubble.mine{margin-left:auto;background:var(--mine);border-top-right-radius:2px}.bubble.other{border-top-left-radius:2px}.meta{display:flex;justify-content:flex-end;align-items:center;gap:3px;margin-top:3px;font-size:9px;color:#667781}.ticks{font-size:12px;color:#667781}.ticks.read{color:#53bdeb}.date-chip{width:max-content;margin:8px auto;padding:5px 10px;border-radius:9px;background:#fff;color:#667781;font-size:10px;box-shadow:0 1px 1px #0002}.typing{height:0;overflow:hidden;padding:0 12px;background:#f0f2f5;color:#667781;font-size:11px}.typing.show{height:22px;padding-top:3px}.composer{display:flex;align-items:center;gap:6px;padding:7px;background:#f0f2f5;border-top:1px solid #ddd;flex:0 0 auto}.icon-btn{border:0;background:transparent;color:#54656f;font-size:22px;width:35px;height:35px;border-radius:50%;cursor:pointer}.input-wrap{display:flex;align-items:center;gap:3px;flex:1;background:#fff;border-radius:22px;padding:0 5px 0 13px}.input-wrap input{border:0;outline:0;flex:1;padding:10px 0;background:transparent;min-width:0}.send{width:43px;height:43px;border:0;border-radius:50%;background:var(--green2);color:#fff;font-size:19px}.emoji-box{position:absolute;bottom:63px;left:8px;right:8px;background:#fff;border:1px solid #ddd;border-radius:14px;padding:10px;display:none;box-shadow:0 5px 20px #0003}.emoji-box.open{display:grid;grid-template-columns:repeat(8,1fr);gap:7px}.emoji-box button{border:0;background:#f5f5f5;border-radius:9px;padding:8px;font-size:20px}.state{padding:8px 10px;background:#fff8d6;text-align:center;color:#6c5a00;font-size:11px;border-bottom:1px solid #eee}.state button{border:0;background:var(--green2);color:#fff;border-radius:7px;padding:6px 9px;margin-left:5px;font-size:11px;font-weight:800}.danger{background:#ffe5e5;color:#9b2020}.info{display:none}.info.open{display:block;background:#fff;padding:8px 11px;border-bottom:1px solid #ddd;font-size:11px;color:#667781}.bottom{height:58px;background:#fff;border-top:1px solid #ddd;display:flex;align-items:center;justify-content:space-around;flex:0 0 58px}.bottom button{border:0;background:transparent;color:#667781;font-size:11px;font-weight:700}.bottom button b{display:block;font-size:21px;line-height:20px}.bottom button.active{color:var(--green2)}
@media(min-width:721px){.app{box-shadow:0 0 35px #0007}.bottom{display:none}.fab{position:absolute}}
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <button class="back" id="backBtn">‹</button>
    <div id="av"></div>
    <div class="head"><div id="name" class="name">Chats</div><div id="sub" class="sub">Connecting…</div></div>
    <div class="head-actions" id="headActions"><button title="Kundli" onclick="openKundli()">✧</button><button title="More" onclick="toggleInfo()">⋮</button></div>
  </header>

  <main id="listView" class="view">
    <div class="list-head"><div class="search">⌕<input id="search" placeholder="Search chats…" autocomplete="off"></div></div>
    <div class="tabs"><button class="tab active" data-filter="all">All</button><button class="tab" data-filter="accepted">Active</button><button class="tab" data-filter="requested">Requests</button><button class="tab" data-filter="closed">Closed</button></div>
    <div id="chatList" class="chat-list"><div class="empty">Chats loading…</div></div>
    <button class="fab" onclick="location.href='/dashboard.html#astrologers'">＋</button>
  </main>

  <main id="chatView" class="chat-view">
    <div id="info" class="info"></div>
    <div id="state"></div>
    <div id="messages" class="chat-bg"><div class="empty">Messages loading…</div></div>
    <div id="typing" class="typing">typing…</div>
    <form id="composer" class="composer">
      <button type="button" class="icon-btn" onclick="toggleEmoji()">☺</button>
      <div class="input-wrap"><input id="input" autocomplete="off" placeholder="Message लिखें…"><button type="button" class="icon-btn" onclick="toggleEmoji()">＋</button></div>
      <button class="send" type="submit">➤</button>
      <div id="emojiBox" class="emoji-box"></div>
    </form>
  </main>

  <nav class="bottom" id="bottom"><button class="active" onclick="showList()"><b>☁</b>Chats</button><button onclick="location.href='/dashboard.html#astrologers'"><b>☀</b>Astrologers</button><button onclick="location.href='/kundli-form.html'"><b>✧</b>Kundli</button><button onclick="location.href='/tools.html'"><b>☷</b>More</button></nav>
</div>
<script>
const $=s=>document.querySelector(s), token=()=>localStorage.getItem('studyMantraToken');
const params=new URLSearchParams(location.search);let cid=params.get('conversation_id');let me=null,conv=null,sb=null,channel=null,poll=null,allChats=[],filter='all',typingTimer=null;
const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
async function api(url,opt={}){opt.headers={...(opt.headers||{}),Authorization:'Bearer '+token()};const r=await fetch(url,opt);const j=await r.json().catch(()=>({}));if(!r.ok)throw Error(j.error||'Request failed');return j}
function avatar(p){return p?.avatar_url?`<img class="avatar" src="${esc(p.avatar_url)}">`:`<div class="avatar">${esc((p?.full_name||'A').slice(0,1))}</div>`}
function statusLabel(c){if(c.status==='accepted')return 'Active';if(c.status==='requested')return 'Waiting';if(c.status==='astrologer_accepted')return 'Confirm';if(c.status==='rejected')return 'Rejected';if(c.status==='missed')return 'Missed';if(c.status==='closed')return 'Closed';return c.status||''}
function showList(){cid=null;conv=null;stopRealtime();$('#chatView').classList.remove('open');$('#listView').style.display='flex';$('#bottom').style.display='flex';$('#backBtn').onclick=()=>history.back();$('#av').innerHTML='';$('#name').textContent='Chats';$('#sub').textContent=allChats.length+' conversations';$('#headActions').style.display='none';loadChats()}
function showChat(){if(!conv)return;$('#listView').style.display='none';$('#chatView').classList.add('open');$('#bottom').style.display='none';$('#headActions').style.display='flex';$('#backBtn').onclick=()=>showList();renderInfo();renderState();renderMessages(conv.messages||[]);setupRealtime();}
function other(c){return c.user_id===me.user.id?c.astrologer:c.user}
function lastText(c){const m=(c.messages||[]).at(-1);if(m)return (m.sender_id===me.user.id?'You: ':'')+m.body;return c.status==='requested'?'Chat request sent':c.status==='astrologer_accepted'?'Astrologer accepted — confirm now':c.status==='closed'?'Chat ended':'No messages yet'}
function renderChatList(){const q=$('#search').value.trim().toLowerCase();let rows=allChats.filter(c=>filter==='all'||(filter==='accepted'?c.status==='accepted':filter==='requested'?['requested','astrologer_accepted'].includes(c.status):filter==='closed'?['closed','missed','rejected'].includes(c.status):true)).filter(c=>{const o=other(c);return !q||String(o?.full_name||'').toLowerCase().includes(q)||String(lastText(c)).toLowerCase().includes(q)});$('#chatList').innerHTML=rows.map(c=>{const o=other(c),t=c.last_message_at||c.updated_at||c.created_at;return `<div class="row" onclick="openConversation('${esc(c.id)}')">${avatar(o)}<div class="row-main"><div class="row-top"><div class="row-name">${esc(o?.full_name||'Astrologer')}</div><span class="row-time">${t?new Date(t).toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'}):''}</span></div><div class="preview"><span class="status-pill">${esc(statusLabel(c))}</span><span class="preview-text">${esc(lastText(c))}</span></div></div></div>`}).join('')||'<div class="empty">अभी कोई chat नहीं है।<br><br>Astrologers में जाकर Chat request भेजें।</div>'}
async function loadChats(){try{const x=await api('/api/chat');allChats=x.conversations||[];renderChatList();if(!cid){$('#name').textContent='Chats';$('#sub').textContent=allChats.length+' conversations'}}catch(e){$('#chatList').innerHTML='<div class="empty">'+esc(e.message)+'</div>'}}
async function openConversation(id){cid=id;try{const x=await api('/api/chat?conversation_id='+encodeURIComponent(cid));conv=x.conversation;conv.messages=x.messages||[];showChat()}catch(e){alert(e.message);loadChats()}}
function renderAvatar(p){$('#av').innerHTML=avatar(p)}
function renderInfo(){const o=other(conv);renderAvatar(o);$('#name').textContent=o?.full_name||'Chat';$('#sub').textContent=conv?.status==='accepted'?'online chat':'Chat · '+statusLabel(conv);const k=conv?.kundli;$('#info').innerHTML=k?`<b>Birth details:</b> ${esc(k.name)} · ${esc(k.dob)} · ${esc(k.birth_time)} · ${esc(k.place)} <button class="state" onclick="openKundli()">Open Kundli</button>`:''}
function renderState(){let html='';if(conv.status==='requested')html=`<div class="state">Chat request sent. Astrologer has <b data-deadline="${esc(new Date(new Date(conv.requested_at).getTime()+120000).toISOString())}">02:00</b> to accept.</div>`;else if(conv.status==='astrologer_accepted'&&me.user.role==='user')html=`<div class="state">Astrologer ने chat accept किया। <button onclick="confirmChat()">Confirm Chat</button> <b data-deadline="${esc(conv.user_confirm_deadline)}">02:00</b></div>`;else if(conv.status==='astrologer_accepted')html='<div class="state">User confirmation का इंतज़ार है…</div>';else if(conv.status==='missed'||conv.status==='rejected')html=`<div class="state danger">${esc(statusLabel(conv))}. यह chat request active नहीं है।</div>`;else if(conv.status==='closed')html='<div class="state">Chat ended. History read-only है।</div>';$('#state').innerHTML=html;$('#composer').style.display=conv.status==='accepted'&&conv.channel==='chat'?'flex':'none'}
function renderMessages(rows){const box=$('#messages'),at=box.scrollHeight-box.scrollTop-box.clientHeight<120;let last='';let html='';(rows||[]).forEach(m=>{const d=new Date(m.created_at),day=d.toLocaleDateString([], {day:'numeric',month:'short',year:'numeric'});if(day!==last){html+=`<div class="date-chip">${esc(day)}</div>`;last=day}const mine=m.sender_id===me.user.id;html+=`<div class="bubble ${mine?'mine':'other'}">${esc(m.body)}<div class="meta">${d.toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'})}${mine?'<span class="ticks read">✓✓</span>':''}</div></div>`});box.innerHTML=html||'<div class="empty">No messages yet. Say hello 👋</div>';if(at)box.scrollTop=box.scrollHeight}
async function refreshConversation(){if(!cid)return;try{const x=await api('/api/chat?conversation_id='+encodeURIComponent(cid));conv=x.conversation;conv.messages=x.messages||[];renderInfo();renderState();renderMessages(conv.messages)}catch(e){console.warn(e)}}
async function confirmChat(){try{const x=await api('/api/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action:'user-confirm',conversationId:cid})});conv=x.conversation;await refreshConversation()}catch(e){alert(e.message);refreshConversation()}}
async function endChat(){if(!conv||!['accepted','astrologer_accepted'].includes(conv.status))return;if(!confirm('Chat end करें?'))return;try{await api('/api/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action:'close',conversationId:cid})});await refreshConversation();loadChats()}catch(e){alert(e.message)}}
async function send(){const input=$('#input'),v=input.value.trim();if(!v||conv?.status!=='accepted')return;input.value='';try{await api('/api/messages',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({conversationId:cid,body:v})});if(channel)channel.send({type:'broadcast',event:'new_message',payload:{sender_id:me.user.id}});await refreshConversation();loadChats()}catch(e){alert(e.message);input.value=v}}
function startTimerLoop(){setInterval(()=>document.querySelectorAll('[data-deadline]').forEach(el=>{const ms=new Date(el.dataset.deadline).getTime()-Date.now();if(ms<=0){el.textContent='00:00';refreshConversation()}else{const s=Math.floor(ms/1000);el.textContent=String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0')}}),500)}
async function setupRealtime(){stopRealtime();try{sb=await window.SM_SUPABASE.setRealtimeAuth();if(!sb)return;channel=sb.channel('chat:'+cid,{config:{private:true}});channel.on('postgres_changes',{event:'INSERT',schema:'public',table:'messages',filter:'conversation_id=eq.'+cid},p=>{if(p.payload?.new?.sender_id!==me.user.id)refreshConversation()});channel.on('postgres_changes',{event:'UPDATE',schema:'public',table:'conversations',filter:'id=eq.'+cid},()=>refreshConversation());channel.on('broadcast',{event:'typing'},p=>{if(p.payload?.sender_id!==me.user.id){$('#typing').classList.toggle('show',!!p.payload?.typing)}});await channel.subscribe((status,err)=>{if(status==='CHANNEL_ERROR'||status==='TIMED_OUT')console.warn('Realtime',status,err)})}catch(e){console.warn('Realtime unavailable',e)}}
function stopRealtime(){if(channel&&sb){try{sb.removeChannel(channel)}catch(e){}}channel=null}
function toggleEmoji(){$('#emojiBox').classList.toggle('open')}
const emojis=['😀','😂','😊','😍','🙏','👍','❤️','🔥','🎉','😢','😄','😉','🤝','✨','💯','🕉️'];$('#emojiBox').innerHTML=emojis.map(e=>`<button type="button" onclick="addEmoji('${e}')">${e}</button>`).join('');function addEmoji(e){const i=$('#input');i.value+=e;i.focus();$('#emojiBox').classList.remove('open')}
$('#search').addEventListener('input',renderChatList);document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));b.classList.add('active');filter=b.dataset.filter;renderChatList()});$('#composer').onsubmit=e=>{e.preventDefault();send()};$('#input').addEventListener('input',()=>{if(channel){channel.send({type:'broadcast',event:'typing',payload:{sender_id:me.user.id,typing:true}});clearTimeout(typingTimer);typingTimer=setTimeout(()=>channel.send({type:'broadcast',event:'typing',payload:{sender_id:me.user.id,typing:false}}),900)}});function openKundli(){if(conv?.kundli?.id)location.href='/shared-kundli.html?kundali_id='+encodeURIComponent(conv.kundli.id);else alert('Kundli अभी available नहीं है।')};function toggleInfo(){if(conv){$('#info').classList.toggle('open')}}
(async()=>{try{if(!token())return location.href='/auth.html';me=await api('/api/me');$('#headActions').style.display=cid?'flex':'none';startTimerLoop();if(cid)await openConversation(cid);else{showList();await loadChats()}poll=setInterval(()=>cid?refreshConversation():loadChats(),5000)}catch(e){$('#chatList').innerHTML='<div class="empty">Chat load नहीं हो पाया: '+esc(e.message)+'</div>'}})();
</script>
</body></html>

<!doctype html><html lang="hi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Bhavishya Gyani — Chat</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="/supabase-client.js"></script>
<style>
:root{--bg:#0b0d10;--panel:#15181d;--line:#2a2f37;--text:#f5f7fa;--muted:#9da5b1;--gold:#ffc400;--green:#27d86a;--blue:#1689ff;--red:#ff4b55;--bubble:#20262d;--mine:#075e54}
*{box-sizing:border-box}html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Noto Sans Devanagari",sans-serif}button,input,textarea{font:inherit}.app{height:100%;max-width:1000px;margin:auto;display:grid;grid-template-columns:340px 1fr;background:var(--panel)}
.list{border-right:1px solid var(--line);display:flex;flex-direction:column;min-width:0}.top{height:64px;background:#111419;border-bottom:1px solid var(--line);display:flex;align-items:center;padding:0 15px;gap:10px}.brand{font-weight:900;font-size:19px;flex:1}.sub{font-size:11px;color:var(--muted)}.icon{border:0;background:transparent;color:#fff;font-size:22px;padding:7px;cursor:pointer}.search{padding:9px 12px;background:#111419;border-bottom:1px solid var(--line)}.search input{width:100%;border:1px solid var(--line);border-radius:10px;background:#0b0d10;color:#fff;padding:10px 12px;outline:none}.tabs{display:flex;gap:5px;padding:8px;border-bottom:1px solid var(--line);overflow:auto}.tabs button{white-space:nowrap;border:0;background:#20242a;color:#aeb5c0;border-radius:99px;padding:7px 11px;font-size:11px}.tabs button.active{background:var(--gold);color:#111;font-weight:800}.rows{overflow:auto;flex:1}.row{display:flex;align-items:center;gap:11px;padding:13px;border-bottom:1px solid #22262c;cursor:pointer}.row.active{background:#20242a}.avatar{width:49px;height:49px;border-radius:50%;object-fit:cover;background:#30353c;display:grid;place-items:center;font-weight:900;flex:none}.rowmain{min-width:0;flex:1}.rowtop{display:flex;justify-content:space-between;gap:8px}.name{font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.time{font-size:10px;color:var(--muted);white-space:nowrap}.preview{color:var(--muted);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:4px}.badge{display:inline-block;margin-top:5px;background:#3a4048;color:#dce2ea;border-radius:99px;padding:3px 7px;font-size:9px}.badge.green{background:#123e26;color:#7df2a3}.badge.gold{background:#594700;color:#ffe16b}.chat{display:flex;flex-direction:column;min-width:0;background:#0f1216}.chathead{height:64px;background:#15191e;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:8px;padding:0 10px}.chathead .info{flex:1;min-width:0}.chathead .info b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.chathead .info small{color:var(--muted);font-size:11px}.headbtn{border:1px solid #3a4048;background:#20242a;color:#fff;border-radius:8px;padding:6px 8px;font-size:11px;font-weight:800}.headbtn.red{background:#4d1b20;border-color:#78343a;color:#ffb5ba}.messages{flex:1;overflow:auto;padding:18px 13px;background:radial-gradient(circle at top,#171b21,#0f1216 55%);display:flex;flex-direction:column;gap:7px}.empty{margin:auto;text-align:center;color:var(--muted);padding:25px}.bubble{max-width:min(82%,560px);padding:8px 10px 6px;border-radius:12px;background:var(--bubble);align-self:flex-start}.bubble.mine{align-self:flex-end;background:var(--mine)}.body{font-size:14px;white-space:pre-wrap;word-break:break-word}.meta{display:flex;justify-content:flex-end;gap:5px;margin-top:3px;font-size:9px;color:#aeb6c0}.ticks.read{color:#54b8ff}.kundli-card{margin-top:8px;border:1px solid #58606b;border-radius:10px;background:#151a20;padding:10px}.kundli-card b{display:block;margin-bottom:4px}.kundli-open{border:0;border-radius:8px;background:var(--gold);color:#111;font-weight:900;padding:6px 9px;margin-top:7px;cursor:pointer}.composer{display:flex;gap:7px;padding:8px;background:#171b20;border-top:1px solid var(--line);align-items:flex-end}.composer textarea{flex:1;resize:none;max-height:100px;min-height:44px;border:1px solid var(--line);border-radius:12px;background:#0d1014;color:#fff;padding:11px;outline:none}.send{width:46px;height:44px;border:0;border-radius:12px;background:var(--gold);color:#111;font-weight:900}.typing{height:20px;padding:0 14px;color:#75d9ff;font-size:11px;background:#171b20}.requestbar{padding:10px 13px;background:#30280d;border-bottom:1px solid #574900;font-size:12px}.requestbar button{border:0;border-radius:8px;padding:7px 10px;margin:3px;font-weight:800}.accept{background:var(--green);color:#111}.support{margin:10px;border:1px solid #2d3948;border-radius:12px;background:#18212b;color:#cbd7e4;padding:11px;font-size:12px}.endnote{background:#32171a;border-color:#633238;color:#ffb6bb}.modal{position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:100;display:none;align-items:flex-end;justify-content:center}.modal.open{display:flex}.sheet{width:min(620px,100%);max-height:78vh;overflow:auto;background:#1a1d22;border:1px solid #3a3f47;border-radius:18px 18px 0 0;padding:16px}.sheethead{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}.kundli-option{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px;border:1px solid #343a43;border-radius:12px;margin:8px 0;background:#111419}.kundli-option small{color:#aaa}.sheet button{cursor:pointer}.closemodal{border:0;background:#343941;color:#fff;border-radius:8px;padding:7px 10px}.sharebtn{border:1px solid #3a4048;background:#20242a;color:#fff;border-radius:8px;padding:6px 8px;font-size:11px;font-weight:800}
@media(max-width:720px){.app{display:block;position:relative}.list{height:100%;border-right:0}.chat{position:fixed;inset:0;z-index:20;display:none}.chat.open{display:flex}.mobileBack{display:inline-block}.top{height:58px}.brand{font-size:18px}.bubble{max-width:88%}.chathead{padding:0 7px}.headbtn{font-size:10px;padding:6px}.info{min-width:70px}}
</style></head><body>
<div class="app"><section class="list" id="list"><header class="top"><div><div class="brand">Bhavishya Gyani</div><div class="sub" id="meLabel">Chat</div></div><button class="icon" id="homeBtn">⌂</button></header><div class="search"><input id="search" placeholder="Search chat..."></div><div class="tabs"><button class="active" data-tab="all">All</button><button data-tab="active">Active</button><button data-tab="requests">Requests</button><button data-tab="closed">Closed</button></div><div class="rows" id="rows"></div><div class="support">🔒 Conversation access केवल authorized participants के लिए है।</div></section>
<section class="chat" id="chat"><header class="chathead"><button class="icon mobileBack" id="back">‹</button><div class="avatar" id="headAvatar">?</div><div class="info"><b id="headName">Chat चुनें</b><small id="headStatus">Connecting…</small></div><button class="headbtn" id="detailsBtn" style="display:none">Details</button><button class="headbtn" id="shareBtn" style="display:none">📜 Kundli</button><button class="headbtn red" id="endBtn" style="display:none">End</button><button class="icon" id="refresh">↻</button></header><div id="requestbar"></div><div class="messages" id="messages"><div class="empty">बाईं तरफ से कोई chat चुनें।</div></div><div class="typing" id="typing"></div><div class="composer"><textarea id="input" placeholder="Message लिखें…" rows="1" disabled></textarea><button class="send" id="send" disabled>➤</button></div></section></div>
<div class="modal" id="kundliModal"><div class="sheet"><div class="sheethead"><b>कुंडली शेयर करें</b><button class="closemodal" id="closeModal">बंद करें</button></div><div id="kundliList">Loading…</div></div></div>
<script>
const $=s=>document.querySelector(s);const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
let session=null,me=null,convs=[],current=null,rt=null,rtClient=null,tab='all',listTimer=null,statusPoll=null,requestCountdown=null,messagePoll=null,typingTimer=null,lastMessageStamp='';
async function api(url,opt={}){const t=await window.SM_SUPABASE.getAccessToken();if(!t)throw Error('Login required');opt.headers={...(opt.headers||{}),Authorization:'Bearer '+t};const r=await fetch(url,opt);const j=await r.json().catch(()=>({}));if(!r.ok)throw Error(j.error||'Request failed');return j}
function other(c){if(!c)return {};if(c.user_id===me.id)return c.astrologer||c.admin||{full_name:'Support'};return c.user||c.admin||c.astrologer||{full_name:'User'}}
function fmt(v){try{return new Date(v).toLocaleTimeString('en-IN',{hour:'2-digit',minute:'2-digit'})}catch(e){return ''}}
function avatar(p){return p?.avatar_url?`<img class="avatar" src="${esc(p.avatar_url)}" alt="">`:`<div class="avatar">${esc((p?.full_name||'?').slice(0,1))}</div>`}
function badge(c){if(c.status==='accepted')return '<span class="badge green">Active</span>';if(['requested','astrologer_accepted'].includes(c.status))return '<span class="badge gold">Request</span>';return `<span class="badge">${esc(c.status)}</span>`}
function renderList(){const q=$('#search').value.trim().toLowerCase();const rows=convs.filter(c=>{const ok=tab==='all'||(tab==='active'&&c.status==='accepted')||(tab==='requests'&&['requested','astrologer_accepted'].includes(c.status))||(tab==='closed'&&['closed','missed','rejected'].includes(c.status));const p=other(c);return ok&&(!q||(`${p?.full_name||''} ${c.channel||''}`).toLowerCase().includes(q))});$('#rows').innerHTML=rows.map(c=>{const p=other(c);return `<div class="row ${current?.id===c.id?'active':''}" data-id="${esc(c.id)}">${avatar(p)}<div class="rowmain"><div class="rowtop"><span class="name">${esc(p?.full_name||'Chat')}</span><span class="time">${fmt(c.last_message_at||c.created_at)}</span></div><div class="preview">${esc(c.channel==='support'?'Admin Support':(c.channel||'chat'))}</div>${badge(c)}</div></div>`}).join('')||'<div class="empty">इस section में कोई chat नहीं है।</div>';document.querySelectorAll('.row[data-id]').forEach(x=>x.onclick=()=>openChat(x.dataset.id))}
async function loadConversations(){const x=await api('/api/chat');convs=x.conversations||[];renderList();if(current){const f=convs.find(c=>c.id===current.id);if(f){const changed=f.status!==current.status||f.last_message_at!==current.last_message_at;current=f;if(changed)updateHeaderControls()}}}
function setHeader(){const p=other(current);$('#headName').textContent=p?.full_name||'Chat';const old=$('#headAvatar');const el=p?.avatar_url?document.createElement('img'):document.createElement('div');el.className='avatar';el.id='headAvatar';if(p?.avatar_url){el.src=p.avatar_url;el.alt=''}else el.textContent=(p?.full_name||'?').slice(0,1);old.replaceWith(el);$('#headStatus').textContent=current?.status==='accepted'?'● Active Chat':'Waiting…'}
function requestBar(c){if(c.status==='requested')return `<div class="requestbar"><b>Chat request sent</b><br><span id="requestCountdown">02:00</span> — Astrologer के accept करने का इंतजार। अभी chat शुरू नहीं हुई है।</div>`;if(c.status==='astrologer_accepted'&&me.role==='user')return `<div class="requestbar"><b>Astrologer ने request accept कर ली है।</b><br><span id="userStartHint">Chat शुरू करने के लिए button दबाएँ।</span> <button class="accept" id="confirmBtn">Start Chat</button></div>`;if(c.status==='astrologer_accepted')return `<div class="requestbar"><b>Request accept हो गई है।</b><br><span id="userConfirmCountdown"></span> User के Start Chat दबाने का इंतजार। अभी messages बंद हैं।</div>`;if(c.status==='accepted')return `<div class="requestbar">🟢 Chat started — messages realtime/fast mode में चल रहे हैं।</div>`;if(c.status==='closed')return '<div class="requestbar endnote">🔴 Chat ended. History सुरक्षित है।</div>';if(c.status==='missed')return `<div class="requestbar endnote">Request missed (${esc(c.missed_by||'unknown')}).</div>`;if(c.status==='rejected')return '<div class="requestbar endnote">Request rejected.</div>';return ''}
function updateHeaderControls(){const active=current?.status==='accepted';const pending=current&&['requested','astrologer_accepted'].includes(current.status);$('#endBtn').style.display=active?'inline-block':'none';$('#shareBtn').style.display=(active&&me?.role==='user')?'inline-block':'none';$('#detailsBtn').style.display=(me?.role==='astrologer'&&(active||current?.status==='closed'))?'inline-block':'none';$('#input').disabled=!active;$('#send').disabled=!active}
async function renderCurrent(data){stopRequestTimers();stopMessagePoll();current=data.conversation;if(!current)throw Error('Conversation not found');setHeader();$('#requestbar').innerHTML=requestBar(current);$('#messages').innerHTML='';const active=current.status==='accepted';if(active){(data.messages||[]).forEach(addMessage);lastMessageStamp=(data.messages||[]).at(-1)?.created_at||''}else{$('#messages').innerHTML='<div class="empty">Chat अभी शुरू नहीं हुई है। Request/confirmation पूरा होने के बाद messages दिखाई देंगे।</div>'}updateHeaderControls();$('#requestbar').querySelector('#confirmBtn')?.addEventListener('click',confirmChat);if(innerWidth<=720)$('#chat').classList.add('open');if(active){markRead();startMessagePoll();}else startStatusWatch();startRequestTimers();await setupRealtime();renderList()}
function addMessage(m,opts={}){const id=String(m.id||m.client_id||'');if(id&&document.querySelector(`[data-message="${CSS.escape(id)}"]`))return;const d=document.createElement('div');d.className='bubble '+(m.sender_id===me.id?'mine':'');if(id)d.dataset.message=id;d.dataset.sender=String(m.sender_id||'');if(opts.pending)d.dataset.pending='1';const tick=m.sender_id===me.id?`<span class="ticks ${m.read_at?'read':''}">${m.read_at?'✓✓':'✓'}</span>`:'';let body=`<div class="body">${esc(m.body)}</div>`;if(m.kundali_id){body+=`<div class="kundli-card"><b>📜 Kundli shared</b><span style="font-size:11px;color:#aaa">इस chat में साझा की गई कुंडली</span><br><button class="kundli-open" onclick="openKundli('${esc(m.kundali_id)}')">Open Kundli</button></div>`}d.innerHTML=body+`<div class="meta">${fmt(m.created_at||new Date().toISOString())} ${tick}</div>`;$('#messages').appendChild(d);$('#messages').scrollTop=$('#messages').scrollHeight;return d}
async function refreshCurrent(){if(!current)return;await openChat(current.id)}
async function markRead(){if(!current||current.status!=='accepted')return;try{const ids=[...document.querySelectorAll('#messages [data-message]')].filter(el=>el.dataset.sender&&el.dataset.sender!==String(me.id)).map(el=>el.dataset.message).filter(Boolean);await api('/api/messages',{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify({conversationId:current.id,action:'read'})});if(rt&&ids.length)rt.send({type:'broadcast',event:'read',payload:{user_id:me.id,message_ids:ids}}).catch(()=>{})}catch(e){}}
async function send(){const text=$('#input').value.trim();if(!text||!current||current.status!=='accepted')return;$('#input').value='';const messageId=crypto.randomUUID?crypto.randomUUID():Date.now()+'-'+Math.random().toString(16).slice(2);const local={id:messageId,conversation_id:current.id,sender_id:me.id,body:text,created_at:new Date().toISOString(),read_at:null};addMessage(local,{pending:true});rt?.send({type:'broadcast',event:'message',payload:{message:local}}).catch(()=>{});try{const x=await api('/api/messages',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({conversationId:current.id,body:text,messageId})});const el=document.querySelector(`[data-message="${CSS.escape(messageId)}"]`);if(el){el.dataset.pending='0';if(x.message?.id&&x.message.id!==messageId)el.dataset.message=x.message.id;const tick=el.querySelector('.ticks');if(tick)tick.textContent='✓✓'}loadConversations().catch(()=>{})}catch(e){const el=document.querySelector(`[data-message="${CSS.escape(messageId)}"]`);if(el){el.style.opacity='.55';const meta=el.querySelector('.meta');if(meta)meta.insertAdjacentHTML('beforeend',' <span style="color:#ff6b6b">Failed</span>')}}}
async function confirmChat(){if(!current||current.status!=='astrologer_accepted')return;const b=$('#confirmBtn');if(b){b.disabled=true;b.textContent='Starting…'}try{const x=await api('/api/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action:'user-confirm',conversationId:current.id})});await renderCurrent(x);await loadConversations()}catch(e){if(b){b.disabled=false;b.textContent='Start Chat'}alert(e.message)}}
async function endChat(){if(!current||current.status!=='accepted')return;if(!confirm('इस chat को अभी समाप्त करें? History सुरक्षित रहेगी।'))return;const b=$('#endBtn');if(b)b.disabled=true;try{const x=await api('/api/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action:'close',conversationId:current.id})});await renderCurrent(x);await loadConversations()}catch(e){alert(e.message)}finally{if(b)b.disabled=false}}
async function setupRealtime(){try{if(rt){await rt.unsubscribe();rt=null}if(!current||current.status!=='accepted')return;if(!rtClient){const c=await (await fetch('/api/config')).json();if(!c.supabaseEnabled||!window.supabase?.createClient)return;rtClient=window.supabase.createClient(c.supabaseUrl,c.supabaseAnonKey,{realtime:{params:{eventsPerSecond:20}}})}rt=rtClient.channel('bg-chat-'+current.id,{config:{broadcast:{ack:true},presence:{key:String(me.id)}}});rt.on('broadcast',{event:'message'},e=>{if(!current||current.status!=='accepted')return;const m=e.payload?.message;if(!m||m.conversation_id!==current.id)return;if(m.sender_id!==me.id){addMessage(m);rt.send({type:'broadcast',event:'delivered',payload:{message_id:m.id,user_id:me.id}}).catch(()=>{});markRead()}}).on('broadcast',{event:'delivered'},e=>{if(e.payload?.user_id===me.id)return;const el=document.querySelector(`[data-message="${CSS.escape(String(e.payload?.message_id||''))}"]`);const tick=el?.querySelector('.ticks');if(tick&&!tick.classList.contains('read'))tick.textContent='✓✓'}).on('broadcast',{event:'read'},e=>{if(e.payload?.user_id===me.id)return;(e.payload?.message_ids||[]).forEach(id=>{const tick=document.querySelector(`[data-message="${CSS.escape(String(id))}"] .ticks`);if(tick){tick.textContent='✓✓';tick.classList.add('read')}})}).on('broadcast',{event:'typing'},e=>{if(e.payload?.user_id===me.id)return;$('#typing').textContent=e.payload?.typing?'Typing…':'';clearTimeout(window._typingHide);if(e.payload?.typing)window._typingHide=setTimeout(()=>$('#typing').textContent='',1200)});await rt.subscribe();$('#headStatus').textContent='● Live Chat'}catch(e){$('#headStatus').textContent='● Fast sync (fallback)'}}
async function pollMessages(){if(!current)return;try{const x=await api('/api/chat?conversation_id='+encodeURIComponent(current.id));if(!x.conversation)return;if(x.conversation.status!==current.status){await renderCurrent(x);return}if(current.status!=='accepted')return;const rows=x.messages||[];const existing=new Set([...document.querySelectorAll('#messages [data-message]')].map(e=>e.dataset.message));rows.forEach(m=>{if(!existing.has(String(m.id)))addMessage(m)});const last=rows.at(-1)?.created_at||'';if(last&&last!==lastMessageStamp){lastMessageStamp=last;markRead()}}catch(e){}}
function startMessagePoll(){stopMessagePoll();messagePoll=setInterval(pollMessages,2500)}function stopMessagePoll(){if(messagePoll){clearInterval(messagePoll);messagePoll=null}}
function startRequestTimers(){stopRequestTimers();if(!current)return;const tick=()=>{const el=$('#requestCountdown');if(current.status==='requested'&&el){const left=Math.max(0,new Date(current.requested_at||current.created_at).getTime()+120000-Date.now());const sec=Math.ceil(left/1000);el.textContent=String(Math.floor(sec/60)).padStart(2,'0')+':'+String(sec%60).padStart(2,'0');if(left<=0)loadAndRenderCurrent()}const ce=$('#userConfirmCountdown');if(current.status==='astrologer_accepted'&&ce){const left=Math.max(0,new Date(current.user_confirm_deadline||Date.now()).getTime()-Date.now());const sec=Math.ceil(left/1000);ce.textContent=left>0?`User confirmation window: ${String(Math.floor(sec/60)).padStart(2,'0')}:${String(sec%60).padStart(2,'0')}`:'Confirmation window expired.';if(left<=0)loadAndRenderCurrent()}};tick();requestCountdown=setInterval(tick,500)}
function stopRequestTimers(){if(requestCountdown){clearInterval(requestCountdown);requestCountdown=null}}
function startStatusWatch(){if(statusPoll)clearInterval(statusPoll);statusPoll=setInterval(async()=>{if(!current||!['requested','astrologer_accepted'].includes(current.status)){clearInterval(statusPoll);statusPoll=null;return}try{const x=await api('/api/chat?conversation_id='+encodeURIComponent(current.id));if(x.conversation?.status!==current.status||x.conversation?.user_confirm_deadline!==current.user_confirm_deadline){await renderCurrent(x);await loadConversations()}}catch(e){}},1000)}
function openKundli(kid){location.href='/shared-kundli.html?kundali_id='+encodeURIComponent(kid)}
async function openDetails(){if(current)location.href='/shared-kundli.html?conversation_id='+encodeURIComponent(current.id)}
async function loadMyKundlis(){if(me?.role!=='user'||!current||current.status!=='accepted')return;const box=$('#kundliList');box.textContent='Loading…';try{const x=await api('/api/my-kundlis');const rows=x.kundlis||[];box.innerHTML=rows.length?rows.map(k=>`<div class="kundli-option"><div><b>${esc(k.name||'Kundli')}</b><small>${esc(k.dob||'')} · ${esc(k.birth_time||'')} · ${esc(k.place||'')}</small></div><button class="sharebtn" data-kid="${esc(k.id)}" data-name="${esc(k.name||'Kundli')}">Share</button></div>`).join(''):'<div class="empty">कोई saved Kundli नहीं मिली। पहले Free Kundli बनाएं।</div>';box.querySelectorAll('[data-kid]').forEach(b=>b.onclick=()=>shareKundli(b.dataset.kid,b.dataset.name))}catch(e){box.innerHTML='<div class="empty">'+esc(e.message)+'</div>'}}
async function shareKundli(kid,name){if(!current||current.status!=='accepted')return;try{const text='📜 Kundli shared: '+name;const x=await api('/api/messages',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({conversationId:current.id,body:text,kundaliId:kid,messageId:crypto.randomUUID?crypto.randomUUID():String(Date.now())})});addMessage(x.message);rt?.send({type:'broadcast',event:'message',payload:{message:x.message}}).catch(()=>{});$('#kundliModal').classList.remove('open');loadConversations().catch(()=>{})}catch(e){alert(e.message)}}
$('#shareBtn').onclick=()=>{if(!current||current.status!=='accepted')return;$('#kundliModal').classList.add('open');loadMyKundlis()};$('#closeModal').onclick=()=>$('#kundliModal').classList.remove('open');$('#kundliModal').onclick=e=>{if(e.target.id==='kundliModal')e.currentTarget.classList.remove('open')};$('#detailsBtn').onclick=openDetails;$('#endBtn').onclick=endChat;$('#send').onclick=send;$('#refresh').onclick=refreshCurrent;$('#back').onclick=()=>$('#chat').classList.remove('open');$('#search').oninput=renderList;$('#homeBtn').onclick=()=>location.href=me?.role==='astrologer'?'/astrologer-dashboard.html':'/';document.querySelectorAll('.tabs button').forEach(b=>b.onclick=()=>{document.querySelectorAll('.tabs button').forEach(x=>x.classList.remove('active'));b.classList.add('active');tab=b.dataset.tab;renderList()});$('#input').addEventListener('input',()=>{if(current?.status==='accepted'&&rt){rt.send({type:'broadcast',event:'typing',payload:{user_id:me.id,typing:true}}).catch(()=>{});clearTimeout(typingTimer);typingTimer=setTimeout(()=>rt?.send({type:'broadcast',event:'typing',payload:{user_id:me.id,typing:false}}),800)}});$('#input').addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();send()}});
async function startNew(){const p=new URLSearchParams(location.search),type=p.get('new'),aid=p.get('astrologer_id');if(!type)return;if(type==='chat'||type==='call'){const action=type==='chat'?'request':type;const x=await api('/api/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action,astrologerId:aid})});history.replaceState({},'',`/chat.html?conversation_id=${encodeURIComponent(x.conversation.id)}`);await loadConversations();await openChat(x.conversation.id)}}
async function openChat(id){try{const x=await api('/api/chat?conversation_id='+encodeURIComponent(id));await renderCurrent(x)}catch(e){alert(e.message)}}
async function loadAndRenderCurrent(){if(!current)return;try{const x=await api('/api/chat?conversation_id='+encodeURIComponent(current.id));await renderCurrent(x);await loadConversations()}catch(e){}}
(async()=>{try{session=await window.SM_SUPABASE.getSession();if(!session)return location.replace(me?.role==='astrologer'?'/astrologer-login.html':'/auth.html');const x=await api('/api/me');me=x.user;if(!me?.id)throw Error('Account identity नहीं मिली');$('#meLabel').textContent=(me.name||me.email||'Account')+' • '+me.role;await loadConversations();const p=new URLSearchParams(location.search);if(p.get('conversation_id'))await openChat(p.get('conversation_id'));else await startNew();listTimer=setInterval(()=>loadConversations().catch(()=>{}),5000)}catch(e){alert(e.message);location.replace(me?.role==='astrologer'?'/astrologer-login.html':'/auth.html')}})();
</script></body></html>

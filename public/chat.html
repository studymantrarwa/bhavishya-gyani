<!doctype html><html lang="hi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Bhavishya Gyani — Chat</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="/supabase-client.js?v=20260921fix"></script><script src="https://cdn.socket.io/4.8.1/socket.io.min.js"></script>
<style>
:root{--bg:#0b0d10;--panel:#15181d;--panel2:#1b1f25;--line:#2a2f37;--text:#f5f7fa;--muted:#9da5b1;--gold:#ffc400;--green:#27d86a;--blue:#1689ff;--bubble:#20262d;--mine:#075e54}*{box-sizing:border-box}html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Noto Sans Devanagari",sans-serif}button,input{font:inherit}.app{height:100%;max-width:980px;margin:auto;display:grid;grid-template-columns:340px 1fr;background:var(--panel)}.list{border-right:1px solid var(--line);display:flex;flex-direction:column;min-width:0}.top{height:64px;background:#111419;border-bottom:1px solid var(--line);display:flex;align-items:center;padding:0 15px;gap:10px}.brand{font-weight:900;font-size:19px;flex:1}.sub{font-size:11px;color:var(--muted)}.icon{border:0;background:transparent;color:#fff;font-size:22px;padding:7px;cursor:pointer}.search{padding:9px 12px;background:#111419;border-bottom:1px solid var(--line)}.search input{width:100%;border:1px solid var(--line);border-radius:10px;background:#0b0d10;color:#fff;padding:10px 12px;outline:none}.tabs{display:flex;gap:5px;padding:8px;border-bottom:1px solid var(--line);overflow:auto}.tabs button{white-space:nowrap;border:0;background:#20242a;color:#aeb5c0;border-radius:99px;padding:7px 11px;font-size:11px}.tabs button.active{background:var(--gold);color:#111;font-weight:800}.rows{overflow:auto;flex:1}.row{display:flex;align-items:center;gap:11px;padding:13px;border-bottom:1px solid #22262c;cursor:pointer}.row:hover,.row.active{background:#20242a}.avatar{width:49px;height:49px;border-radius:50%;object-fit:cover;background:#30353c;display:grid;place-items:center;font-weight:900;flex:none}.rowmain{min-width:0;flex:1}.rowtop{display:flex;justify-content:space-between;gap:8px}.name{font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.time{font-size:10px;color:var(--muted);white-space:nowrap}.preview{color:var(--muted);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:4px}.badge{display:inline-block;margin-top:5px;background:#3a4048;color:#dce2ea;border-radius:99px;padding:3px 7px;font-size:9px}.badge.green{background:#123e26;color:#7df2a3}.badge.gold{background:#594700;color:#ffe16b}.badge.blue{background:#123a61;color:#7cc2ff}.chat{display:flex;flex-direction:column;min-width:0;background:#0f1216}.chathead{height:64px;background:#15191e;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px;padding:0 13px}.chathead .info{flex:1;min-width:0}.chathead .info b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.chathead .info small{color:var(--muted);font-size:11px}.online{color:#50e47d}.offline{color:var(--muted)}.messages{flex:1;overflow:auto;padding:18px 13px;background:radial-gradient(circle at top,#171b21,#0f1216 55%);display:flex;flex-direction:column;gap:6px}.empty{margin:auto;text-align:center;color:var(--muted);padding:25px}.bubble{max-width:min(78%,520px);padding:8px 10px 6px;border-radius:12px;background:var(--bubble);align-self:flex-start;box-shadow:0 1px 1px #0004}.bubble.mine{align-self:flex-end;background:var(--mine)}.body{font-size:14px;white-space:pre-wrap;word-break:break-word}.meta{display:flex;justify-content:flex-end;gap:5px;margin-top:3px;font-size:9px;color:#aeb6c0}.ticks.read{color:#54b8ff}.composer{display:flex;gap:8px;padding:9px;background:#171b20;border-top:1px solid var(--line)}.composer textarea{flex:1;resize:none;max-height:100px;min-height:44px;border:1px solid var(--line);border-radius:12px;background:#0d1014;color:#fff;padding:11px;outline:none}.send{width:48px;height:44px;border:0;border-radius:12px;background:var(--gold);color:#111;font-weight:900}.typing{height:20px;padding:0 14px;color:#75d9ff;font-size:11px;background:#171b20}.requestbar{padding:10px 13px;background:#30280d;border-bottom:1px solid #574900;font-size:12px}.requestbar button{border:0;border-radius:8px;padding:7px 10px;margin-left:7px;font-weight:800}.accept{background:var(--green)}.close{background:#3b4047;color:#fff}.support{margin:10px;border:1px solid #2d3948;border-radius:12px;background:#18212b;color:#cbd7e4;padding:11px;font-size:12px}.fab{position:absolute;bottom:78px;left:calc(50% - 170px);border:0;background:var(--gold);color:#111;border-radius:99px;padding:10px 15px;font-weight:900;display:none}.mobileBack{display:none}@media(max-width:720px){.app{display:block;position:relative}.list{height:100%;border-right:0}.chat{position:fixed;inset:0;z-index:20;display:none}.chat.open{display:flex}.mobileBack{display:inline-block}.fab{display:block}.top{height:58px}.brand{font-size:18px}.bubble{max-width:86%}}
</style></head><body><div class="app"><section class="list" id="list"><header class="top"><div><div class="brand">Bhavishya Gyani</div><div class="sub" id="meLabel">Chat</div></div><button class="icon" onclick="location.href='/dashboard.html'">⌂</button></header><div class="search"><input id="search" placeholder="Search chat..." oninput="renderList()"></div><div class="tabs"><button class="active" data-tab="all">All</button><button data-tab="active">Active</button><button data-tab="requests">Requests</button><button data-tab="closed">Closed</button></div><div class="rows" id="rows"></div><div class="support">🔒 आपकी chat आपकी Supabase account identity से जुड़ी है। दूसरे user को आपकी conversation access नहीं मिलेगी।</div></section><section class="chat" id="chat"><header class="chathead"><button class="icon mobileBack" onclick="closeMobileChat()">‹</button><div class="avatar" id="headAvatar">?</div><div class="info"><b id="headName">Chat चुनें</b><small id="headStatus">Socket connecting…</small></div><button class="icon" onclick="refreshCurrent()">↻</button><button class="icon" onclick="closeCurrent()">⋮</button></header><div id="requestbar"></div><div class="messages" id="messages"><div class="empty">बाईं तरफ से कोई chat चुनें।</div></div><div class="typing" id="typing"></div><div class="composer"><textarea id="input" placeholder="Message लिखें…" rows="1" disabled></textarea><button class="send" id="send" disabled onclick="send()">➤</button></div></section></div>
<script>
const $=s=>document.querySelector(s);let session=null,me=null,convs=[],current=null,socket=null,tab='all',typingTimer=null;
const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
const token=()=>localStorage.getItem('studyMantraToken');
async function api(url,opt={}){const t=await window.SM_SUPABASE.getAccessToken()||token();if(!t)throw Error('Login required');opt.headers={...(opt.headers||{}),Authorization:'Bearer '+t};const r=await fetch(url,opt);const j=await r.json().catch(()=>({}));if(!r.ok)throw Error(j.error||'Request failed');return j}
function other(c){if(c.user_id===me.id)return c.astrologer||c.admin||{full_name:'Support'};return c.user||c.admin||c.astrologer||{full_name:'User'} }
function avatar(p){return p?.avatar_url?`<img class="avatar" src="${esc(p.avatar_url)}" alt="">`:`<div class="avatar">${esc((p?.full_name||'?').slice(0,1))}</div>`}
function status(c){if(c.status==='accepted')return '<span class="badge green">Active</span>';if(c.status==='requested'||c.status==='astrologer_accepted')return '<span class="badge gold">Request</span>';if(c.status==='closed')return '<span class="badge">Closed</span>';return `<span class="badge">${esc(c.status)}</span>`}
function renderList(){const q=$('#search').value.trim().toLowerCase();let rows=convs.filter(c=>{const ok=tab==='all'||(tab==='active'&&c.status==='accepted')||(tab==='requests'&&['requested','astrologer_accepted'].includes(c.status))||(tab==='closed'&&c.status==='closed');const p=other(c);return ok&&(!q||(`${p?.full_name||''} ${c.channel||''}`).toLowerCase().includes(q))});$('#rows').innerHTML=rows.map(c=>{const p=other(c),last=c._last?.body||'No messages yet';return `<div class="row ${current?.id===c.id?'active':''}" onclick="openChat('${c.id}')">${avatar(p)}<div class="rowmain"><div class="rowtop"><span class="name">${esc(p?.full_name||'User')}</span><span class="time">${fmt(c.last_message_at||c.created_at)}</span></div><div class="preview">${esc(last)}</div>${status(c)}</div></div>`}).join('')||'<div class="empty">इस section में कोई chat नहीं है।</div>'}
function fmt(v){try{return new Date(v).toLocaleTimeString('en-IN',{hour:'2-digit',minute:'2-digit'})}catch(_){return ''}}
function setupSocket(){if(!window.io)return;socket=io({path:'/api/socket-io/socket.io',transports:['websocket','polling'],auth:{token:token()||''},reconnection:true,reconnectionAttempts:Infinity,reconnectionDelay:700,reconnectionDelayMax:5000});socket.on('connect',()=>{$('#headStatus').textContent='● Connected';$('#headStatus').className='online';if(current)joinRoom(current.id)});socket.on('disconnect',()=>{$('#headStatus').textContent='○ Reconnecting…';$('#headStatus').className='offline'});socket.on('connect_error',e=>{$('#headStatus').textContent='Socket: '+(e.message||'error')});socket.on('message:new',e=>{if(current&&e.message?.conversation_id===current.id){addMessage(e.message);markRead()}loadConversations()});socket.on('conversation:changed',()=>loadConversations());socket.on('typing',e=>{if(current&&e.user_id!==me.id)$('#typing').textContent=e.typing?'Typing…':''});socket.on('message:read',e=>{if(current&&e.conversation_id===current.id)loadCurrent(false)});socket.on('presence',e=>{if(current&&e.user_id!==me.id)$('#headStatus').textContent=e.online?'● Online':'○ Offline'})}
function joinRoom(id){if(!socket?.connected)return;socket.emit('join_conversation',{conversationId:id},r=>{if(!r?.ok)$('#headStatus').textContent=r?.error||'Socket access denied';else $('#headStatus').textContent='● Connected'})}
async function loadConversations(){try{const x=await api('/api/chat');convs=x.conversations||[];for(const c of convs){if(c._last===undefined)c._last=null}renderList();if(current){const fresh=convs.find(x=>x.id===current.id);if(fresh)current=fresh}}catch(e){$('#rows').innerHTML=`<div class="empty">${esc(e.message)}</div>`}}
async function openChat(id){try{const x=await api('/api/chat?conversation_id='+encodeURIComponent(id));current=x.conversation;renderList();$('#headName').textContent=other(current)?.full_name||'Chat';$('#headAvatar').replaceWith((()=>{const a=other(current);const el=document.createElement(a?.avatar_url?'img':'div');el.className='avatar';if(a?.avatar_url){el.src=a.avatar_url;el.alt='';}else el.textContent=(a?.full_name||'?').slice(0,1);el.id='headAvatar';return el})());$('#requestbar').innerHTML=requestBar(current);$('#messages').innerHTML='';(x.messages||[]).forEach(addMessage);joinRoom(id);markRead();$('#input').disabled=current.status!=='accepted';$('#send').disabled=current.status!=='accepted';if(innerWidth<=720)$('#chat').classList.add('open');}catch(e){alert(e.message)}}
function requestBar(c){if(c.status==='requested')return `<div class="requestbar">Chat request pending. ${me.role==='admin'?'<button class="accept" onclick="adminAccept()">Accept</button>':''}</div>`;if(c.status==='astrologer_accepted')return `<div class="requestbar">Astrologer accepted. User confirmation is required.</div>`;if(c.status==='closed')return '<div class="requestbar">This chat is closed. History is saved.</div>';return ''}
function addMessage(m){const mine=m.sender_id===me.id;const d=document.createElement('div');d.className='bubble '+(mine?'mine':'');d.dataset.id=m.id;d.innerHTML=`<div class="body">${esc(m.body)}</div><div class="meta">${fmt(m.created_at)} ${mine?`<span class="ticks ${m.read_at?'read':''}">${m.read_at?'✓✓':'✓'}</span>`:''}</div>`;$('#messages').appendChild(d);$('#messages').scrollTop=$('#messages').scrollHeight}
function markRead(){if(socket?.connected&&current?.status==='accepted')socket.emit('read_messages',{conversationId:current.id})}
async function send(){const text=$('#input').value.trim();if(!text||!current)return;$('#input').value='';if(socket?.connected){socket.emit('send_message',{conversationId:current.id,body:text},r=>{if(!r?.ok){fallbackSend(text,r?.error)}})}else fallbackSend(text)}
async function fallbackSend(text,err){try{const x=await api('/api/messages',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({conversationId:current.id,body:text})});addMessage(x.message)}catch(e){alert(err||e.message)}}
$('#input').addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();send()}if(socket?.connected&&current){socket.emit('typing',{conversationId:current.id,typing:true});clearTimeout(typingTimer);typingTimer=setTimeout(()=>socket.emit('typing',{conversationId:current.id,typing:false}),900)}});
async function adminAccept(){if(me.role!=='admin'||!current)return;try{await api('/api/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action:'admin-accept',conversationId:current.id})});await openChat(current.id);loadConversations()}catch(e){alert(e.message)}}
async function closeCurrent(){if(!current)return;if(!confirm('इस chat को close करें? History बनी रहेगी।'))return;try{await api('/api/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action:'close',conversationId:current.id})});await openChat(current.id);loadConversations()}catch(e){alert(e.message)}}
function closeMobileChat(){$('#chat').classList.remove('open')}
async function refreshCurrent(){if(current)await openChat(current.id);else await loadConversations()}
async function loadCurrent(){if(current)await openChat(current.id)}
document.querySelectorAll('.tabs button').forEach(b=>b.onclick=()=>{document.querySelectorAll('.tabs button').forEach(x=>x.classList.remove('active'));b.classList.add('active');tab=b.dataset.tab;renderList()});
(async()=>{try{session=await window.SM_SUPABASE.getSession();if(!session)return location.href='/auth.html';const x=await api('/api/me');me=x.user;$('#meLabel').textContent=(me.name||me.email||'Account')+' • '+me.role;await loadConversations();setupSocket();const params=new URLSearchParams(location.search);const q=params.get('conversation_id');if(q)await openChat(q);else if(params.get('support')==='1'&&me.role==='user'){const x=await api('/api/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action:'request'})});await loadConversations();await openChat(x.conversation.id)}}catch(e){alert(e.message);location.href='/auth.html'}})();
</script></body></html>

<!doctype html>
<html lang="hi">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Chat — Bhavishya Gyani</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="/supabase-client.js"></script>
<style>
*{box-sizing:border-box}body{margin:0;background:#111;color:#111;font-family:system-ui,-apple-system,"Noto Sans Devanagari",sans-serif}.app{max-width:760px;margin:auto;height:100vh;background:#efeae2;display:flex;flex-direction:column}.top{height:62px;background:#ffc400;display:flex;align-items:center;padding:0 12px;gap:10px;flex:0 0 auto}.top a{color:#111;text-decoration:none;font-size:27px}.title{font-weight:900;font-size:18px;flex:1}.search{padding:9px;background:#f7f4ee;border-bottom:1px solid #ddd}.search input{width:100%;border:1px solid #ccc;border-radius:22px;padding:11px 14px;outline:0;font-size:14px}.tabs{display:flex;background:#fff;border-bottom:1px solid #ddd}.tabs button{flex:1;border:0;background:#fff;padding:11px 4px;font-weight:800;font-size:12px}.tabs button.active{color:#9a7600;border-bottom:3px solid #ffc400}.list{flex:1;overflow:auto;background:#fff}.row{display:flex;align-items:center;gap:11px;padding:12px;border-bottom:1px solid #eee;cursor:pointer}.row:active{background:#f2f2f2}.avatar{width:48px;height:48px;border-radius:50%;object-fit:cover;background:#777;color:#fff;display:grid;place-items:center;font-weight:900;flex:0 0 48px}.rowmain{min-width:0;flex:1}.rowtop{display:flex;gap:8px}.name{font-weight:900;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.time{font-size:10px;color:#777}.preview{font-size:12px;color:#777;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:3px}.badge{font-size:10px;padding:3px 7px;border-radius:12px;background:#e7f7e9;color:#167331}.empty{padding:45px 20px;text-align:center;color:#777}.fab{position:absolute;right:18px;bottom:22px;border:0;border-radius:50%;width:54px;height:54px;background:#ffc400;font-size:26px;box-shadow:0 4px 14px #0004}.chatview{display:none;height:100%;flex-direction:column}.chathead{height:62px;background:#ffc400;display:flex;align-items:center;padding:0 10px;gap:9px}.chathead button{border:0;background:#111;color:#fff;border-radius:8px;padding:7px 9px;font-weight:800}.headname{flex:1;min-width:0}.headname b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.headname span{font-size:10px;color:#5d5200}.info{background:#fff;padding:8px 11px;border-bottom:1px solid #ddd;font-size:11px}.messages{flex:1;overflow:auto;padding:12px 10px}.bubble{max-width:80%;background:#fff;border-radius:9px;padding:8px 10px;margin:5px 0;box-shadow:0 1px 1px #0002;white-space:pre-wrap;font-size:14px}.mine{margin-left:auto;background:#dcffc4}.bt{font-size:9px;color:#777;text-align:right;margin-top:3px}.state{background:#fff6cc;text-align:center;padding:9px;font-size:12px}.state button,.open{border:0;background:#1689ff;color:#fff;border-radius:8px;padding:7px 10px;font-weight:800}.composer{display:none;gap:7px;padding:8px;background:#f5f4ef;border-top:1px solid #ccc}.composer input{flex:1;border:1px solid #ccc;border-radius:22px;padding:11px 14px;font-size:14px}.composer button{width:48px;border:0;border-radius:50%;background:#ffc400;font-size:20px}.typing{height:18px;padding-left:12px;font-size:10px;color:#777}.danger{background:#ffe0e2}.confirm{background:#dff2ff}.bottom{height:55px;background:#fff;border-top:1px solid #ddd;display:flex}.bottom a{flex:1;text-align:center;text-decoration:none;color:#555;font-size:10px;padding:7px}.bottom b{display:block;font-size:18px}.back{font-size:25px;background:none;border:0}.chatview .messages{background:#efeae2}
</style></head>
<body><div class="app">
<section id="listView" style="height:100%;display:flex;flex-direction:column"><header class="top"><a href="/dashboard.html">‹</a><div class="title">Chats</div><span id="count">0</span></header><div class="search"><input id="search" placeholder="Search chats…"></div><div class="tabs"><button class="active" data-tab="all">All</button><button data-tab="active">Active</button><button data-tab="requests">Requests</button><button data-tab="closed">Closed</button></div><div id="chatList" class="list"><div class="empty">Chats loading…</div></div><button class="fab" onclick="location.href='/dashboard.html#astrologers'">＋</button><nav class="bottom"><a href="/dashboard.html"><b>⌂</b>Home</a><a href="/dashboard.html#astrologers"><b>☀</b>Astrologers</a><a href="/chat.html"><b>☁</b>Chat</a><a href="/kundli-form.html"><b>✧</b>Kundli</a><a href="/tools.html"><b>☷</b>More</a></nav></section>
<section id="chatView" class="chatview"><header class="chathead"><button class="back" onclick="showList()">‹</button><div id="av"></div><div class="headname"><b id="name">Chat</b><span id="sub">Connecting…</span></div><button onclick="openKundli()">Kundli</button><button onclick="endChat()">End</button></header><div id="info" class="info"></div><div id="state"></div><div id="messages" class="messages"></div><div id="typing" class="typing"></div><form id="composer" class="composer"><input id="input" autocomplete="off" placeholder="Message लिखें…"><button>➤</button></form></section>
</div>
<script>
const $=s=>document.querySelector(s), token=()=>localStorage.getItem('studyMantraToken');let me=null,conv=null,cid=new URLSearchParams(location.search).get('conversation_id'),poll=null,channel=null,sb=null;let all=[];let activeTab='all';
const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
async function api(url,opt={}){opt.headers={...(opt.headers||{}),Authorization:'Bearer '+token()};const r=await fetch(url,opt);const j=await r.json().catch(()=>({}));if(!r.ok)throw Error(j.error||'Request failed');return j}
function av(p){return p?.avatar_url?`<img class="avatar" src="${esc(p.avatar_url)}">`:`<div class="avatar">${esc((p?.full_name||'A').slice(0,1))}</div>`}
function statusLabel(c){return c.status==='accepted'?'Active':c.status==='requested'?'Request sent':c.status==='astrologer_accepted'?'Confirm pending':c.status==='closed'?'Closed':c.status==='missed'?'Missed':c.status==='rejected'?'Rejected':c.status}
function renderList(){const q=$('#search').value.trim().toLowerCase();let rows=all.filter(c=>{const s=c.status;const ok=activeTab==='all'||(activeTab==='active'&&['accepted','astrologer_accepted'].includes(s))||(activeTab==='requests'&&['requested','astrologer_accepted'].includes(s))||(activeTab==='closed'&&['closed','missed','rejected'].includes(s));const o=c.user_id===me.user.id?c.astrologer:c.user;return ok&&(!q||String(o?.full_name||'').toLowerCase().includes(q))});$('#count').textContent=rows.length;$('#chatList').innerHTML=rows.map(c=>{const o=c.user_id===me.user.id?c.astrologer:c.user;const t=c.last_message_at||c.created_at;return `<div class="row" onclick="openChat('${esc(c.id)}')">${av(o)}<div class="rowmain"><div class="rowtop"><div class="name">${esc(o?.full_name||'Astrologer')}</div><div class="time">${new Date(t).toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'})}</div></div><div class="preview">${esc(statusLabel(c))} · ${c.channel==='call'?'☎ Call':'☁ Chat'}</div></div><span class="badge">${esc(statusLabel(c))}</span></div>`}).join('')||'<div class="empty">अभी कोई chat नहीं है।<br><br>Astrologers में जाकर Chat दबाएँ।</div>'}
async function loadList(){try{const x=await api('/api/chat');all=x.conversations||[];renderList()}catch(e){$('#chatList').innerHTML='<div class="empty">'+esc(e.message)+'</div>'}}
function showList(){cid=null;conv=null;history.replaceState({},'', '/chat.html');$('#chatView').style.display='none';$('#listView').style.display='flex';if(poll)clearInterval(poll);loadList()}
async function openChat(id){cid=id;history.replaceState({},'', '/chat.html?conversation_id='+encodeURIComponent(id));$('#listView').style.display='none';$('#chatView').style.display='flex';await loadChat();if(poll)clearInterval(poll);poll=setInterval(loadChat,7000);setupRealtime()}
function renderChat(){const o=me.user.role==='astrologer'?conv.user:conv.astrologer;$('#av').innerHTML=av(o);$('#name').textContent=o?.full_name||'User';$('#sub').textContent=conv.status==='accepted'?'● Live Chat':statusLabel(conv);$('#info').innerHTML=conv.kundli?`नाम: <b>${esc(conv.kundli.name)}</b> · DOB: ${esc(conv.kundli.dob)} · Time: ${esc(conv.kundli.birth_time)} · Place: ${esc(conv.kundli.place)}`:'Birth details chat confirm होने के बाद उपलब्ध होंगे।';let st='';if(conv.status==='requested')st='<div class="state">Astrologer acceptance pending — 2 मिनट का window.</div>';if(conv.status==='astrologer_accepted'&&me.user.role==='user')st='<div class="state confirm">Astrologer ने accept किया। <button onclick="confirmChat()">Confirm Chat</button></div>';if(conv.status==='astrologer_accepted'&&me.user.role==='astrologer')st='<div class="state confirm">User confirmation का इंतज़ार है।</div>';if(['missed','rejected'].includes(conv.status))st='<div class="state danger">'+esc(statusLabel(conv))+'</div>';if(conv.status==='closed')st='<div class="state">Chat ended. History उपलब्ध है।</div>';$('#state').innerHTML=st;$('#composer').style.display=conv.status==='accepted'&&conv.channel==='chat'?'flex':'none';const rows=conv.messages||[];$('#messages').innerHTML=rows.map(m=>`<div class="bubble ${m.sender_id===me.user.id?'mine':''}">${esc(m.body)}<div class="bt">${new Date(m.created_at).toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'})}</div></div>`).join('')||'<div class="empty">No messages yet.</div>';const box=$('#messages');box.scrollTop=box.scrollHeight}
async function loadChat(){if(!cid)return;try{const x=await api('/api/chat?conversation_id='+encodeURIComponent(cid));conv=x.conversation;conv.messages=x.messages||[];renderChat()}catch(e){alert(e.message);showList()}}
async function confirmChat(){try{await api('/api/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action:'user-confirm',conversationId:cid})});await loadChat()}catch(e){alert(e.message)}}
async function endChat(){if(!conv||!['accepted','astrologer_accepted'].includes(conv.status))return;try{await api('/api/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action:'close',conversationId:cid})});await loadChat()}catch(e){alert(e.message)}}
async function send(){const input=$('#input'),v=input.value.trim();if(!v)return;input.value='';try{await api('/api/messages',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({conversationId:cid,body:v})});await loadChat()}catch(e){alert(e.message);input.value=v}}
function openKundli(){if(conv?.kundli?.id)location.href='/shared-kundli.html?kundali_id='+encodeURIComponent(conv.kundli.id);else alert('Kundli अभी available नहीं है।')}
async function setupRealtime(){try{sb=await window.SM_SUPABASE.init();if(!sb||!cid)return;channel=sb.channel('chat-list:'+cid);channel.on('postgres_changes',{event:'*',schema:'public',table:'messages',filter:'conversation_id=eq.'+cid},()=>loadChat());channel.on('postgres_changes',{event:'*',schema:'public',table:'conversations',filter:'id=eq.'+cid},()=>loadChat());await channel.subscribe()}catch(e){}}
$('#composer').onsubmit=e=>{e.preventDefault();send()};$('#search').oninput=renderList;document.querySelectorAll('.tabs button').forEach(b=>b.onclick=()=>{document.querySelectorAll('.tabs button').forEach(x=>x.classList.remove('active'));b.classList.add('active');activeTab=b.dataset.tab;renderList()});
(async()=>{try{if(!token())return location.href='/auth.html';const x=await api('/api/me');me=x;if(cid)openChat(cid);else{await loadList();poll=setInterval(loadList,10000)}}catch(e){alert(e.message);location.href='/auth.html'}})();
</script></body></html>

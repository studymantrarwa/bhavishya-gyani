<!doctype html><html lang="hi"><head><script src="/auth-guard.js"></script><script>BG_AUTH.check("user");</script><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Bhavishya Gyani — Settings</title><style>:root{--gold:#ffc400;--bg:#090a0b;--card:#17181b;--line:#303136;--muted:#aaa}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:#fff;font-family:system-ui,-apple-system,"Noto Sans Devanagari",sans-serif}.app{max-width:720px;margin:auto;min-height:100vh}.top{height:62px;background:var(--gold);color:#111;display:flex;align-items:center;padding:0 15px;gap:12px;position:sticky;top:0;z-index:5}.top a{font-size:27px;color:#111;text-decoration:none}.brand{font-size:20px;font-weight:900}.card{margin:12px;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px}.tabs{display:flex;gap:7px;overflow:auto;padding:12px}.tabs button{white-space:nowrap;border:1px solid #444;background:#222;color:#ddd;border-radius:9px;padding:9px 11px;font-weight:800}.tabs button.active{background:var(--gold);color:#111}.row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 0;border-bottom:1px solid #292929}.row:last-child{border-bottom:0}.row small{color:#999;display:block;margin-top:3px}.save{width:100%;border:0;border-radius:10px;background:var(--gold);color:#111;padding:12px;font-weight:900;margin-top:14px}.msg{padding:10px;border-radius:9px;background:#12301f;color:#b8f7cd;display:none;margin:12px}.msg.show{display:block}select{background:#0c0c0c;color:#fff;border:1px solid #444;border-radius:8px;padding:8px}</style></head><body><div class="app"><header class="top"><a href="/">‹</a><div class="brand">Bhavishya Gyani</div></header><div class="tabs"><button data-tab="preferences">पसंद</button><button data-tab="notifications">नोटिफिकेशन</button><button data-tab="language">भाषा</button></div><div id="out" class="card"></div><div id="msg" class="msg"></div></div><script>const $=s=>document.querySelector(s),tab=new URLSearchParams(location.search).get('tab')||'preferences';document.querySelectorAll('.tabs button').forEach(b=>{if(b.dataset.tab===tab)b.classList.add('active');b.onclick=()=>location.href='/settings.html?tab='+b.dataset.tab});const key='bgSettings';let data={preferences:true,notifications:true,language:'hi'};try{data={...data,...JSON.parse(localStorage.getItem(key)||'{}')}}catch(e){}function save(){localStorage.setItem(key,JSON.stringify(data));$('#msg').textContent='Settings saved';$('#msg').classList.add('show');setTimeout(()=>$('#msg').classList.remove('show'),1800)}function render(){if(tab==='language'){$('#out').innerHTML='<h2>भाषा बदलें</h2><div class="row"><div>App Language<small>भाषा चुनें</small></div><select id="lang"><option value="hi">हिन्दी</option><option value="en">English</option></select></div><button class="save" id="save">Save</button>';$('#lang').value=data.language;$('#lang').onchange=e=>data.language=e.target.value;$('#save').onclick=save}else if(tab==='notifications'){$('#out').innerHTML='<h2>नोटिफिकेशन सेटिंग</h2><div class="row"><div>Chat requests<small>नए chat request alerts</small></div><input id="chat" type="checkbox"></div><div class="row"><div>Astrology updates<small>Daily astrology notifications</small></div><input id="astro" type="checkbox"></div><button class="save" id="save">Save</button>';$('#chat').checked=data.chatNotify!==false;$('#astro').checked=data.astroNotify!==false;$('#save').onclick=()=>{data.chatNotify=$('#chat').checked;data.astroNotify=$('#astro').checked;save()}}else{$('#out').innerHTML='<h2>अपनी पसंद तय करें</h2><div class="row"><div>Daily horoscope<small>Personal astrology content</small></div><input id="hor" type="checkbox"></div><div class="row"><div>Astrology recommendations<small>Relevant astrologer/features</small></div><input id="rec" type="checkbox"></div><button class="save" id="save">Save</button>';$('#hor').checked=data.horoscope!==false;$('#rec').checked=data.recommendations!==false;$('#save').onclick=()=>{data.horoscope=$('#hor').checked;data.recommendations=$('#rec').checked;save()}}}render();</script></body></html>

<!doctype html><html lang="hi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Bhavishya Gyani — Admin Password Setup</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="/supabase-client.js"></script><style>*{box-sizing:border-box}body{margin:0;min-height:100vh;background:#070707;color:#fff;font-family:system-ui,-apple-system,"Noto Sans Devanagari",sans-serif;display:grid;place-items:center;padding:18px}.card{width:min(430px,100%);background:#111;border:1px solid #292929;border-radius:20px;padding:24px;box-shadow:0 20px 60px #000}.logo{text-align:center;font-size:30px;color:#f2bd18}.brand{text-align:center;font-size:24px;font-weight:900}.sub{text-align:center;color:#999;font-size:13px;margin:8px 0 20px}.field{margin:12px 0}.field label{display:block;color:#ddd;font-size:13px;margin-bottom:6px}.field input{width:100%;padding:13px;border-radius:10px;border:1px solid #363636;background:#080808;color:#fff}.btn{width:100%;padding:13px;border:0;border-radius:10px;background:#f2bd18;color:#111;font-weight:900;margin-top:8px}.msg{display:none;padding:11px;border-radius:10px;margin:12px 0;font-size:13px}.msg.show{display:block}.err{background:#3a1111;color:#ffbaba;border:1px solid #692222}.ok{background:#10321f;color:#baf5cf;border:1px solid #236b40}.small{text-align:center;color:#777;font-size:12px;margin-top:14px}a{color:#f2bd18;text-decoration:none}</style></head><body><div class="card"><div class="logo">☀</div><div class="brand">Admin Password Setup</div><div class="sub">यह केवल Supabase Auth के Admin account का password सेट/बदलने के लिए है। Password database में plain text में नहीं रखा जाता।</div><div id="msg" class="msg"></div><form id="f"><div class="field"><label>नया Admin Password</label><input id="p1" type="password" minlength="6" autocomplete="new-password" required placeholder="कम से कम 6 characters"></div><div class="field"><label>पासवर्ड दोबारा लिखें</label><input id="p2" type="password" minlength="6" autocomplete="new-password" required placeholder="Password confirm करें"></div><button class="btn" id="save">Password Save करें</button></form><div class="small"><a href="/admin-login.html">← Admin Login</a></div></div><script>const $=s=>document.querySelector(s);function msg(t,c='err'){const e=$("#msg");e.textContent=t;e.className='msg show '+c}let sb=null;async function client(){if(sb)return sb;const cfg=await fetch('/api/config').then(r=>r.json());if(!cfg.supabaseUrl||!cfg.supabaseAnonKey)throw Error('Supabase configure नहीं है।');if(!window.supabase)throw Error('Supabase client load नहीं हुआ।');sb=window.supabase.createClient(cfg.supabaseUrl,cfg.supabaseAnonKey,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true,flowType:'implicit'}});sb.auth.onAuthStateChange((event,session)=>{if(session?.access_token)localStorage.setItem('studyMantraToken',session.access_token);if(event==='PASSWORD_RECOVERY')msg('Recovery link सत्यापित है। नया Admin password बनाइए।','ok')});return sb}async function ready(){const s=await client();let {data:{session}}=await s.auth.getSession();if(!session){await new Promise(r=>setTimeout(r,1200));({data:{session}}=await s.auth.getSession())}if(!session)throw Error('यह page Admin password reset email के link से ही खोलें। यदि link पुराना है तो नया reset email भेजें।');return s}window.addEventListener('load',async()=>{try{await ready()}catch(e){msg(e.message||'Recovery session नहीं मिली।')}});$('#f').onsubmit=async e=>{e.preventDefault();if($('#p1').value!==$('#p2').value)return msg('दोनों password एक जैसे होने चाहिए।');if($('#p1').value.length<8)return msg('Security के लिए password कम से कम 8 characters का रखें।');$('#save').disabled=true;try{const s=await ready();const {error}=await s.auth.updateUser({password:$('#p1').value});if(error)throw error;msg('Admin password सफलतापूर्वक set हो गया। अब Admin Login करें।','ok');await s.auth.signOut();setTimeout(()=>location.href='/admin-login.html',900)}catch(e){msg(e.message||'Password update failed')}finally{$('#save').disabled=false}};</script></body></html>

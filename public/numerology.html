<!doctype html><html lang="hi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#050505"><title>अंक शास्त्र - Bhavishya Gyani</title><link rel="stylesheet" href="/more-pages.css"><script src="/supabase-client.js"></script></head><body><main class="wrap"><header class="top"><a class="back" href="javascript:history.back()">‹</a><div class="title">अंक शास्त्र</div><a class="home" href="/">होम</a></header><section class="hero"><h1>अंक शास्त्र</h1><p>जन्म तारीख और नाम के आधार पर उपलब्ध numerology calculation देखें.</p></section><div class="card" style="margin:14px"><div class="field"><label>नाम</label><input id="n" placeholder="नाम"></div><div class="field"><label>जन्म तारीख</label><input id="d" type="date"></div><button class="btn gold" id="go">गणना करें</button></div><div id="out" class="result">जन्म विवरण भरें.</div><script>const e=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));document.querySelector('#go').onclick=async()=>{const n=document.querySelector('#n').value.trim(),d=document.querySelector('#d').value,o=document.querySelector('#out');if(!d){o.textContent='जन्म तारीख चुनें।';return}o.textContent='गणना हो रही है…';try{const r=await fetch('/api/numerology',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name:n,dob:d,year:new Date().getFullYear()})});const x=await r.json();if(!r.ok)throw Error(x.error||'Calculation failed');o.innerHTML='<h3>परिणाम</h3><p>जन्मांक: <b>'+e(x.birthNumber)+'</b></p><p>भाग्यांक: <b>'+e(x.lifePath)+'</b></p><p>नामांक: <b>'+e(x.nameNumberChaldean||x.nameNumberPythagorean||'—')+'</b></p><p>Personal Year: <b>'+e(x.personalYear)+'</b></p>'}catch(err){o.textContent=err.message}};</script></main></body></html>

<!doctype html>
<html lang="hi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Bhavishya Gyani - Free Kundli</title>
<link rel="stylesheet" href="/style.css">
<style>
body{margin:0;background:#f5f7fb;color:#172033;font-family:system-ui,sans-serif}
.wrap{max-width:720px;margin:auto;padding:16px}
.card{background:#fff;border:1px solid #e2e7ef;border-radius:16px;padding:18px;margin:14px 0;box-shadow:0 4px 18px #0000000a}
h1{margin-top:0}
label{display:block;font-weight:700;margin:12px 0 6px}
input,select{width:100%;box-sizing:border-box;padding:12px;border:1px solid #ccd3df;border-radius:10px;font-size:16px;background:#fff}
button{border:0;border-radius:10px;padding:12px 16px;cursor:pointer;font-weight:700}
.primary{width:100%;margin-top:16px}
#suggestions{border:1px solid #d9dee8;border-radius:10px;overflow:hidden;margin-top:5px}
.place-item{padding:11px;background:#fff;border-bottom:1px solid #eee;cursor:pointer}
.place-item:last-child{border-bottom:0}
.place-item:hover{background:#f3f6ff}
.muted{color:#667085;font-size:13px}
.selected{margin-top:8px;padding:9px;border-radius:9px;background:#eef7ee;color:#245b2a}
.hidden{display:none}
</style>
</head>
<body>
<main class="wrap">
<div class="card">
<h1>🪐 Free Kundli</h1>
<p class="muted">जन्म की सही जानकारी भरें। जन्म स्थान चुनने पर latitude, longitude और timezone अपने-आप भर जाएंगे।</p>

<form id="kundliForm">
<label for="name">नाम</label>
<input id="name" name="name" required placeholder="अपना नाम">

<label for="gender">लिंग</label>
<select id="gender" name="gender">
<option value="">चुनें</option><option value="male">Male</option><option value="female">Female</option><option value="other">Other</option>
</select>

<label for="dob">जन्म तारीख</label>
<input id="dob" name="dob" type="date" required>

<label for="time">जन्म समय</label>
<input id="time" name="time" type="time" required>

<label for="place">जन्म स्थान</label>
<input id="place" name="place" autocomplete="off" required placeholder="शहर/गाँव खोजें">
<div id="suggestions"></div>
<div id="selected" class="selected hidden"></div>

<input id="latitude" name="latitude" type="hidden">
<input id="longitude" name="longitude" type="hidden">
<input id="timezone" name="timezone" type="hidden">

<button class="primary" type="submit">✨ Generate Free Kundli</button>
</form>
</div>
<div class="card muted">
<b>नोट:</b> Kundli calculation आपके चुने हुए birth place के coordinates के आधार पर होगी।
</div>
</main>
<script>
const form=document.getElementById("kundliForm");
const place=document.getElementById("place");
const suggestions=document.getElementById("suggestions");
const selected=document.getElementById("selected");
let timer=null;

function esc(s){return String(s||"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}

async function searchPlaces(q){
  if(q.trim().length<2){suggestions.innerHTML="";return}
  try{
    const url="https://geocoding-api.open-meteo.com/v1/search?name="+encodeURIComponent(q.trim())+"&count=8&language=en&format=json";
    const r=await fetch(url); const j=await r.json();
    const results=j.results||[];
    suggestions.innerHTML=results.map((x,i)=>
      `<div class="place-item" data-i="${i}"><b>${esc(x.name)}</b>${x.admin1?", "+esc(x.admin1):""}${x.country?", "+esc(x.country):""}<br><span class="muted">${Number(x.latitude).toFixed(5)}, ${Number(x.longitude).toFixed(5)}</span></div>`
    ).join("");
    suggestions.querySelectorAll(".place-item").forEach((el,i)=>{
      el.onclick=()=>selectPlace(results[i]);
    });
  }catch(e){
    suggestions.innerHTML='<div class="place-item">Place search temporarily unavailable. Please try again.</div>';
  }
}
function selectPlace(x){
  place.value=[x.name,x.admin1,x.country].filter(Boolean).join(", ");
  document.getElementById("latitude").value=Number(x.latitude);
  document.getElementById("longitude").value=Number(x.longitude);
  document.getElementById("timezone").value=5.5;
  if(x.timezone){
    // India is normally +5.5; preserve provider value for other locations.
    const m=String(x.timezone).match(/([+-])(\d{2}):?(\d{2})?/);
    if(m) document.getElementById("timezone").value=(m[1]=="-"?-1:1)*(Number(m[2])+(Number(m[3]||0)/60));
  }
  selected.textContent=`स्थान चुना गया: ${place.value} · Lat ${Number(x.latitude).toFixed(5)} · Lng ${Number(x.longitude).toFixed(5)}`;
  selected.classList.remove("hidden");
  suggestions.innerHTML="";
}
place.addEventListener("input",()=>{
  clearTimeout(timer); timer=setTimeout(()=>searchPlaces(place.value),350);
});
document.addEventListener("click",e=>{
  if(!e.target.closest("#place") && !e.target.closest("#suggestions")) suggestions.innerHTML="";
});

form.addEventListener("submit",async e=>{
  e.preventDefault();
  if(!document.getElementById("latitude").value || !document.getElementById("longitude").value){
    alert("कृपया जन्म स्थान की सूची में से कोई स्थान चुनें।");
    return;
  }
  const body=Object.fromEntries(new FormData(form).entries());
  body.latitude=Number(body.latitude);
  body.longitude=Number(body.longitude);
  body.timezone=Number(body.timezone||5.5);
  const btn=form.querySelector("button[type=submit]"); btn.disabled=true; btn.textContent="Calculating…";
  try{
    const token=localStorage.getItem("studyMantraToken");
    const r=await fetch("/api/kundli",{method:"POST",headers:{"Content-Type":"application/json",...(token?{Authorization:"Bearer "+token}:{})},body:JSON.stringify(body)});
    const j=await r.json();
    if(!r.ok) throw new Error(j.error||"Kundli calculation failed");
    localStorage.setItem("studyMantraLastKundli",JSON.stringify(j));
    location.href="/kundli.html";
  }catch(err){alert(err.message)}
  finally{btn.disabled=false;btn.textContent="✨ Generate Free Kundli"}
});
</script>
</body>
</html>

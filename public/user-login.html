<!doctype html><html lang="hi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>User Login — Bhavishya Gyani</title></head><body style="background:#070707;color:#fff;font-family:system-ui;padding:25px"><main style="max-width:440px;margin:auto;background:#151515;padding:22px;border-radius:18px"><h1>User Login</h1><p>केवल User account. Same email का Astrologer/Admin account अलग login से चल सकता है।</p><div id="m"></div><form id="f"><p>Email<br><input id="e" type="email" required style="width:100%;padding:12px"></p><p>Password<br><input id="p" type="password" minlength="6" required style="width:100%;padding:12px"></p><button style="width:100%;padding:13px">Login</button></form><p><a href="/user-register.html">New User Registration</a></p></main><script src="/supabase-client.js"></script><script>const $=s=>document.querySelector(s);$('#f').onsubmit=async e=>{e.preventDefault();try{const r=await fetch('/api/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({account_type:'user',email:$('#e').value.trim(),password:$('#p').value})});const j=await r.json();if(!r.ok)throw Error(j.error);SM_SUPABASE._saveToken(j.token,'user');location.href='/dashboard.html'}catch(x){$('#m').textContent=x.message}}</script></body></html>

<!doctype html>
<html lang="hi">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#050505"><title>पूजा बुकिंग — Bhavishya Gyani</title>
<script src="/supabase-client.js"></script><script src="/auth-guard.js"></script><script>BG_AUTH.check("user");</script>
<style>
:root{--bg:#070707;--card:#151515;--line:#2c2c2c;--gold:#ffc400;--muted:#aaa;--green:#31c56b;--red:#e95858}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:#fff;font-family:system-ui,-apple-system,"Noto Sans Devanagari",sans-serif}.app{max-width:900px;margin:auto;min-height:100vh;padding-bottom:30px}.top{height:66px;display:flex;align-items:center;gap:12px;padding:0 14px;background:#090909;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:10}.back{border:0;background:none;color:#fff;font-size:30px;cursor:pointer}.title{font-size:20px;font-weight:900;flex:1}.refresh{border:1px solid #555;background:#1d1d1d;color:#fff;border-radius:9px;padding:8px 10px;font-weight:800}.intro{margin:14px;border:1px solid #40380f;background:linear-gradient(120deg,#1b1705,#111);border-radius:16px;padding:16px}.intro h2{margin:0 0 5px;font-size:21px}.intro p{margin:0;color:#c8c8c8;font-size:12px;line-height:1.5}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px;padding:0 14px}.card{background:var(--card);border:1px solid var(--line);border-radius:16px;overflow:hidden}.pic{width:100%;height:155px;object-fit:cover;background:#202020;display:grid;place-items:center;font-size:52px}.body{padding:13px}.body h3{margin:0 0 5px;font-size:18px}.astro{color:#bbb;font-size:12px}.desc{color:#aaa;font-size:12px;line-height:1.45;min-height:35px;margin:8px 0}.price{font-size:18px;font-weight:900;color:var(--gold);margin:7px 0 10px}.book{width:100%;border:0;border-radius:10px;background:var(--gold);color:#111;padding:11px;font-weight:900;cursor:pointer}.book:disabled{opacity:.5}.empty{text-align:center;color:#aaa;padding:45px 20px}.modal{position:fixed;inset:0;background:#000c;display:none;align-items:center;justify-content:center;padding:14px;z-index:50}.modal.open{display:flex}.box{width:min(500px,100%);max-height:92vh;overflow:auto;background:#171717;border:1px solid #444;border-radius:18px;padding:18px}.box h2{margin:0 0 4px}.muted{color:#aaa;font-size:12px}.field{margin-top:11px}.field label{display:block;color:#ddd;font-size:12px;margin-bottom:5px}.field input,.field textarea{width:100%;padding:11px;border-radius:10px;border:1px solid #444;background:#090909;color:#fff}.field textarea{min-height:85px;resize:vertical}.actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:14px}.actions button{border:0;border-radius:10px;padding:11px;font-weight:900}.cancel{background:#333;color:#fff}.submit{background:var(--gold);color:#111}.msg{min-height:19px;margin-top:8px;font-size:12px}.bookings{display:none;margin-top:14px}.booking{border:1px solid #333;border-radius:12px;padding:11px;margin:8px 0;background:#111}.booking b{display:block}.status{display:inline-block;margin-top:6px;padding:4px 8px;border-radius:99px;background:#3b3210;color:#ffe16b;font-size:10px}.status.confirmed,.status.completed{background:#123b24;color:#8ff2b0}.status.rejected,.status.cancelled{background:#421919;color:#ffaaa0}.history-btn{margin:18px 14px 0;width:calc(100% - 28px);border:1px solid #555;background:#202020;color:#fff;border-radius:11px;padding:11px;font-weight:900}
</style></head>
<body><div class="app">
<header class="top"><button class="back" onclick="history.back()">‹</button><div class="title">🪔 पूजा</div><button class="refresh" onclick="loadPoojas()">↻</button></header>
<section class="intro"><h2>पूजा बुक करें</h2><p>Astrologer द्वारा उपलब्ध पूजा सेवाएँ यहाँ दिखाई जाएँगी। पूजा चुनकर अपनी पसंद की तारीख और समय भेजें।</p></section>
<main id="list" class="grid"><div class="empty">Pooja loading…</div></main>
<button class="history-btn" onclick="loadBookings()">📋 मेरी Pooja Bookings देखें</button>
</div>
<div id="modal" class="modal"><div class="box"><h2 id="mTitle">Pooja Booking</h2><div id="mSub" class="muted"></div><form id="form"><div class="field"><label>Preferred Date</label><input id="date" type="date" required></div><div class="field"><label>Preferred Time</label><input id="time" type="time" required></div><div class="field"><label>Notes / विशेष आवश्यकता</label><textarea id="note" placeholder="कोई विशेष जानकारी हो तो लिखें"></textarea></div><div id="msg" class="msg"></div><div class="actions"><button type="button" class="cancel" onclick="closeModal()">Cancel</button><button class="submit" type="submit">Booking Request भेजें</button></div></form><div id="bookings" class="bookings"></div></div></div>
<script>
const $=s=>document.querySelector(s), token=()=>localStorage.getItem('bgToken_user');let cache=[],selected=null;
const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
async function api(url,opt={}){opt.headers={...(opt.headers||{}),Authorization:'Bearer '+token()};const r=await fetch(url,opt),j=await r.json().catch(()=>({}));if(!r.ok)throw Error(j.error||'Request failed');return j}
function openModal(p){selected=p;$('#modal').classList.add('open');$('#form').style.display='block';$('#bookings').style.display='none';$('#mTitle').textContent='🪔 '+(p.name||'Pooja');$('#mSub').textContent=(p.astrologer?.full_name||'Astrologer')+' · ₹'+Number(p.price||0).toLocaleString('en-IN');$('#msg').textContent='';const d=new Date();d.setMinutes(d.getMinutes()-d.getTimezoneOffset());$('#date').min=d.toISOString().slice(0,10)}
function closeModal(){$('#modal').classList.remove('open');selected=null}
async function loadPoojas(){try{const x=await api('/api/pooja');cache=x.poojas||[];$('#list').innerHTML=cache.length?cache.map(p=>`<article class="card">${p.image_url?`<img class="pic" src="${esc(p.image_url)}" alt="">`:'<div class="pic">🪔</div>'}<div class="body"><h3>${esc(p.name)}</h3><div class="astro">Astrologer: ${esc(p.astrologer?.full_name||'—')}</div><div class="desc">${esc(p.description||'Pooja service available for booking')}</div><div class="price">₹${Number(p.price||0).toLocaleString('en-IN')}</div><button class="book" onclick="openModal(cache.find(x=>String(x.id)===String('${esc(p.id)}')))" type="button">Book Pooja</button></div></article>`).join(''):'<div class="empty">अभी कोई Pooja उपलब्ध नहीं है।</div>'}catch(e){$('#list').innerHTML='<div class="empty">'+esc(e.message)+'</div>'}}
$('#form').onsubmit=async e=>{e.preventDefault();if(!selected)return;const b=e.submitter;b.disabled=true;$('#msg').style.color='#aaa';$('#msg').textContent='Booking भेजी जा रही है…';try{const x=await api('/api/pooja',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action:'book',poojaId:selected.id,preferredDate:$('#date').value,preferredTime:$('#time').value,notes:$('#note').value.trim()})});$('#msg').style.color='#61df78';$('#msg').textContent='✓ Booking request भेज दी गई';setTimeout(()=>{closeModal();loadBookings()},700)}catch(err){$('#msg').style.color='#ff9c9c';$('#msg').textContent=err.message}finally{b.disabled=false}};
async function loadBookings(){try{const x=await api('/api/pooja?bookings=1'),rows=x.bookings||[];$('#modal').classList.add('open');$('#form').style.display='none';$('#bookings').style.display='block';$('#mTitle').textContent='📋 मेरी Pooja Bookings';$('#mSub').textContent='आपकी booking requests';$('#bookings').innerHTML=rows.length?rows.map(b=>`<div class="booking"><b>🪔 ${esc(b.pooja_name||'Pooja')}</b><div class="muted">${esc(b.preferred_date||'')} · ${esc(String(b.preferred_time||'').slice(0,5))} · ₹${Number(b.amount||0).toLocaleString('en-IN')}</div><span class="status ${esc(b.status)}">${esc(b.status)}</span>${b.notes?`<div class="muted" style="margin-top:7px">${esc(b.notes)}</div>`:''}${b.astrologer_note?`<div class="muted" style="margin-top:7px">Astrologer: ${esc(b.astrologer_note)}</div>`:''}</div>`).join(''):'<div class="empty">अभी कोई booking नहीं है।</div>'}catch(e){alert(e.message)}}
if(!token())location.href='/';loadPoojas();
</script></body></html>

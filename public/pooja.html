<!doctype html>
<html lang="hi">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#050505"><title>पूजा बुक करें • Bhavishya Gyani</title>
<style>
:root{--bg:#050505;--card:#121212;--line:#292929;--gold:#ffc400;--muted:#aaa;--green:#31b768;--red:#e94d58}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:#fff;font-family:system-ui,-apple-system,"Noto Sans Devanagari",sans-serif}.app{max-width:980px;margin:auto;min-height:100vh}.top{height:68px;display:flex;align-items:center;gap:12px;padding:0 15px;border-bottom:1px solid #202020;background:#050505;position:sticky;top:0;z-index:10}.top a,.top button{color:#fff;background:none;border:0;text-decoration:none;font-size:25px;cursor:pointer}.brand{font-size:20px;font-weight:900;flex:1}.wrap{padding:15px}.hero{background:linear-gradient(120deg,#1d1706,#111);border:1px solid #3b3217;border-radius:16px;padding:17px;margin-bottom:15px}.hero h1{margin:0 0 6px;font-size:24px}.hero p{margin:0;color:#bbb;font-size:12px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}.card{background:var(--card);border:1px solid var(--line);border-radius:15px;overflow:hidden}.card img,.placeholder{width:100%;height:145px;object-fit:cover;background:#202020}.placeholder{display:grid;place-items:center;font-size:48px}.body{padding:12px}.body h3{margin:0 0 6px}.desc{font-size:12px;color:#aaa;min-height:35px}.price{font-size:18px;font-weight:900;color:var(--gold);margin:9px 0}.astro{font-size:11px;color:#999}.btn{width:100%;padding:11px;border:0;border-radius:9px;background:var(--gold);color:#111;font-weight:900;cursor:pointer;margin-top:9px}.secondary{background:#292929;color:#fff;border:1px solid #444}.status{display:inline-block;padding:4px 8px;border-radius:99px;font-size:10px;background:#272727;color:#ddd}.status.pending{background:#4a3b00;color:#ffe27a}.status.confirmed{background:#123e26;color:#82efaa}.status.rejected,.status.cancelled{background:#43181b;color:#ffabb0}.status.completed{background:#15334a;color:#8dd1ff}.bookings{margin-top:25px}.booking{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px;margin:8px 0}.booking b{display:block;margin-bottom:5px}.muted{font-size:11px;color:#999}.modal{position:fixed;inset:0;background:#000b;display:none;align-items:center;justify-content:center;padding:15px;z-index:30}.modal.open{display:flex}.box{width:min(470px,100%);background:#171717;border:1px solid #3b3b3b;border-radius:17px;padding:17px}.box h2{margin:0 0 4px}.field{margin:10px 0}.field label{display:block;font-size:12px;color:#ccc;margin-bottom:5px}.field input,.field textarea{width:100%;padding:11px;border:1px solid #3b3b3b;border-radius:9px;background:#090909;color:#fff}.field textarea{min-height:80px;resize:vertical}.actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:13px}.empty{padding:30px 10px;text-align:center;color:#888}.msg{min-height:20px;font-size:12px;margin-top:7px}.spinner{padding:25px;text-align:center;color:#aaa}@media(max-width:520px){.wrap{padding:11px}.grid{grid-template-columns:1fr 1fr;gap:8px}.card img,.placeholder{height:115px}.body{padding:9px}.body h3{font-size:14px}.desc{font-size:10px}.price{font-size:15px}}
</style>
</head>
<body>
<div class="app">
<header class="top"><a href="/" aria-label="Back">‹</a><div class="brand">🪔 पूजा बुकिंग</div><button id="refresh" title="Refresh">↻</button></header>
<main class="wrap">
<section class="hero"><h1>अपनी पूजा बुक करें</h1><p>Astrologer द्वारा उपलब्ध कराई गई पूजा, कीमत और तस्वीर देखें और अपनी पसंद की तारीख/समय के लिए booking request भेजें।</p></section>
<div id="list" class="grid"><div class="spinner">Pooja loading…</div></div>
<section class="bookings"><h2>मेरी Pooja Bookings</h2><div id="bookingList"><div class="spinner">Loading…</div></div></section>
</main>
</div>
<div id="modal" class="modal"><div class="box"><h2 id="title">Pooja Booking</h2><div id="sub" class="muted"></div><form id="form"><div class="field"><label>Preferred Date</label><input id="date" type="date" required></div><div class="field"><label>Preferred Time</label><input id="time" type="time" required></div><div class="field"><label>Notes / विशेष आवश्यकता</label><textarea id="notes" placeholder="कोई विशेष जानकारी हो तो लिखें"></textarea></div><div id="msg" class="msg"></div><div class="actions"><button type="button" class="btn secondary" id="cancel">Cancel</button><button class="btn" type="submit">Booking Request भेजें</button></div></form></div></div>
<script src="/supabase-client.js"></script>
<script>
const $=id=>document.getElementById(id);let me=null,poojas=[],selected=null;
async function token(){const t=await window.SM_SUPABASE.getAccessToken();if(!t)throw Error('Login required');return t}
async function api(url,opt={}){const t=await token();opt.headers={...(opt.headers||{}),Authorization:'Bearer '+t};const r=await fetch(url,opt);const j=await r.json().catch(()=>({}));if(!r.ok)throw Error(j.error||'Request failed');return j}
const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
function open(p){selected=p;$('title').textContent='🪔 '+(p.name||'Pooja');$('sub').textContent=(p.astrologer?.full_name||'Astrologer')+' · ₹'+Number(p.price||0).toLocaleString('en-IN');$('msg').textContent='';const d=new Date();d.setMinutes(d.getMinutes()-d.getTimezoneOffset());$('date').min=d.toISOString().slice(0,10);$('date').value='';$('time').value='';$('notes').value='';$('modal').classList.add('open')}
function close(){$('modal').classList.remove('open')}
async function load(){try{const x=await api('/api/pooja');poojas=x.poojas||[];$('list').innerHTML=poojas.length?poojas.map(p=>`<article class="card">${p.image_url?`<img src="${esc(p.image_url)}" alt="${esc(p.name)}">`:'<div class="placeholder">🪔</div>'}<div class="body"><h3>${esc(p.name)}</h3><div class="desc">${esc(p.description||'Pooja service available')}</div><div class="price">₹${Number(p.price||0).toLocaleString('en-IN')}</div><div class="astro">Astrologer: ${esc(p.astrologer?.full_name||'—')}</div><button class="btn" onclick="open(poojas.find(x=>x.id==='${esc(p.id)}'))">Book Pooja</button></div></article>`).join(''):'<div class="empty">अभी कोई Pooja उपलब्ध नहीं है।</div>';await bookings()}catch(e){$('list').innerHTML='<div class="empty">'+esc(e.message)+'</div>'}}
async function bookings(){try{const x=await api('/api/pooja?bookings=1');const rows=x.bookings||[];$('bookingList').innerHTML=rows.length?rows.map(b=>`<div class="booking"><b>🪔 ${esc(b.pooja?.name||b.pooja_name||'Pooja')}</b><div class="muted">${esc(b.preferred_date||b.booking_date||'')} · ${esc(String(b.preferred_time||b.booking_time||'').slice(0,5))} · ₹${Number(b.amount??b.price??0).toLocaleString('en-IN')}</div><div style="margin-top:7px"><span class="status ${esc(b.status)}">${esc(b.status)}</span></div>${b.notes||b.note?`<div class="muted" style="margin-top:7px">${esc(b.notes||b.note)}</div>`:''}</div>`).join(''):'<div class="empty">अभी कोई booking नहीं है।</div>'}catch(e){$('bookingList').innerHTML='<div class="empty">'+esc(e.message)+'</div>'}}
$('form').onsubmit=async e=>{e.preventDefault();if(!selected)return;try{const x=await api('/api/pooja',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action:'book',poojaId:selected.id,preferredDate:$('date').value,preferredTime:$('time').value,notes:$('notes').value.trim()})});$('msg').style.color='#61df78';$('msg').textContent='✓ Booking request भेज दी गई।';await bookings();setTimeout(close,700)}catch(e){$('msg').style.color='#ff9c9c';$('msg').textContent=e.message}};
$('cancel').onclick=close;$('modal').onclick=e=>{if(e.target===$('modal'))close()};$('refresh').onclick=load;
async function boot(){try{const t=await token();const r=await fetch('/api/me',{headers:{Authorization:'Bearer '+t},cache:'no-store'});const j=await r.json().catch(()=>({}));if(!r.ok)throw Error(j.error||'Session expired');me=j.user;if(me.account_type!=='user')return location.replace(me.account_type==='astrologer'?'/astrologer-dashboard.html':'/admin-panel.html');await load()}catch(e){alert(e.message);location.replace('/')}}boot();
</script>
</body></html>

<!doctype html>
<html lang="hi">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#050505"><title>Bhavishya Gyani — Pooja Booking</title>
<script src="/supabase-client.js"></script>
<style>
:root{--bg:#050505;--card:#111;--card2:#181818;--line:#2d2d2d;--gold:#ffc400;--muted:#aaa;--green:#31b768;--red:#e94d58}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:#fff;font-family:system-ui,-apple-system,"Noto Sans Devanagari",sans-serif;padding-bottom:30px}.app{max-width:980px;margin:auto;min-height:100vh}.top{height:70px;display:flex;align-items:center;gap:14px;padding:0 16px;background:#050505;border-bottom:1px solid #242424;position:sticky;top:0;z-index:20}.back{width:40px;height:40px;border:1px solid #444;border-radius:11px;background:#151515;color:#fff;font-size:25px}.brand{font-size:21px;font-weight:900;flex:1;display:flex;align-items:center;gap:9px}.brand-logo{width:36px;height:36px;border-radius:50%;object-fit:cover;border:1px solid #6b5411}.homebtn{border:1px solid #444;border-radius:10px;padding:8px 11px;color:#fff;text-decoration:none;font-size:12px}.intro{margin:18px 14px 12px;padding:17px;border:1px solid #3b3b3b;border-radius:16px;background:linear-gradient(110deg,#17130a,#111 65%)}.intro h1{margin:0 0 6px;font-size:25px}.intro p{margin:0;color:#bbb;font-size:13px;line-height:1.55}.toolbar{display:flex;gap:8px;padding:0 14px 13px;flex-wrap:wrap}.btn{border:1px solid #444;border-radius:10px;padding:10px 13px;background:#191919;color:#fff;font-weight:800}.btn.gold{background:var(--gold);color:#111;border-color:var(--gold)}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px;padding:0 14px}.card{background:var(--card);border:1px solid #303030;border-radius:16px;overflow:hidden}.pic{width:100%;height:150px;object-fit:cover;background:#202020}.noimg{height:150px;display:grid;place-items:center;background:#202020;font-size:52px}.body{padding:13px}.name{font-size:18px;font-weight:900}.desc{color:#aaa;font-size:12px;line-height:1.5;min-height:36px;margin:6px 0}.astro{font-size:11px;color:#999}.price{font-size:18px;color:var(--gold);font-weight:900;margin-top:8px}.book{width:100%;margin-top:10px;border:0;border-radius:10px;background:var(--gold);color:#111;padding:11px;font-weight:900}.empty{margin:0 14px;padding:30px;text-align:center;color:#aaa;border:1px dashed #444;border-radius:14px}.backdrop{position:fixed;inset:0;background:#000c;display:none;align-items:center;justify-content:center;padding:14px;z-index:100}.backdrop.open{display:flex}.modal{width:min(500px,100%);max-height:92vh;overflow:auto;background:#171717;border:1px solid #444;border-radius:18px;padding:17px}.modal h2{margin:0 0 5px}.muted{color:#aaa;font-size:12px}.field{margin:11px 0}.field label{display:block;color:#ccc;font-size:12px;margin-bottom:5px}.field input,.field textarea{width:100%;padding:11px;border-radius:10px;border:1px solid #414141;background:#0c0c0c;color:#fff}.field textarea{min-height:90px;resize:vertical}.actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:13px}.actions button{border:0;border-radius:10px;padding:11px;font-weight:900}.cancel{background:#333;color:#fff}.submit{background:var(--gold);color:#111}.msg{min-height:18px;margin-top:7px;font-size:12px}.booking{padding:12px;border:1px solid #333;border-radius:12px;background:#111;margin:8px 0}.status{display:inline-block;margin-top:7px;padding:5px 8px;border-radius:99px;background:#303030;font-size:10px;font-weight:900}.status.pending{background:#4d3c00;color:#ffe27a}.status.confirmed,.status.completed{background:#123d22;color:#8ff3aa}.status.rejected,.status.cancelled{background:#4a171c;color:#ffadb2}.small{font-size:11px;color:#aaa;margin-top:5px}
</style></head><body><div class="app">
<header class="top"><button class="back" onclick="history.back()">‹</button><div class="brand"><img class="brand-logo" src="/img/logo.jpeg" alt="Bhavishya Gyani logo"><span>🪔 Pooja Booking</span></div><a class="homebtn" href="/">Home</a></header>
<section class="intro"><h1>पूजा बुक करें</h1><p>Astrologer द्वारा उपलब्ध पूजा सेवाएँ देखें, अपनी पसंद की तारीख और समय चुनें और booking request भेजें।</p></section>
<div class="toolbar"><button class="btn gold" onclick="loadPoojas()">↻ पूजा Refresh</button><button class="btn" onclick="loadBookings()">मेरी Bookings</button></div>
<section id="list"><div class="empty">Pooja services loading…</div></section>
</div>
<div class="backdrop" id="bookingModal"><div class="modal"><h2 id="modalTitle">Pooja Booking</h2><div id="modalSub" class="muted"></div><form id="bookingForm"><input type="hidden" id="poojaId"><div class="field"><label>Preferred Date</label><input id="date" type="date" required></div><div class="field"><label>Preferred Time</label><input id="time" type="time" required></div><div class="field"><label>Notes / विशेष आवश्यकता</label><textarea id="notes" placeholder="कोई विशेष जानकारी हो तो लिखें"></textarea></div><div id="msg" class="msg"></div><div class="actions"><button type="button" class="cancel" onclick="closeModal()">Cancel</button><button class="submit" type="submit">Booking Request भेजें</button></div></form></div></div>
<div class="backdrop" id="historyModal"><div class="modal"><h2>मेरी Pooja Bookings</h2><div class="muted">आपकी सभी पूजा booking requests</div><div id="history" style="margin-top:10px"></div><div class="actions"><button type="button" class="cancel" onclick="closeHistory()">Close</button></div></div></div>
<script>
const $=s=>document.querySelector(s), esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
let me=null,cache=[];
async function api(url,opt={}){const t=await window.SM_SUPABASE.getAccessToken();if(!t)throw Error('Login required');const r=await fetch(url,{...opt,headers:{...(opt.headers||{}),Authorization:'Bearer '+t}});const j=await r.json().catch(()=>({}));if(!r.ok)throw Error(j.error||'Request failed');return j}
async function boot(){try{const t=await window.SM_SUPABASE.getAccessToken();if(!t)throw Error('Login required');const x=await api('/api/me');if(x.user?.account_type!=='user'&&x.user?.role!=='user')throw Error('User login required');me=x.user||x;await loadPoojas()}catch(e){$('#list').innerHTML='<div class="empty">'+esc(e.message)+'<br><br><a class="homebtn" href="/">Login / Home</a></div>'}}
async function loadPoojas(){try{const x=await api('/api/pooja');cache=x.poojas||[];$('#list').innerHTML=cache.length?'<div class="grid">'+cache.map(p=>`<article class="card">${p.image_url?`<img class="pic" src="${esc(p.image_url)}" alt="${esc(p.name)}">`:'<div class="noimg">🪔</div>'}<div class="body"><div class="name">${esc(p.name)}</div><div class="desc">${esc(p.description||'Pooja service available for booking')}</div><div class="astro">Astrologer: ${esc(p.astrologer?.full_name||'—')}</div><div class="price">₹${Number(p.price||0).toLocaleString('en-IN')}</div><button class="book" onclick="openBooking('${esc(p.id)}')">Book Pooja</button></div></article>`).join('')+'</div>':'<div class="empty">अभी कोई Pooja उपलब्ध नहीं है।' ;}catch(e){$('#list').innerHTML='<div class="empty">'+esc(e.message)+'</div>'}}
function openBooking(id){const p=cache.find(x=>String(x.id)===String(id));if(!p)return;$('#poojaId').value=p.id;$('#modalTitle').textContent='🪔 '+p.name;$('#modalSub').textContent=(p.astrologer?.full_name||'Astrologer')+' · ₹'+Number(p.price||0).toLocaleString('en-IN');const d=new Date();d.setMinutes(d.getMinutes()-d.getTimezoneOffset());$('#date').min=d.toISOString().slice(0,10);$('#msg').textContent='';$('#bookingModal').classList.add('open')}
function closeModal(){$('#bookingModal').classList.remove('open')}
$('#bookingForm').onsubmit=async e=>{e.preventDefault();try{const x=await api('/api/pooja',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action:'book',poojaId:$('#poojaId').value,preferredDate:$('#date').value,preferredTime:$('#time').value,notes:$('#notes').value.trim()})});$('#msg').style.color='#61df78';$('#msg').textContent='✓ Booking request भेज दी गई।';setTimeout(closeModal,900)}catch(e){$('#msg').style.color='#ff9c9c';$('#msg').textContent=e.message}}
async function loadBookings(){try{const x=await api('/api/pooja?bookings=1');const rows=x.bookings||[];$('#history').innerHTML=rows.length?rows.map(b=>`<div class="booking"><b>🪔 Booking</b><div class="small">${esc(b.preferred_date||'')} · ${esc(String(b.preferred_time||'').slice(0,5))} · ₹${Number(b.amount||0).toLocaleString('en-IN')}</div><span class="status ${esc(b.status)}">${esc(b.status)}</span>${b.notes?`<div class="small">${esc(b.notes)}</div>`:''}</div>`).join(''):'<div class="empty">अभी कोई booking नहीं है।</div>';$('#historyModal').classList.add('open')}catch(e){alert(e.message)}}
function closeHistory(){$('#historyModal').classList.remove('open')}
boot();
</script><script src="/call-global.js"></script></body></html>

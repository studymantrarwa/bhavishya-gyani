<!doctype html><html lang="hi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>पूजा बुक करें — Bhavishya Gyani</title><script src="/supabase-client.js"></script><script src="/auth-guard.js"></script><script>BG_AUTH.check("user");</script><style>
:root{--bg:#0b0d10;--card:#171a1f;--line:#30353d;--text:#fff;--muted:#aeb6c0;--gold:#ffc400;--green:#41d76b;--red:#ff6262}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Noto Sans Devanagari",sans-serif}.app{max-width:760px;margin:auto;min-height:100vh;padding-bottom:30px}.top{position:sticky;top:0;z-index:10;height:60px;background:var(--gold);color:#111;display:flex;align-items:center;gap:12px;padding:0 14px}.top a{color:#111;text-decoration:none;font-size:28px}.top b{font-size:20px}.intro{padding:18px 14px}.intro h1{margin:0 0 5px;font-size:25px}.intro p{margin:0;color:var(--muted);font-size:13px}.tabs{display:flex;gap:8px;padding:0 14px 12px}.tab{border:0;border-radius:10px;padding:10px 14px;background:#272c33;color:#ddd;font-weight:800;cursor:pointer}.tab.active{background:var(--gold);color:#111}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:12px;padding:0 14px}.card{background:var(--card);border:1px solid var(--line);border-radius:16px;overflow:hidden}.photo{width:100%;height:150px;object-fit:cover;background:#20242a}.placeholder{height:150px;display:grid;place-items:center;background:#20242a;font-size:52px}.body{padding:13px}.body h3{margin:0 0 5px;font-size:17px}.muted{color:var(--muted);font-size:12px;line-height:1.5}.price{font-size:19px;font-weight:900;margin:9px 0;color:#ffe27a}.book{width:100%;border:0;border-radius:10px;padding:11px;background:var(--gold);color:#111;font-weight:900;cursor:pointer}.empty{padding:35px 14px;text-align:center;color:var(--muted)}.booking{margin:0 14px 10px;padding:13px;background:var(--card);border:1px solid var(--line);border-radius:14px}.bookingtop{display:flex;justify-content:space-between;gap:8px}.status{font-size:11px;border-radius:99px;padding:5px 8px;background:#3a4048}.status.pending{color:#ffe27a}.status.confirmed{color:#7df2a3}.status.rejected,.status.cancelled{color:#ff9d9d}.status.completed{color:#8fc7ff}.modal{position:fixed;inset:0;background:#000b;display:none;align-items:center;justify-content:center;padding:14px;z-index:30}.modal.open{display:flex}.box{width:min(470px,100%);max-height:92vh;overflow:auto;background:#171a1f;border:1px solid #41464f;border-radius:18px;padding:17px}.box h2{margin:0 0 4px}.field{margin:12px 0}.field label{display:block;font-size:12px;color:#ccc;margin-bottom:5px}.field input,.field textarea{width:100%;padding:11px;border-radius:10px;border:1px solid #41464f;background:#0d1014;color:#fff}.field textarea{min-height:85px;resize:vertical}.actions{display:grid;grid-template-columns:1fr 1fr;gap:8px}.actions button{border:0;border-radius:10px;padding:11px;font-weight:900;cursor:pointer}.cancel{background:#30353c;color:#fff}.submit{background:var(--gold);color:#111}.msg{min-height:20px;font-size:12px;margin:6px 0}.refresh{margin:0 14px 12px;border:1px solid var(--line);background:#20242a;color:#fff;border-radius:10px;padding:9px 12px;font-weight:800}.hidden{display:none!important}@media(max-width:480px){.grid{grid-template-columns:1fr}.photo,.placeholder{height:135px}}
</style></head><body><main class="app"><header class="top"><a href="/">‹</a><b>🪔 पूजा बुकिंग</b></header><section class="intro"><h1>अपनी पूजा बुक करें</h1><p>Astrologers द्वारा उपलब्ध पूजा देखें और अपनी पसंद की तारीख व समय के लिए booking request भेजें।</p></section><div class="tabs"><button id="servicesTab" class="tab active">पूजा सेवाएं</button><button id="bookingsTab" class="tab">मेरी Bookings</button></div><section id="services"><button class="refresh" id="refresh">↻ पूजा सूची Refresh</button><div id="grid" class="grid"><div class="empty">पूजा सेवाएं loading…</div></div></section><section id="bookings" class="hidden"><div id="bookingList"><div class="empty">Bookings loading…</div></div></section></main><div class="modal" id="modal"><form class="box" id="form"><h2 id="title">Pooja Booking</h2><div id="sub" class="muted"></div><input type="hidden" id="poojaId"><div class="field"><label>Preferred Date</label><input id="date" type="date" required></div><div class="field"><label>Preferred Time</label><input id="time" type="time" required></div><div class="field"><label>Notes / विशेष आवश्यकता</label><textarea id="notes" placeholder="कोई विशेष जानकारी हो तो लिखें"></textarea></div><div id="msg" class="msg"></div><div class="actions"><button type="button" class="cancel" id="close">Cancel</button><button type="submit" class="submit">Booking Request भेजें</button></div></form></div><script>
const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));let cache=[];async function api(url,opt={}){const t=await window.SM_SUPABASE.getAccessToken();if(!t)throw Error('Login required');opt.headers={...(opt.headers||{}),Authorization:'Bearer '+t};const r=await fetch(url,opt),j=await r.json().catch(()=>({}));if(!r.ok)throw Error(j.error||'Request failed');return j}
function setMinDate(){const d=new Date();d.setMinutes(d.getMinutes()-d.getTimezoneOffset());$('#date').min=d.toISOString().slice(0,10)}
function openBook(p){$('#poojaId').value=p.id;$('#title').textContent='🪔 '+p.name;$('#sub').textContent=(p.astrologer?.full_name||'Astrologer')+' · ₹'+Number(p.price||0).toLocaleString('en-IN');$('#msg').textContent='';setMinDate();$('#modal').classList.add('open')}
function close(){ $('#modal').classList.remove('open') }
async function loadServices(){try{const x=await api('/api/pooja');cache=x.poojas||[];$('#grid').innerHTML=cache.length?cache.map(p=>`<article class="card">${p.image_url?`<img class="photo" src="${esc(p.image_url)}" alt="">`:'<div class="placeholder">🪔</div>'}<div class="body"><h3>${esc(p.name)}</h3><div class="muted">${esc(p.astrologer?.full_name||'Astrologer')}</div><div class="muted">${esc(p.description||'Pooja service available for booking')}</div><div class="price">₹${Number(p.price||0).toLocaleString('en-IN')}</div><button class="book" onclick="openBook(cache.find(x=>String(x.id)===String('${esc(p.id)}')))" type="button">Book Pooja</button></div></article>`).join(''):'<div class="empty">अभी कोई पूजा उपलब्ध नहीं है।</div>'}catch(e){$('#grid').innerHTML='<div class="empty">'+esc(e.message)+'</div>'}}
async function loadBookings(){try{const x=await api('/api/pooja?bookings=1');const rows=x.bookings||[];$('#bookingList').innerHTML=rows.length?rows.map(b=>`<article class="booking"><div class="bookingtop"><b>🪔 ${esc(b.pooja_name||'Pooja')}</b><span class="status ${esc(b.status)}">${esc(b.status)}</span></div><div class="muted" style="margin-top:6px">${esc(b.preferred_date||'')} · ${esc(String(b.preferred_time||'').slice(0,5))} · ₹${Number(b.amount||b.price||0).toLocaleString('en-IN')}</div>${b.notes?`<div class="muted" style="margin-top:6px">${esc(b.notes)}</div>`:''}${b.astrologer_note?`<div class="muted" style="margin-top:6px">Astrologer: ${esc(b.astrologer_note)}</div>`:''}</article>`).join(''):'<div class="empty">अभी कोई booking नहीं है।</div>'}catch(e){$('#bookingList').innerHTML='<div class="empty">'+esc(e.message)+'</div>'}}
$('#form').onsubmit=async e=>{e.preventDefault();try{const x=await api('/api/pooja',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action:'book',poojaId:$('#poojaId').value,preferredDate:$('#date').value,preferredTime:$('#time').value,notes:$('#notes').value.trim()})});$('#msg').style.color='#61df78';$('#msg').textContent='✓ Booking request भेज दी गई।';setTimeout(()=>{close();loadBookings()},900)}catch(e){$('#msg').style.color='#ff9c9c';$('#msg').textContent=e.message}};
$('#close').onclick=close;$('#modal').onclick=e=>{if(e.target.id==='modal')close()};$('#refresh').onclick=loadServices;$('#servicesTab').onclick=()=>{document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));$('#servicesTab').classList.add('active');$('#services').classList.remove('hidden');$('#bookings').classList.add('hidden');loadServices()};$('#bookingsTab').onclick=()=>{document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));$('#bookingsTab').classList.add('active');$('#services').classList.add('hidden');$('#bookings').classList.remove('hidden');loadBookings()};loadServices();
</script></body></html>

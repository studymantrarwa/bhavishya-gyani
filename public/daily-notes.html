<!doctype html><html lang="hi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#050505"><title>दैनिक नोट्स - Bhavishya Gyani</title><link rel="stylesheet" href="/more-pages.css"><script src="/supabase-client.js"></script></head><body><main class="wrap"><header class="top"><a class="back" href="javascript:history.back()">‹</a><div class="title">दैनिक नोट्स</div><a class="home" href="/">होम</a></header><section class="hero"><h1>दैनिक नोट्स</h1><p>अपने ज्योतिषीय अध्ययन, उपाय या रोज़ के महत्वपूर्ण नोट्स इसी डिवाइस पर सुरक्षित रखें.</p></section><div class="card" style="margin:14px"><div class="field"><label>आज का नोट</label><textarea id="note" rows="9" placeholder="आज क्या लिखना है?"></textarea></div><div class="actions"><button class="btn gold" id="save">सेव करें</button><button class="btn" id="clear">साफ करें</button></div><p id="msg" class="note"></p></div><script>const n=document.querySelector('#note'),m=document.querySelector('#msg');n.value=localStorage.getItem('bgDailyNote')||'';document.querySelector('#save').onclick=()=>{localStorage.setItem('bgDailyNote',n.value);m.textContent='✓ नोट इसी डिवाइस में सेव हो गया।'};document.querySelector('#clear').onclick=()=>{n.value='';localStorage.removeItem('bgDailyNote');m.textContent='नोट साफ कर दिया गया।'};</script></main></body></html>

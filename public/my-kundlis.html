<!doctype html><html lang="hi"><head><script src="/auth-guard.js"></script><script>BG_AUTH.check("user");</script><script src="/supabase-client.js"></script><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Bhavishya Gyani — My Kundlis</title><style>:root{--gold:#ffc400;--bg:#090a0b;--card:#17181b;--line:#303136;--muted:#aaa}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:#fff;font-family:system-ui,-apple-system,"Noto Sans Devanagari",sans-serif}.app{max-width:720px;margin:auto}.top{height:62px;background:var(--gold);color:#111;display:flex;align-items:center;padding:0 15px;gap:12px}.top a{font-size:27px;color:#111;text-decoration:none}.brand{font-size:20px;font-weight:900}.card{margin:12px;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:15px}.row{display:flex;align-items:center;justify-content:space-between;gap:10px;border-bottom:1px solid #292929;padding:12px 0}.row:last-child{border-bottom:0}.muted{color:var(--muted);font-size:12px}.btn{border:0;border-radius:9px;padding:9px 11px;background:var(--gold);color:#111;font-weight:900}.empty{text-align:center;color:#999;padding:25px}</style></head><body><div class="app"><header class="top"><a href="/">‹</a><div class="brand">अपनी कुंडली चुनें</div></header><div id="list" class="card">Loading…</div></div><script>const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));async function run(){try{const t=await window.SM_SUPABASE.getAccessToken();const r=await fetch('/api/my-kundlis',{headers:{Authorization:'Bearer '+t}}),j=await r.json();if(!r.ok)throw Error(j.error||'Load failed');const rows=j.kundlis||[];$('#list').innerHTML=rows.length?rows.map((k,i)=>`<div class="row"><div><b>${esc(k.name||'Kundli')}</b><div class="muted">${esc(k.dob)} ${esc(k.birth_time)} · ${esc(k.place)}</div></div><button class="btn" data-i="${i}">Download</button></div>`).join(''):'<div class="empty">अभी कोई saved Kundli नहीं है। पहले Free Kundli बनाएं।</div>';rows.forEach((k,i)=>{const b=document.querySelector(`[data-i="${i}"]`);b&&b.addEventListener('click',()=>{let d=k.calculation_data||{};if(typeof d==='string'){try{d=JSON.parse(d)}catch(e){d={}}}localStorage.setItem('studyMantraLastKundli',JSON.stringify(d));location.href='/pdf-kundli.html'})})}catch(e){$('#list').innerHTML='<div class="empty">'+esc(e.message)+'</div>'}}run();</script><script src="/astrologer-global-chat.js"></script></body></html>

<!doctype html><html lang="hi"><head><script src="/auth-guard.js"></script><script>BG_AUTH.check("user");</script><script src="/supabase-client.js"></script><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Bhavishya Gyani — Feedback</title><style>:root{--gold:#ffc400;--bg:#090a0b;--card:#17181b;--line:#303136}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:#fff;font-family:system-ui,-apple-system,"Noto Sans Devanagari",sans-serif}.app{max-width:620px;margin:auto}.top{height:62px;background:var(--gold);color:#111;display:flex;align-items:center;padding:0 15px;gap:12px}.top a{font-size:27px;color:#111;text-decoration:none}.brand{font-size:20px;font-weight:900}.card{margin:14px;background:var(--card);border:1px solid var(--line);border-radius:17px;padding:18px}.stars{display:flex;gap:8px;margin:12px 0}.star{font-size:31px;background:none;border:0;color:#555}.star.on{color:var(--gold)}textarea{width:100%;min-height:120px;resize:vertical;background:#0d0d0d;color:#fff;border:1px solid #444;border-radius:10px;padding:12px}.btn{width:100%;padding:12px;border:0;border-radius:10px;background:var(--gold);font-weight:900;margin-top:10px}.msg{display:none;padding:10px;border-radius:9px;margin-top:10px}.show{display:block}.ok{background:#10321f;color:#baf5cf}.err{background:#3a1111;color:#ffbaba}</style></head><body><div class="app"><header class="top"><a href="/">‹</a><div class="brand">सुझाव और रेटिंग</div></header><div class="card"><h2 id="rate">ऐप को रेट करें</h2><div class="stars"><button class="star" data-r="1">★</button><button class="star" data-r="2">★</button><button class="star" data-r="3">★</button><button class="star" data-r="4">★</button><button class="star" data-r="5">★</button></div><textarea id="text" placeholder="अपना सुझाव लिखें"></textarea><button id="send" class="btn">Submit</button><div id="msg" class="msg"></div></div></div><script>const $=s=>document.querySelector(s);let rating=0;document.querySelectorAll('.star').forEach(b=>b.onclick=()=>{rating=Number(b.dataset.r);document.querySelectorAll('.star').forEach(x=>x.classList.toggle('on',Number(x.dataset.r)<=rating))});function show(t,ok=false){$('#msg').textContent=t;$('#msg').className='msg show '+(ok?'ok':'err')}$('#send').onclick=async()=>{try{const t=await window.SM_SUPABASE.getAccessToken();const r=await fetch('/api/feedback',{method:'POST',headers:{Authorization:'Bearer '+t,'Content-Type':'application/json'},body:JSON.stringify({rating,text:$('#text').value.trim()})});const j=await r.json();if(!r.ok)throw Error(j.error||'Submit failed');show('धन्यवाद! आपका feedback saved है।','ok');$('#text').value=''}catch(e){show(e.message)}};</script><script src="/astrologer-global-chat.js"></script></body></html>

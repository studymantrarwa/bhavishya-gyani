<!doctype html><html lang="hi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Bhavishya Gyani — Wallet</title><script src="/supabase-client.js"></script><script src="https://checkout.razorpay.com/v1/checkout.js"></script><style>
:root{--bg:#050505;--card:#111;--line:#292929;--gold:#ffc400;--muted:#aaa;--green:#31c56b;--red:#ef5964}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:#fff;font-family:system-ui,-apple-system,"Noto Sans Devanagari",sans-serif}.app{max-width:720px;margin:auto;min-height:100vh;padding-bottom:30px}.top{height:68px;display:flex;align-items:center;gap:12px;padding:0 16px;border-bottom:1px solid #242424;position:sticky;top:0;background:#050505;z-index:3}.back{font-size:29px;color:#fff;text-decoration:none}.brand{font-weight:900;font-size:21px;flex:1}.card{margin:14px;border:1px solid var(--line);background:var(--card);border-radius:18px;padding:18px}.balance{font-size:38px;font-weight:950;color:var(--gold);margin-top:5px}.muted{color:var(--muted);font-size:12px}.field{margin:12px 0}.field label{display:block;font-size:12px;color:#ccc;margin-bottom:6px}.field input{width:100%;padding:13px;border-radius:10px;border:1px solid #444;background:#090909;color:#fff}.btn{border:0;border-radius:10px;padding:12px 15px;font-weight:900;cursor:pointer;background:var(--gold);color:#111}.btn:disabled{opacity:.6}.tx{display:flex;justify-content:space-between;gap:12px;padding:12px 0;border-bottom:1px solid #282828}.tx:last-child{border-bottom:0}.credit{color:#58dc84}.debit{color:#ff858c}.status{font-size:11px;padding:4px 8px;border-radius:99px;background:#292929;color:#ddd}.ok{background:#143c22;color:#78e79a}.pending{background:#493d10;color:#ffdf70}.failed{background:#4a171b;color:#ff8b93}.empty{text-align:center;color:#888;padding:22px}
</style></head><body><main class="app"><header class="top"><a class="back" href="/">‹</a><div class="brand">My Wallet</div><button class="btn" onclick="load()">↻</button></header><section class="card"><div class="muted">Available Wallet Balance</div><div id="balance" class="balance">₹0.00</div><div id="freeMinutes" style="margin-top:8px;font-weight:700;color:#8fd3ff">Free Chat Minutes: 0</div><div class="muted" style="margin-top:4px">Astrologer chat charges wallet से कटेंगे।</div><div id="rechargeOffer" style="display:none;margin-top:10px;padding:10px;border-radius:10px;background:#123d2a;color:#8ff0bd;font-weight:700"></div><div class="field"><label>Recharge Amount (₹)</label><input id="amount" type="number" min="10" max="200000" value="500" placeholder="500"></div><button id="pay" class="btn" onclick="topup()">Wallet Recharge करें</button></section><section class="card"><h3 style="margin-top:0">Payment History</h3><div id="payments"><div class="empty">Loading…</div></div></section><section class="card"><h3 style="margin-top:0">Wallet Transactions</h3><div id="tx"><div class="empty">Loading…</div></div></section></main><script>
const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
async function api(url,opt={}){const t=await window.SM_SUPABASE.getAccessToken();if(!t)throw Error('Login required');opt.headers={...(opt.headers||{}),Authorization:'Bearer '+t};const r=await fetch(url,opt),j=await r.json().catch(()=>({}));if(!r.ok)throw Error(j.error||'Request failed');return j}
function money(n){return '₹'+Number(n||0).toLocaleString('en-IN',{minimumFractionDigits:2,maximumFractionDigits:2})}
async function load(){try{const [w,p]=await Promise.all([api('/api/wallet'),api('/api/payment-gateway')]);$('#balance').textContent=money(w.wallet?.balance);$('#freeMinutes').textContent='Free Chat Minutes: '+Number(w.free_minutes?.free_chat_minutes||0);$('#tx').innerHTML=(w.transactions||[]).map(x=>`<div class="tx"><div><b>${esc(x.description||x.source)}</b><div class="muted">${new Date(x.created_at).toLocaleString('en-IN')}</div></div><b class="${x.type==='credit'?'credit':'debit'}">${x.type==='credit'?'+':'-'}${money(x.amount)}</b></div>`).join('')||'<div class="empty">अभी कोई transaction नहीं।</div>';$('#payments').innerHTML=(p.payments||[]).map(x=>`<div class="tx"><div><b>${esc(x.purpose||'Payment')}</b><div class="muted">${new Date(x.created_at).toLocaleString('en-IN')} · ${esc(x.gateway_payment_id||x.reference||'')}</div></div><div style="text-align:right"><b>${money(x.amount)}</b><div class="status ${x.status==='approved'?'ok':x.status==='pending'?'pending':x.status==='failed'?'failed':''}">${esc(x.status)}</div></div></div>`).join('')||'<div class="empty">अभी कोई payment नहीं।</div>'}catch(e){$('#payments').innerHTML='<div class="empty">'+esc(e.message)+'</div>'}}
async function topup(){const amount=Number($('#amount').value||0);if(amount<10)return alert('कम से कम ₹10 recharge करें।');$('#pay').disabled=true;try{const cfg=await api('/api/payment-gateway?action=config');if(cfg.recharge_offer?.active)$('#rechargeOffer').style.display='block',$('#rechargeOffer').textContent=`🎁 Recharge Offer: ${Number(cfg.recharge_offer.percent||0)}% extra wallet credit मिलेगा`;if(!cfg.configured)throw Error('Razorpay keys are not configured for this deployment. Vercel Environment Variables में RAZORPAY_KEY_ID और RAZORPAY_KEY_SECRET जोड़कर Redeploy करें।');const x=await api('/api/payment-gateway',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action:'create_order',amount,purpose:'wallet_topup'})});if(!x.order?.id||!x.key_id)throw Error('Razorpay order could not be created. Please check the Test keys and redeploy.');const r=new Razorpay({key:x.key_id,amount:x.order.amount,currency:x.order.currency,name:'Bhavishya Gyani',description:'Wallet Recharge',order_id:x.order.id,handler:async response=>{try{await api('/api/payment-gateway',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action:'verify',...response})});alert('Payment सफल। Wallet recharge हो गया।');load()}catch(e){alert(e.message)}finally{$('#pay').disabled=false}},modal:{ondismiss:()=>{$('#pay').disabled=false}}});r.on('payment.failed',async e=>{try{await api('/api/payment-gateway',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action:'fail',razorpay_order_id:x.order.id,razorpay_payment_id:e.error?.metadata?.payment_id||''})})}catch(err){console.warn('Failed-payment status update:',err)}alert(e.error?.description||'Payment failed');$('#pay').disabled=false;load()});r.open()}catch(e){alert(e.message);$('#pay').disabled=false}}
(async()=>{try{const s=await window.SM_SUPABASE.getSession();if(!s)throw Error('Login required');const m=await api('/api/me');if(m.user?.role!=='user')location.replace('/');else load()}catch(e){alert(e.message);location.replace('/')}})();
</script></body></html>

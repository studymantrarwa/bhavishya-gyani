<!doctype html><html lang="hi"><head>
<script id="bg-auth-guard">
(function(){
  var token=null;
  try{token=localStorage.getItem('bhavishyaGyaniToken')||localStorage.getItem('studyMantraToken')}catch(e){}
  if(!token){location.replace('/?next='+encodeURIComponent(location.pathname+location.search));return;}
  fetch('/api/me',{headers:{Authorization:'Bearer '+token},cache:'no-store'}).then(function(r){
    if(!r.ok)throw new Error('unauthorized');
  }).catch(function(){
    try{localStorage.removeItem('bhavishyaGyaniToken');localStorage.removeItem('studyMantraToken')}catch(e){}
    location.replace('/?next='+encodeURIComponent(location.pathname+location.search));
  });
})();
</script><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Astrologer Profile — Bhavishya Gyani</title><style>:root{--gold:#ffc400;--bg:#111214;--card:#25262a;--line:#414248;--muted:#b8b9be;--green:#41cf59;--blue:#1689ff}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:#fff;font-family:system-ui,-apple-system,"Noto Sans Devanagari",sans-serif}.app{max-width:720px;margin:auto;min-height:100vh;padding-bottom:85px}.top{height:62px;background:var(--gold);color:#111;display:flex;align-items:center;padding:0 14px;gap:12px;position:sticky;top:0;z-index:5}.top a{font-size:28px;text-decoration:none;color:#111}.top b{font-size:21px}.hero{padding:22px 16px;background:#1c1d1f;display:flex;gap:16px;align-items:center}.avatar{width:92px;height:92px;border-radius:50%;object-fit:cover;background:#333;border:3px solid #f5df89;display:grid;place-items:center;font-size:34px;font-weight:900}.hero h1{margin:0 0 4px;font-size:25px}.muted{color:var(--muted)}.card{margin:12px;background:var(--card);border:1px solid #303136;border-radius:17px;padding:16px}.tags{display:flex;gap:7px;flex-wrap:wrap}.tag{padding:7px 10px;border-radius:99px;background:#36383e;color:#fff;font-size:12px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.item{padding:12px;border-bottom:1px solid var(--line);line-height:1.55}.item:last-child{border-bottom:0}.label{font-size:12px;color:#aaa}.value{font-size:15px;word-break:break-word}.btn{border:0;border-radius:10px;padding:12px 16px;font-weight:900;cursor:pointer}.btn:disabled{opacity:.45}.green{background:var(--green);color:#101}.blue{background:var(--blue);color:#fff}.bottom{position:fixed;left:0;right:0;bottom:0;background:#292a2e;border-top:1px solid #444;padding:10px 12px;display:grid;grid-template-columns:1fr 1fr;gap:10px;max-width:720px;margin:auto;z-index:10}.empty{text-align:center;padding:30px;color:#aaa}@media(max-width:480px){.grid{grid-template-columns:1fr}.hero{align-items:flex-start}.avatar{width:78px;height:78px;font-size:28px}}</style></head><body><div class="app"><header class="top"><a href="javascript:history.back()">‹</a><b>Astrologer Profile</b></header><section id="profile" class="hero"></section><section id="details" class="card">Loading…</section><div class="bottom"><button id="chat" class="btn green">☁ Chat</button><button id="call" class="btn blue">☎ Call</button></div></div><script>const $=s=>document.querySelector(s),token=()=>localStorage.getItem('studyMantraToken'),id=new URLSearchParams(location.search).get('id');const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));async function api(u,o={}){o.headers={...(o.headers||{}),Authorization:'Bearer '+token()};const r=await fetch(u,o),j=await r.json().catch(()=>({}));if(!r.ok)throw Error(j.error||'Request failed');return j}function av(a){return a.avatar_url?`<img class="avatar" src="${esc(a.avatar_url)}" alt="">`:`<div class="avatar">${esc((a.full_name||'A').slice(0,1))}</div>`}async function run(){if(!token())return location.href='/';if(!id)return $('#details').innerHTML='<div class="empty">Astrologer ID missing.</div>';try{const x=await api('/api/astrologer-profile?id='+encodeURIComponent(id));const a=x.astrologer;if(!a)throw Error('Astrologer not found');$('#profile').innerHTML=`${av(a)}<div><h1>${esc(a.full_name)}</h1><div class="muted">${a.online?'● Online':'○ Offline'} · ⭐ ${esc(a.rating_avg||0)}</div><div class="muted" style="margin-top:4px">₹${esc(a.fee||0)} ${Number(a.discount||0)?'· '+esc(a.discount)+'% OFF':''}</div></div>`;$('#details').innerHTML=`<div class="grid"><div class="item"><div class="label">Experience</div><div class="value">${esc(a.experience_years||0)} years</div></div><div class="item"><div class="label">Consultation Fee</div><div class="value">₹${esc(a.fee||0)}${Number(a.discount||0)?' · '+esc(a.discount)+'% OFF':''}</div></div><div class="item"><div class="label">Education / Qualification</div><div class="value">${esc(a.education||'Not provided')}</div></div></div><div class="item"><div class="label">Speciality</div><div class="tags" style="margin-top:8px">${(a.expertise||[]).map(x=>`<span class="tag">${esc(x)}</span>`).join('')||'—'}</div></div><div class="item"><div class="label">Languages</div><div class="value">${esc((a.languages||[]).join(', ')||'—')}</div></div><div class="item"><div class="label">About</div><div class="value">${esc(a.bio||'Not provided')}</div></div><div class="item"><div class="label">Followers</div><div class="value">${esc(a.followers||0)}</div></div><div class="item"><div class="label">Availability</div><div class="value">Chat: ${a.chat_enabled!==false?'ON':'OFF'} · Call: ${a.call_enabled?'ON':'OFF'}</div></div><div class="item"><div class="label">Ratings & Reviews</div>${(a.reviews||[]).map(r=>`<div style="padding:10px 0;border-bottom:1px solid #414248"><b>⭐ ${esc(r.rating)}/5</b> — ${esc(r.user?.full_name||'User')}<div class="muted" style="margin-top:4px">${esc(r.review||'No written review')}</div></div>`).join('')||'<div class="muted">No reviews yet.</div>'}</div>`;$('#chat').onclick=()=>request('chat');$('#call').onclick=()=>request('call');$('#call').disabled=!(a.online&&a.call_enabled);$('#chat').disabled=!(a.online&&a.chat_enabled!==false)}catch(e){$('#details').innerHTML='<div class="empty">'+esc(e.message)+'</div>'}}async function request(type){try{const x=await api('/api/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action:type,astrologerId:id})});location.href='/chat.html?conversation_id='+encodeURIComponent(x.conversation.id)}catch(e){alert(e.message)}}run();</script></body></html>

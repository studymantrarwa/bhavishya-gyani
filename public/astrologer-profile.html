<!doctype html><html lang="hi"><head>
<script src="/auth-guard.js"></script><script>BG_AUTH.check("user");</script>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Astrologer Profile — Bhavishya Gyani</title>
<style>
:root{--bg:#071314;--card:#102022;--card2:#15292b;--line:#244044;--gold:#f5c84b;--green:#36d67a;--red:#ff4d5d;--muted:#9fb1b3;--white:#f7fbfb}
*{box-sizing:border-box}body{margin:0;background:#061112;color:var(--white);font-family:system-ui,-apple-system,"Noto Sans Devanagari",sans-serif;overflow-x:hidden}.app{max-width:720px;margin:auto;min-height:100vh;padding-bottom:105px}.top{height:64px;display:flex;align-items:center;padding:0 16px;gap:12px;position:sticky;top:0;z-index:20;background:rgba(4,14,15,.82);backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}.top a{font-size:31px;text-decoration:none;color:#fff}.top b{font-size:20px}.hero{position:relative;overflow:hidden;margin:0;padding:34px 18px 24px;text-align:center;background:radial-gradient(circle at 50% 12%,rgba(218,178,69,.14),transparent 31%),linear-gradient(180deg,#0b2527,#071718 78%);border-bottom:1px solid var(--line);isolation:isolate}.hero:before{content:"♈   ♉   ♊   ♋   ♌   ♍   ♎   ♏   ♐   ♑   ♒   ♓";position:absolute;z-index:-1;inset:-28px -90px auto;height:300px;color:rgba(230,195,91,.14);font-size:42px;line-height:88px;letter-spacing:18px;transform:rotate(-9deg);white-space:normal;filter:blur(.2px)}.hero:after{content:"";position:absolute;z-index:-1;left:50%;top:35px;width:430px;height:430px;transform:translateX(-50%);border:1px solid rgba(224,190,87,.15);border-radius:50%;box-shadow:0 0 0 34px rgba(224,190,87,.035),0 0 0 70px rgba(224,190,87,.025);background:repeating-conic-gradient(from 0deg,rgba(224,190,87,.08) 0deg 1deg,transparent 1deg 30deg);opacity:.9}.avatar-box{position:relative;width:142px;height:142px;margin:0 auto 13px}.avatar,.avatar-fallback{width:142px;height:142px;border-radius:50%;object-fit:cover;background:#29383a;border:3px solid var(--gold);display:grid;place-items:center;font-size:46px;font-weight:900}.status-dot{position:absolute;right:2px;bottom:4px;width:31px;height:31px;border-radius:50%;border:4px solid #102022;box-shadow:0 0 0 2px rgba(255,255,255,.12)}.status-dot.online{background:var(--green)}.status-dot.offline{background:var(--red)}.name{margin:0;font-size:30px;font-weight:900}.verified{display:inline-grid;place-items:center;width:21px;height:21px;border-radius:50%;background:#248df3;font-size:13px;vertical-align:middle;margin-left:4px}.status{margin-top:6px;font-weight:800}.status.online{color:var(--green)}.status.offline{color:var(--red)}.rating-main{margin-top:12px;font-size:18px}.rating-main b{font-size:25px}.rating-main b{color:var(--gold)}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:18px 0 0}.stat{background:rgba(22,43,45,.9);border:1px solid var(--line);border-radius:13px;padding:11px 5px}.stat b{display:block;font-size:18px}.stat span{display:block;color:var(--muted);font-size:11px;margin-top:3px}.card{margin:12px;background:var(--card);border:1px solid var(--line);border-radius:17px;padding:16px}.price-card{display:grid;grid-template-columns:1fr auto;align-items:center;gap:14px;background:linear-gradient(180deg,#13282a,#0e2022);padding:17px;border-radius:17px;border:1px solid #28474a}.price-label{color:var(--muted);font-size:12px}.old-price{text-decoration:line-through;color:#819193;font-size:17px;margin-right:7px}.new-price{font-size:27px;font-weight:900;color:var(--gold)}.off{display:inline-block;margin-left:6px;padding:4px 7px;border-radius:7px;background:rgba(54,214,122,.15);color:#72efa1;font-size:11px;font-weight:900}.follow{border:0;min-width:94px;border-radius:11px;padding:11px 14px;background:var(--gold);color:#111;font-weight:900}.follow.following{background:#293a3c;color:#fff;border:1px solid var(--line)}.section-title{font-size:19px;font-weight:900;margin-bottom:12px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:9px}.item{background:var(--card2);border:1px solid var(--line);border-radius:12px;padding:12px}.label{color:var(--muted);font-size:11px}.value{font-size:15px;margin-top:4px}.tags{display:flex;gap:7px;flex-wrap:wrap}.tag{padding:7px 10px;border-radius:99px;background:#20383a;color:#e9f1f1;font-size:12px}.review{border-top:1px solid var(--line);padding:14px 0}.review:first-of-type{border-top:0;padding-top:0}.review-head{display:flex;justify-content:space-between;gap:10px}.review-name{font-weight:800}.stars{color:var(--gold);letter-spacing:1px}.review-date{color:var(--muted);font-size:11px;margin-top:3px}.review-text{margin-top:8px;color:#dbe5e5;line-height:1.5;font-size:14px}.empty{text-align:center;padding:20px;color:var(--muted)}.bottom{position:fixed;left:0;right:0;bottom:0;background:rgba(10,24,25,.96);backdrop-filter:blur(12px);border-top:1px solid var(--line);padding:11px 12px;display:grid;grid-template-columns:1fr 1fr;gap:10px;max-width:720px;margin:auto;z-index:30}.btn{border:0;border-radius:12px;padding:14px 16px;font-weight:900;font-size:15px}.green{background:var(--green);color:#07130c}.blue{background:#258ff2;color:#fff}.btn:disabled{opacity:.4}.muted{color:var(--muted)}@media(max-width:480px){.stats{gap:5px}.stat{padding:9px 3px}.new-price{font-size:23px}.grid{grid-template-columns:1fr}}
</style></head><body><div class="app"><header class="top"><a href="javascript:history.back()">‹</a><b>Astrologer Profile</b></header><section id="profile" class="hero">Loading…</section><section id="price" class="card">Loading price…</section><section id="about" class="card"></section><section id="reviews" class="card"></section><div class="bottom"><button id="chat" class="btn green">💬 Chat</button><button id="call" class="btn blue">☎ Call</button></div></div>
<script>
const $=s=>document.querySelector(s),token=()=>localStorage.getItem('bgToken_user'),id=new URLSearchParams(location.search).get('id');
const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
async function api(u,o={}){o.headers={...(o.headers||{}),Authorization:'Bearer '+token()};const r=await fetch(u,o),j=await r.json().catch(()=>({}));if(!r.ok)throw Error(j.error||'Request failed');return j}
function avatar(a){return a.avatar_url?`<img class="avatar" src="${esc(a.avatar_url)}" alt="${esc(a.full_name)}">`:`<div class="avatar-fallback">${esc((a.full_name||'A').slice(0,1))}</div>`}
function stars(n){const x=Math.max(0,Math.min(5,Math.round(Number(n)||0)));return '★'.repeat(x)+'☆'.repeat(5-x)}
function priceHtml(a){const base=Number(a.base_fee_per_minute??a.fee_per_minute??a.fee??0),d=Math.max(0,Math.min(75,Number(a.discount_percent??a.discount??0))),final=Number(a.effective_fee_per_minute??(base*(1-d/100)));return d?`<div><div class="price-label">Chat Price / Minute</div><div style="margin-top:3px"><span class="old-price">₹${base.toFixed(2)}</span><span class="new-price">₹${final.toFixed(2)}</span><span class="off">${d}% OFF</span></div><div class="muted" style="font-size:11px;margin-top:5px">₹${base.toFixed(2)} → ₹${final.toFixed(2)} / min</div></div>`:`<div><div class="price-label">Chat Price / Minute</div><div class="new-price">₹${final.toFixed(2)}<span style="font-size:13px;font-weight:700;color:var(--muted)"> / min</span></div></div>`}
async function run(){if(!token())return location.href='/';if(!id)return $('#about').innerHTML='<div class="empty">Astrologer ID missing.</div>';try{const x=await api('/api/astrologer-profile?id='+encodeURIComponent(id)),a=x.astrologer,reviews=x.reviews||[];if(!a)throw Error('Astrologer not found');const online=!!a.online;$('#profile').innerHTML=`<div class="avatar-box">${avatar(a)}<span class="status-dot ${online?'online':'offline'}"></span></div><h1 class="name">${esc(a.full_name)} <span class="verified">✓</span></h1><div class="status ${online?'online':'offline'}">${online?'● Online':'● Offline'}</div><div class="rating-main"><b>⭐ ${Number(a.rating_avg||0).toFixed(1)}</b> / 5 <span class="muted">(${Number(a.rating_count||reviews.length)} ratings)</span></div><div class="stats"><div class="stat"><b>${Number(a.followers||0).toLocaleString('en-IN')}</b><span>Followers</span></div><div class="stat"><b>${Number(a.consultations||0).toLocaleString('en-IN')}</b><span>Consultations</span></div><div class="stat"><b>${Number(a.experience_years||0)}+</b><span>Years Exp.</span></div></div>`;
$('#price').innerHTML=`<div class="price-card">${priceHtml(a)}<button id="followBtn" class="follow">Follow</button></div>`;
$('#about').innerHTML=`<div class="section-title">About Astrologer</div><div class="grid"><div class="item"><div class="label">Education</div><div class="value">${esc(a.education||'—')}</div></div><div class="item"><div class="label">Languages</div><div class="value">${esc((a.languages||[]).join(', ')||'—')}</div></div></div><div style="margin-top:10px"><div class="label">Speciality</div><div class="tags" style="margin-top:7px">${(a.expertise||[]).map(v=>`<span class="tag">${esc(v)}</span>`).join('')||'<span class="muted">—</span>'}</div></div><div style="margin-top:12px"><div class="label">About</div><div class="value" style="line-height:1.55">${esc(a.bio||'Not provided')}</div></div>`;
$('#reviews').innerHTML=`<div class="section-title">User Reviews & Ratings <span class="muted" style="font-size:12px">(${reviews.length})</span></div>${reviews.length?reviews.map(r=>`<div class="review"><div class="review-head"><div><div class="review-name">User</div><div class="review-date">${r.created_at?new Date(r.created_at).toLocaleDateString('en-IN'):''}</div></div><div class="stars">${stars(r.rating)}</div></div><div class="review-text">${esc(r.review||'No written review.')}</div></div>`).join(''):'<div class="empty">अभी कोई review नहीं है।</div>'}`;
$('#chat').onclick=()=>request('chat');$('#call').onclick=()=>request('call');$('#call').disabled=!(online&&a.call_enabled);$('#chat').disabled=!(online&&a.chat_enabled!==false);await loadFollow();$('#followBtn').onclick=toggleFollow;
}catch(e){$('#about').innerHTML='<div class="empty">'+esc(e.message)+'</div>'}}
async function loadFollow(){try{const x=await api('/api/follow?astrologerId='+encodeURIComponent(id)),b=$('#followBtn');if(!b)return;b.classList.toggle('following',!!x.following);b.textContent=x.following?'Following':'Follow';const stat=document.querySelector('.stat b');if(stat)stat.textContent=Number(x.followers||0).toLocaleString('en-IN')}catch(e){const b=$('#followBtn');if(b)b.disabled=true}}
async function toggleFollow(){const b=$('#followBtn');if(!b)return;b.disabled=true;try{const following=b.classList.contains('following');const x=await api('/api/follow?astrologerId='+encodeURIComponent(id),{method:following?'DELETE':'POST',headers:{'Content-Type':'application/json'},body:following?undefined:JSON.stringify({astrologerId:id})});b.classList.toggle('following',!!x.following);b.textContent=x.following?'Following':'Follow';const stat=document.querySelector('.stat b');if(stat)stat.textContent=Number(x.followers||0).toLocaleString('en-IN')}catch(e){alert(e.message)}finally{b.disabled=false}}
function showRechargeNotice(e){const msg=String(e?.message||'');if(Number(e?.status)===402||/wallet|recharge|balance|free chat minutes/i.test(msg)){const go=confirm('⚠️ Chat शुरू करने के लिए पर्याप्त balance/free minutes नहीं हैं।\n\nपहले Wallet में Recharge करें, फिर वापस आकर Chat करें।\n\nWallet खोलें?');if(go)location.href='/wallet.html';return true}return false}
async function request(type){try{if(type==='call'){const all=await api('/api/chat');const c=(all.conversations||[]).find(v=>v.channel==='chat'&&v.status==='accepted'&&String(v.astrologer_id)===String(id));if(!c){alert('Call शुरू करने के लिए पहले इस Astrologer के साथ Chat accept/start करें।');return location.href='/chat.html?new=chat&astrologer_id='+encodeURIComponent(id)}const x=await api('/api/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action:'call',sourceConversationId:c.id})});return location.href='/call.html?conversation_id='+encodeURIComponent(x.conversation.id)}const x=await api('/api/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action:'request',astrologerId:id})});location.href='/chat.html?conversation_id='+encodeURIComponent(x.conversation.id)}catch(e){if(!showRechargeNotice(e))alert(e.message)}}
run();
</script><script src="/user-global-chat.js"></script><script src="/astrologer-global-chat.js"></script></body></html>

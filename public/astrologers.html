<!doctype html>
<html lang="hi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#050505">
<title>ज्योतिषी - Bhavishya Gyani</title>
<script src="/supabase-client.js"></script>
<style>
:root{--bg:#050505;--card:#191a1b;--line:#2c2d2f;--gold:#ffc400;--white:#fff;--muted:#bdbdbd;--green:#28c76f;--blue:#2196f3;--red:#e94d58}
*{box-sizing:border-box}html{background:var(--bg)}body{margin:0;background:var(--bg);color:var(--white);font-family:system-ui,-apple-system,BlinkMacSystemFont,"Noto Sans Devanagari",sans-serif;padding-bottom:76px}.page{max-width:980px;margin:auto;min-height:100vh}
.top{height:68px;display:flex;align-items:center;gap:14px;padding:0 14px;background:#050505;position:sticky;top:0;z-index:20;border-bottom:1px solid #151515}.back{font-size:31px;text-decoration:none;color:#fff;line-height:1}.title{font-size:20px;font-weight:900;flex:1}.search{font-size:25px;text-decoration:none;color:#fff}
.chips{display:flex;gap:10px;overflow-x:auto;padding:12px 12px 10px;scrollbar-width:none}.chips::-webkit-scrollbar{display:none}.chip{white-space:nowrap;border:1px solid #8b6c16;color:#eee;background:#111;border-radius:18px;padding:8px 16px;font-weight:800;font-size:13px}.chip.active{background:var(--gold);color:#111;border-color:var(--gold)}
.list{padding:0 9px}.card{background:var(--card);border:1px solid #222;border-radius:15px;margin:8px 0;padding:14px 12px;display:grid;grid-template-columns:94px 1fr;gap:12px;min-height:178px}.avatar-wrap{display:flex;align-items:flex-start;justify-content:center}.avatar{width:82px;height:82px;border-radius:50%;object-fit:cover;background:radial-gradient(circle at 35% 30%,#f4e7bd,#8c7959 52%,#2b2418);border:2px solid #d7c88f;display:grid;place-items:center;color:#fff;font-size:29px;font-weight:900}.info{min-width:0}.name-row{display:flex;align-items:center;gap:5px}.name{font-size:21px;font-weight:900;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.verified{width:18px;height:18px;border-radius:50%;background:#2196f3;color:#fff;display:inline-grid;place-items:center;font-size:12px;font-weight:900;flex:0 0 auto}.rating{margin-left:auto;font-size:13px;color:#ddd;white-space:nowrap}.sub{font-size:14px;color:#ddd;margin-top:3px}.langs{font-size:13px;color:#ddd;margin-top:2px}.meta{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-top:7px;font-size:12px;color:#aaa}.online{color:#5ee889}.offline{color:#aaa}.fee{font-size:17px;font-weight:900;color:#fff;margin-top:8px}.actions{display:flex;justify-content:flex-end;gap:10px;margin-top:10px}.btn{min-width:105px;border:0;border-radius:22px;padding:10px 18px;font-size:15px;font-weight:900;text-decoration:none;text-align:center;cursor:pointer}.chat{background:var(--gold);color:#111}.call{background:#1689ff;color:#fff}.off{background:#3a3a3a;color:#aaa;cursor:not-allowed}.empty,.error{margin:20px 5px;padding:18px;border:1px solid var(--line);border-radius:12px;color:#aaa;text-align:center}.loading{padding:28px;text-align:center;color:#aaa}
.bottom{position:fixed;left:0;right:0;bottom:0;height:72px;background:#050505;border-top:1px solid #282828;display:grid;grid-template-columns:repeat(5,1fr);z-index:30}.bottom a{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;color:#aaa;font-size:11px;text-decoration:none}.bottom a.active{color:#fff}.bi{font-size:24px;line-height:1}
.toast{position:fixed;left:50%;bottom:88px;transform:translateX(-50%);background:#262626;border:1px solid #555;border-radius:12px;padding:11px 14px;z-index:40;display:none;max-width:92%;font-size:13px}.toast.show{display:block}
@media(max-width:600px){.card{grid-template-columns:78px 1fr;padding:12px 10px}.avatar{width:70px;height:70px}.name{font-size:18px}.rating{font-size:12px}.btn{min-width:92px;padding:9px 12px}.actions{gap:7px}}
</style>
</head>
<body>
<div class="page">
<header class="top"><a class="back" href="/">‹</a><div class="title">ज्योतिषी</div><a class="search" href="#" id="searchBtn" aria-label="Search">⌕</a></header>
<div class="chips"><button class="chip active" data-filter="all">सभी</button><button class="chip" data-filter="online">🟢 ऑनलाइन</button><button class="chip" data-filter="vedic">वेदिक</button><button class="chip" data-filter="hindi">हिंदी</button></div>
<main id="list" class="list"><div class="loading">ज्योतिषियों की सूची लोड हो रही है…</div></main>
</div>
<nav class="bottom"><a href="/"><span class="bi">⌂</span><span>होम</span></a><a class="active" href="/astrologers.html"><span class="bi">☀</span><span>ज्योतिषी</span></a><a href="/chat.html"><span class="bi">☁</span><span>चैट</span></a><a href="/kundli-form.html"><span class="bi">✧</span><span>कुंडली</span></a><a href="/tools.html"><span class="bi">☷</span><span>More</span></a></nav>
<div id="toast" class="toast"></div>
<script>
const $=s=>document.querySelector(s);let all=[];let current='all';
const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
async function api(url,opt={}){const t=await window.SM_SUPABASE.getAccessToken();if(!t){location.replace('/');throw Error('Login required')}opt.headers={...(opt.headers||{}),Authorization:'Bearer '+t};const r=await fetch(url,opt);const j=await r.json().catch(()=>({}));if(!r.ok){const e=Error(j.error||'Request failed');e.status=r.status;throw e}return j}
function avatar(a){return a.avatar_url?`<img class="avatar" src="${esc(a.avatar_url)}" alt="">`:`<div class="avatar">${esc((a.full_name||'A').slice(0,1))}</div>`}
function card(a){const online=!!a.online,chat=online&&a.chat_enabled!==false,call=online&&a.call_enabled!==false;const langs=Array.isArray(a.languages)?a.languages.join(', '):(a.languages||'Hindi, English');const expertise=Array.isArray(a.expertise)?a.expertise.join(', '):(a.expertise||'Vedic astrology');const base=Number(a.base_fee_per_minute??a.fee_per_minute??a.fee??0),d=[0,25,50,75].includes(Number(a.discount_percent))?Number(a.discount_percent):0,rate=Number(a.effective_fee_per_minute??(base*(1-d/100)));const price=d?`<span style="text-decoration:line-through;color:#888">₹${esc(base)}</span> <b>₹${esc(rate.toFixed(2))}</b> <small style="color:#7df2a3">${d}% OFF</small>`:`₹${esc(base)}`;return `<article class="card"><div class="avatar-wrap"><a href="/astrologer-profile.html?id=${encodeURIComponent(a.id)}">${avatar(a)}</a></div><div class="info"><div class="name-row"><a class="name" href="/astrologer-profile.html?id=${encodeURIComponent(a.id)}">${esc(a.full_name||'Astrologer')}</a><span class="verified">✓</span><span class="rating">☆ ${esc(Number(a.rating_avg||0).toFixed(1))}(${esc(a.rating_count||a.reviews_count||0)})</span></div><div class="sub">${esc(expertise)}</div><div class="langs">${esc(langs)}</div><div class="meta"><span class="${online?'online':'offline'}">${online?'● Online':'○ Offline'}</span><span>${esc(a.experience_years||0)}+ years</span><span>${Number(a.followers||a.followers_count||0).toLocaleString('en-IN')} Followers</span></div><div class="fee">${price}/मिनट</div><div class="actions"><a class="btn chat ${chat?'':'off'}" href="${chat?`/chat.html?new=chat&astrologer_id=${encodeURIComponent(a.id)}`:'#'}" data-chat-id="${chat?esc(a.id):''}">${chat?'चैट':'चैट बंद'}</a><button class="btn call ${call?'':'off'}" data-call="${esc(a.id)}" ${call?'':'disabled'}>${call?'कॉल':'कॉल बंद'}</button></div></div></article>`}
function render(){let rows=all.filter(a=>{if(current==='online')return !!a.online;if(current==='vedic')return JSON.stringify(a.expertise||'').toLowerCase().includes('vedic')||String(a.specialty||'').toLowerCase().includes('vedic');if(current==='hindi')return JSON.stringify(a.languages||'').toLowerCase().includes('hindi');return true});$('#list').innerHTML=rows.length?rows.map(card).join(''):'<div class="empty">इस फिल्टर में अभी कोई approved ज्योतिषी उपलब्ध नहीं है।</div>';document.querySelectorAll('[data-call]').forEach(b=>b.onclick=()=>startCall(b.dataset.call));document.querySelectorAll('[data-chat-id]').forEach(b=>b.onclick=async e=>{e.preventDefault();const aid=b.dataset.chatId;try{const x=await api('/api/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action:'request',astrologerId:aid})});location.href='/chat.html?conversation_id='+encodeURIComponent(x.conversation.id)}catch(err){if(err.status===402||/wallet|recharge|balance|free chat minutes/i.test(err.message||'')){const go=confirm('⚠️ Chat शुरू करने के लिए पहले Wallet Recharge करें।\n\nWallet खोलें?');if(go)location.href='/wallet.html'}else show(err.message||'Chat शुरू नहीं हो सकी')}})}
async function startCall(id){try{const x=await api('/api/chat');const c=(x.conversations||[]).find(v=>v.channel==='chat'&&v.status==='accepted'&&String(v.astrologer_id)===String(id));if(!c){show('कॉल के लिए पहले इस ज्योतिषी के साथ Chat accept/start करें।');setTimeout(()=>location.href='/chat.html?new=chat&astrologer_id='+encodeURIComponent(id),700);return}const y=await api('/api/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action:'call',sourceConversationId:c.id})});location.href='/call.html?conversation_id='+encodeURIComponent(y.conversation.id)}catch(e){show(e.message||'Call शुरू नहीं हो सकी')}}
function show(t){const x=$('#toast');x.textContent=t;x.classList.add('show');setTimeout(()=>x.classList.remove('show'),2800)}
document.querySelectorAll('.chip').forEach(b=>b.onclick=()=>{document.querySelectorAll('.chip').forEach(x=>x.classList.remove('active'));b.classList.add('active');current=b.dataset.filter;render()});
$('#searchBtn').onclick=e=>{e.preventDefault();const q=prompt('ज्योतिषी का नाम खोजें');if(q===null)return;const n=q.trim().toLowerCase();if(!n){render();return}const old=all;all=old.filter(a=>String(a.full_name||'').toLowerCase().includes(n));render();setTimeout(()=>{all=old},0)};
async function load(){try{const x=await api('/api/astrologers');all=x.astrologers||[];render()}catch(e){$('#list').innerHTML='<div class="error">'+esc(e.message)+'</div>'}}
load();
</script>
<script src="/user-global-chat.js"></script><script src="/astrologer-global-chat.js"></script></body>
</html>

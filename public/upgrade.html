<!doctype html><html lang="hi"><head><script src="/auth-guard.js"></script><script>BG_AUTH.check("user");</script><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Bhavishya Gyani — Plans</title><style>:root{--gold:#ffc400;--bg:#090a0b;--card:#17181b;--line:#303136;--muted:#aaa}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:#fff;font-family:system-ui,-apple-system,"Noto Sans Devanagari",sans-serif}.app{max-width:700px;margin:auto}.top{height:62px;background:var(--gold);color:#111;display:flex;align-items:center;padding:0 15px;gap:12px}.top a{font-size:27px;color:#111;text-decoration:none}.brand{font-size:20px;font-weight:900}.card{margin:12px;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px}.plan{border:1px solid #3b3b3b;border-radius:13px;padding:14px;margin-top:10px}.plan h3{margin:0}.btn{border:0;border-radius:9px;padding:10px 12px;background:var(--gold);color:#111;font-weight:900;margin-top:10px}.row{display:flex;align-items:center;justify-content:space-between;gap:10px}.muted{color:#aaa;font-size:12px}.msg{padding:10px;background:#10321f;color:#baf5cf;border-radius:9px;margin:12px;display:none}.show{display:block}</style></head><body><div class="app"><header class="top"><a href="/">‹</a><div class="brand">प्लान और विज्ञापन</div></header><div class="card"><div class="row"><div><b>विज्ञापन हटायें</b><div class="muted">इस device पर ad-free preference</div></div><input id="ads" type="checkbox"></div></div><div class="card"><h2 style="margin-top:0">प्लान अपग्रेड करें</h2><div class="plan"><h3>Free</h3><div class="muted">Basic astrology features</div><button class="btn" data-plan="Free">Select</button></div><div class="plan"><h3>Premium</h3><div class="muted">Premium preference placeholder; payment integration can be connected later.</div><button class="btn" data-plan="Premium">Select Premium</button></div></div><div id="msg" class="msg"></div></div><script>const $=s=>document.querySelector(s);$('#ads').checked=localStorage.getItem('bgAdsRemoved')==='1';$('#ads').onchange=()=>{localStorage.setItem('bgAdsRemoved',$('#ads').checked?'1':'0');$('#msg').textContent=$('#ads').checked?'Ad-free preference saved':'Ads preference reset';$('#msg').classList.add('show');setTimeout(()=>$('#msg').classList.remove('show'),1600)};document.querySelectorAll('[data-plan]').forEach(b=>b.onclick=()=>{localStorage.setItem('bgPlan',b.dataset.plan);$('#msg').textContent=b.dataset.plan+' plan selected';$('#msg').classList.add('show');setTimeout(()=>$('#msg').classList.remove('show'),1600)})</script><script src="/astrologer-global-chat.js"></script><script src="/user-global-chat.js"></script></body></html>

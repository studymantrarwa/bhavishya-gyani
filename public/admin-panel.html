<!doctype html>
<html lang="en">
<head>
<script src="/auth-guard.js"></script><script>BG_AUTH.check("admin");</script>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Bhavishya Gyani — Admin Control Center</title>
<style>
:root{--bg:#06101f;--panel:#0b1a31;--panel2:#0e2340;--line:#213a5e;--text:#f5f7ff;--muted:#91a4c2;--blue:#3767ff;--purple:#7b3cff;--green:#22c77a;--red:#ff5b67;--amber:#f6b73c;--shadow:0 18px 50px #0007}*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:Inter,system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans Devanagari",sans-serif;background:radial-gradient(circle at 80% 0,#172d61 0,#06101f 38%,#040b15 100%);color:var(--text)}button,input,select{font:inherit}button{cursor:pointer}.app{min-height:100vh;display:grid;grid-template-columns:245px 1fr}.sidebar{position:sticky;top:0;height:100vh;padding:20px 14px;background:linear-gradient(180deg,#08172c,#06101d);border-right:1px solid #18304e;display:flex;flex-direction:column}.brand{display:flex;align-items:center;gap:10px;padding:4px 10px 22px;border-bottom:1px solid #17304f}.logo{width:38px;height:38px;border-radius:12px;background:linear-gradient(135deg,#8c4dff,#315dff);display:grid;place-items:center;font-size:21px;box-shadow:0 0 25px #6248ff66}.brand b{font-size:19px}.brand small{display:block;color:#8194b2;font-size:10px;margin-top:2px}.section-label{color:#6e84a5;font-size:10px;letter-spacing:.12em;text-transform:uppercase;padding:18px 11px 7px}.nav button{width:100%;display:flex;align-items:center;gap:11px;padding:11px 12px;margin:3px 0;border:1px solid transparent;background:transparent;color:#aebed7;border-radius:11px;text-align:left}.nav button:hover,.nav button.active{background:linear-gradient(90deg,#2849bd,#4329a9);color:#fff;border-color:#4867ed66;box-shadow:0 8px 22px #172e9560}.nav .count{margin-left:auto;min-width:21px;height:21px;padding:0 6px;border-radius:99px;background:#5639e9;color:#fff;font-size:11px;display:grid;place-items:center}.sidebar-bottom{margin-top:auto}.logout{width:100%;border:1px solid #3a2731;background:#25131b;color:#ff9ba5;border-radius:11px;padding:10px}.main{min-width:0;padding:22px 26px 35px}.topbar{display:flex;align-items:center;justify-content:space-between;gap:14px;margin-bottom:25px}.eyebrow{color:#8da4c7;font-size:12px}.title{font-size:26px;margin:4px 0}.top-actions{display:flex;align-items:center;gap:10px}.top-icon{width:42px;height:42px;border:1px solid var(--line);background:#0b1a31;color:#dbe7ff;border-radius:12px}.admin-chip{display:flex;align-items:center;gap:9px;border:1px solid var(--line);background:#0b1a31;border-radius:13px;padding:7px 11px}.avatar{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;background:linear-gradient(135deg,#4c6fff,#803fff);font-weight:800}.cards{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:13px}.stat{background:linear-gradient(145deg,#0d2340,#09172b);border:1px solid var(--line);border-radius:15px;padding:17px;box-shadow:var(--shadow);position:relative;overflow:hidden}.stat:after{content:"";position:absolute;width:80px;height:80px;border-radius:50%;right:-25px;top:-25px;background:#3b63ff1c}.stat-head{display:flex;justify-content:space-between;align-items:center;color:#9eb1cf;font-size:12px}.stat-icon{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;background:#2e58d633;color:#75a2ff}.stat strong{display:block;font-size:27px;margin-top:10px}.stat small{color:#7f94b2}.layout{display:grid;grid-template-columns:minmax(0,1fr) 285px;gap:15px;margin-top:15px}.panel{background:linear-gradient(145deg,#0b1c33,#081528);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);overflow:hidden}.panel-head{padding:17px 18px;border-bottom:1px solid #1a3353;display:flex;justify-content:space-between;align-items:center;gap:10px}.panel-head h2{font-size:16px;margin:0}.panel-head p{font-size:11px;color:#8096b7;margin:4px 0 0}.toolbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.input,.select{border:1px solid #294667;background:#08162a;color:#eaf1ff;border-radius:10px;padding:10px 12px;outline:none}.input:focus,.select:focus{border-color:#557cff;box-shadow:0 0 0 3px #557cff22}.input{min-width:240px}.table-wrap{overflow:auto}.table{width:100%;border-collapse:collapse;min-width:850px}.table th{font-size:10px;text-transform:uppercase;letter-spacing:.06em;color:#7890b1;background:#09172a}.table th,.table td{padding:12px 11px;border-bottom:1px solid #17304d;text-align:left;vertical-align:middle}.table td{font-size:12px;color:#d9e4f8}.profile-cell{display:flex;align-items:center;gap:10px;min-width:180px}.photo{width:38px;height:38px;border-radius:50%;object-fit:cover;background:linear-gradient(135deg,#2b56b8,#8d3fff);display:grid;place-items:center;font-weight:800}.name{font-weight:750;color:#fff}.sub{font-size:10px;color:#7187a7;margin-top:3px}.pill{display:inline-flex;align-items:center;gap:5px;padding:5px 9px;border-radius:99px;font-size:10px;font-weight:750}.pending{background:#6a4b0d;color:#ffd36b}.approved{background:#0c5137;color:#62e6aa}.rejected{background:#5a2028;color:#ff9ba5}.btn{border:1px solid #34537b;background:#102440;color:#dce9ff;border-radius:9px;padding:8px 10px;font-size:11px;font-weight:750}.btn:hover{filter:brightness(1.15)}.btn-primary{background:linear-gradient(135deg,#2e6aff,#5934e8);border-color:#6585ff}.btn-ok{background:linear-gradient(135deg,#0fae68,#1bce80);border-color:#35dd9b;color:#03170d}.btn-danger{background:#641f2b;border-color:#a93649;color:#ffdce1}.btn-purple{background:linear-gradient(135deg,#7a3cff,#4d39db);border-color:#9467ff}.quick{padding:15px}.quick .btn{width:100%;margin:5px 0;padding:11px;text-align:left}.activity{padding:7px 16px 16px}.activity-item{display:flex;gap:10px;padding:11px 0;border-bottom:1px solid #17304d}.dot{width:10px;height:10px;border-radius:50%;margin-top:4px;background:#2ed383;box-shadow:0 0 12px #2ed383}.dot.amber{background:#f6b73c;box-shadow:0 0 12px #f6b73c}.dot.red{background:#ff5b67;box-shadow:0 0 12px #ff5b67}.activity b{font-size:11px}.activity small{display:block;color:#7087a8;font-size:9px;margin-top:3px}.hero-card{margin-top:15px;padding:20px;background:linear-gradient(135deg,#111e57,#26104d);border:1px solid #5143b7;border-radius:16px;position:relative;overflow:hidden}.hero-card:after{content:"☼";position:absolute;right:-8px;bottom:-30px;font-size:130px;color:#ffffff12}.hero-card h3{margin:0 0 5px}.hero-card p{color:#9cafe0;font-size:11px;max-width:210px}.empty{text-align:center;padding:35px;color:#7890b0}.toast{position:fixed;right:18px;bottom:18px;z-index:99;max-width:360px;padding:13px 16px;border-radius:12px;background:#0d2340;border:1px solid #385e8e;box-shadow:var(--shadow);display:none}.toast.show{display:block}.toast.ok{border-color:#22c77a}.toast.err{border-color:#ff5b67}.modal{position:fixed;inset:0;background:#0009;display:none;align-items:center;justify-content:center;padding:18px;z-index:50}.modal.open{display:flex}.modal-box{width:min(620px,100%);max-height:90vh;overflow:auto;background:#0a1a30;border:1px solid #2b4d76;border-radius:18px;box-shadow:0 25px 80px #000b}.modal-head{padding:17px;border-bottom:1px solid #1c3555;display:flex;justify-content:space-between}.modal-body{padding:18px}.detail-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.detail{background:#0d223b;border:1px solid #203d5e;border-radius:10px;padding:11px}.detail small{display:block;color:#7187a7;font-size:9px}.detail b{font-size:12px}.mobile-menu{display:none}.hide{display:none!important}@media(max-width:1050px){.cards{grid-template-columns:repeat(2,1fr)}.layout{grid-template-columns:1fr}.side-panel{display:grid;grid-template-columns:1fr 1fr;gap:15px}.hero-card{display:none}}@media(max-width:720px){.app{display:block}.sidebar{position:fixed;z-index:40;left:-270px;width:255px;transition:.2s}.sidebar.open{left:0}.mobile-menu{display:block}.main{padding:14px}.topbar{margin-bottom:18px}.title{font-size:21px}.cards{grid-template-columns:1fr 1fr;gap:9px}.stat{padding:13px}.stat strong{font-size:22px}.input{min-width:160px;width:100%}.panel-head{align-items:flex-start;flex-direction:column}.side-panel{display:block}.top-actions .admin-chip span{display:none}}
</style>
</head>
<body>
<div class="app">
<aside class="sidebar" id="sidebar">
 <div class="brand"><div class="logo">✦</div><div><b>Bhavishya Gyani</b><small>ASTROLOGY • KUNDLI • GUIDANCE</small></div></div>
 <div class="section-label">Manage</div><div class="nav" id="nav"></div>
 <div class="sidebar-bottom"><div class="section-label">System</div><button class="navbtn btn" style="width:100%;margin-bottom:8px" onclick="toast('Settings module is ready for the next configuration step.')">⚙ Settings</button><button class="logout" onclick="logout()">↪ Logout</button></div>
</aside>
<main class="main">
 <div class="topbar"><div><button class="top-icon mobile-menu" onclick="document.getElementById('sidebar')?.classList.toggle('open')">☰</button><div class="eyebrow">Bhavishya Gyani / Admin</div><div class="title" id="title">Dashboard</div><div class="eyebrow" id="status">Protected admin control center</div></div><div class="top-actions"><button class="top-icon" onclick="show(page)">↻</button><div class="admin-chip"><div class="avatar">A</div><span id="identity">Admin</span></div></div></div>
 <div id="content"></div>
</main></div>
<div class="toast" id="toast"></div>
<div class="modal" id="modal"><div class="modal-box"><div class="modal-head"><b id="modalTitle">Details</b><button class="btn" onclick="closeModal()">✕</button></div><div class="modal-body" id="modalBody"></div></div></div>
<script>
const $=s=>document.querySelector(s),token=()=>localStorage.getItem('bgToken_admin');let page='overview',cache={applications:[]};
const nav=[['overview','⌂','Dashboard'],['applications','♙','Astrologer Approval'],['astrologers','★','Astrologers'],['users','♙','Users'],['offers','🎁','Offers'],['payments','₹','Payments'],['chats','☏','Chats'],['reviews','★','Reviews'],['kundlis','☷','Kundlis'],['poojas','🪔','Pooja Management'],['jyotish','📚','Jyotish Learning'],['settings','⚙','Platform Settings'],['audit','◷','Audit Log']];
$('#nav').innerHTML=nav.map(x=>`<button data-p="${x[0]}"><span>${x[1]}</span><span>${x[2]}</span><span class="count hide" id="count-${x[0]}"></span></button>`).join('');
document.querySelectorAll('#nav button').forEach(b=>b.addEventListener('click',()=>{document.getElementById('sidebar')?.classList.remove('open');show(b.dataset.p)}));
function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
async function api(url,opt={}){opt.headers={...(opt.headers||{}),Authorization:'Bearer '+token()};const r=await fetch(url,opt);const j=await r.json().catch(()=>({}));if(!r.ok)throw Error(j.error||j.message||`Request failed (${r.status})`);return j}
function toast(msg,type='ok'){const e=$('#toast');e.textContent=msg;e.className='toast show '+type;clearTimeout(window._toast);window._toast=setTimeout(()=>e.className='toast',3500)}
function setPageTitle(){const x=nav.find(n=>n[0]===page);$('#title').textContent=x?x[2]:'Admin'}
function setActive(){document.querySelectorAll('#nav button').forEach(b=>b.classList.toggle('active',b.dataset.p===page))}
function stat(label,value,icon,sub=''){return `<div class="stat"><div class="stat-head"><span>${esc(label)}</span><span class="stat-icon">${icon}</span></div><strong>${esc(value)}</strong><small>${esc(sub)}</small></div>`}
function statusPill(s){const c=s==='approved'?'approved':s==='rejected'?'rejected':'pending';return `<span class="pill ${c}">${s==='approved'?'✓':s==='rejected'?'×':'●'} ${esc(s)}</span>`}
function initials(name){return esc(String(name||'A').split(' ').map(x=>x[0]).join('').slice(0,2).toUpperCase())}
async function show(p){page=p;setPageTitle();setActive();try{if(p==='overview')await overview();if(p==='applications')await applications();if(p==='astrologers')await astrologers();if(p==='users')await users();if(p==='offers')await offers();if(p==='payments')await payments();if(p==='chats')await chats();if(p==='reviews')await reviews();if(p==='kundlis')await kundlis();if(p==='poojas')await poojas();if(p==='jyotish')await jyotish();if(p==='settings')await settings();if(p==='audit')await audit()}catch(e){$('#content').innerHTML=`<div class="panel"><div class="empty"><h3>Something went wrong</h3><p>${esc(e.message)}</p><button class="btn btn-primary" onclick="show(page)">Retry</button></div></div>`;toast(e.message,'err')}}
async function overview(){const x=await api('/api/admin?action=overview'),s=x.stats||{};$('#content').innerHTML=`<div class="cards">${stat('Total Users',s.users||0,'♙','Registered users')}${stat('Total Astrologers',s.astrologers||0,'★','Accounts')}${stat('Pending Approval',s.pendingApplications||0,'◷','Awaiting review')}${stat('Approved Astrologers',s.approvedAstrologers||0,'✓','Verified profiles')}</div><div class="cards" style="margin-top:13px">${stat('Active Chats',s.activeChats||0,'☏','Currently accepted')}${stat('Total Chats',s.totalChats||0,'☷','Conversation records')}${stat('Payments Received','₹'+Number(s.revenue||0).toLocaleString('en-IN'),'₹','Approved payments')}${stat('Pending Payments','₹'+Number(s.pendingAmount||0).toLocaleString('en-IN'),'◷','Awaiting approval')}</div><div class="layout"><section class="panel"><div class="panel-head"><div><h2>Admin Control Center</h2><p>Manage the Bhavishya Gyani astrology platform from one place.</p></div><button class="btn btn-primary" onclick="show('applications')">Review Applications →</button></div><div style="padding:18px"><div class="cards" style="grid-template-columns:repeat(3,1fr)"><div class="stat"><div class="stat-head">Kundlis</div><strong>${s.totalKundalis||0}</strong><small>Saved calculations</small></div><div class="stat"><div class="stat-head">Reviews</div><strong>${s.totalReviews||0}</strong><small>${s.pendingReviews||0} pending moderation</small></div><div class="stat"><div class="stat-head">Online</div><strong>${s.onlineAstrologers||0}</strong><small>Astrologers online now</small></div></div></div></section><aside class="side-panel"><div class="panel"><div class="panel-head"><div><h2>Quick Actions</h2><p>Common admin operations</p></div></div><div class="quick"><button class="btn btn-primary" onclick="show('applications')">♙ Review Astrologers</button><button class="btn btn-purple" onclick="show('payments')">₹ Payment Approval</button><button class="btn" onclick="show('users')">♙ Manage Users</button><button class="btn" onclick="show('chats')">☏ Monitor Chats</button><button class="btn" onclick="show('kundlis')">☷ View Kundlis</button><button class="btn" onclick="show('settings')">⚙ Platform Settings</button></div></div><div class="hero-card"><h3>Better Guidance</h3><p>True wisdom helps others find their path. Keep every profile, chat and payment organized.</p><b>— Bhavishya Gyani</b></div></aside></div>`}
async function applications(){const x=await api('/api/admin?action=applications');cache.applications=x.applications||[];const pending=cache.applications.filter(a=>a.status==='pending').length;$('#count-applications').textContent=pending;$('#count-applications').classList.toggle('hide',!pending);renderApplications('','all')}
function renderApplications(q='',filter='all'){let rows=cache.applications.filter(a=>filter==='all'||a.status===filter).filter(a=>{const t=(a.profile?.full_name+' '+a.profile?.email+' '+(a.expertise||[]).join(' ')+' '+(a.education||'')).toLowerCase();return t.includes(q.toLowerCase())});const body=rows.length?rows.map((a,i)=>{const name=a.profile?.full_name||'Applicant';return `<tr><td>${i+1}</td><td><div class="profile-cell">${a.avatar_url?`<img class="photo" src="${esc(a.avatar_url)}">`:`<div class="photo">${initials(name)}</div>`}<div><div class="name">${esc(name)}</div><div class="sub">${esc(a.profile?.email||'')}</div></div></div></td><td><div>${esc(a.education||'—')}</div><div class="sub">${esc(a.languages?.join(', ')||'')}</div></td><td>${esc(a.experience_years||0)} yrs</td><td>${esc(a.expertise?.join(', ')||'—')}</td><td>₹${Number(a.requested_fee||0).toLocaleString('en-IN')}</td><td>${statusPill(a.status)}</td><td>${a.status==='pending'?`<button class="btn btn-ok" data-approve="${esc(a.user_id)}">✓ Approve</button> <button class="btn btn-danger" data-reject="${esc(a.user_id)}">× Reject</button>`:`<button class="btn" onclick="viewApplication('${esc(a.user_id)}')">View</button>`}</td></tr>`}).join(''):`<tr><td colspan="8"><div class="empty">No applications found.</div></td></tr>`;$('#content').innerHTML=`<div class="layout"><section class="panel"><div class="panel-head"><div><h2>Astrologer Approval</h2><p>Review profiles, qualifications, expertise, fees and approve or reject applications.</p></div><div class="toolbar"><input class="input" id="appSearch" placeholder="Search name, email, expertise…" value="${esc(q)}"><select class="select" id="appFilter"><option value="all">All Status</option><option value="pending">Pending</option><option value="approved">Approved</option><option value="rejected">Rejected</option></select></div></div><div class="table-wrap"><table class="table"><thead><tr><th>#</th><th>Profile</th><th>Education</th><th>Experience</th><th>Specialization</th><th>Fee</th><th>Status</th><th>Actions</th></tr></thead><tbody>${body}</tbody></table></div></section><aside class="side-panel"><div class="panel"><div class="panel-head"><div><h2>Approval Summary</h2><p>Current application status</p></div></div><div class="quick">${stat('Pending',cache.applications.filter(a=>a.status==='pending').length,'◷','Needs action')}${stat('Approved',cache.applications.filter(a=>a.status==='approved').length,'✓','Verified')}${stat('Rejected',cache.applications.filter(a=>a.status==='rejected').length,'×','Not approved')}</div></div><div class="hero-card"><h3>Secure Approval</h3><p>Approve only after checking the astrologer's profile and qualification details.</p></div></aside></div>`;$('#appFilter').value=filter;$('#appSearch').oninput=e=>renderApplications(e.target.value,$('#appFilter').value);$('#appFilter').onchange=e=>renderApplications($('#appSearch').value,e.target.value);document.querySelectorAll('[data-approve]').forEach(b=>b.onclick=()=>appAction(b.dataset.approve,'approved',b));document.querySelectorAll('[data-reject]').forEach(b=>b.onclick=()=>appAction(b.dataset.reject,'rejected',b))}
async function appAction(id,status,button){if(!confirm(status==='approved'?'Approve this astrologer?':'Reject this application?'))return;const old=button.textContent;button.disabled=true;button.textContent='Saving…';try{const x=await api('/api/admin?action=application',{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify({user_id:id,status})});toast(status==='approved'?'Astrologer approved successfully.':'Application rejected.');await applications()}catch(e){button.disabled=false;button.textContent=old;toast(e.message,'err')}}
function viewApplication(id){const a=cache.applications.find(x=>x.user_id===id);if(!a)return;const p=a.profile||{};$('#modalTitle').textContent='Astrologer Profile';$('#modalBody').innerHTML=`<div class="profile-cell" style="margin-bottom:15px">${a.avatar_url?`<img class="photo" src="${esc(a.avatar_url)}" style="width:58px;height:58px">`:`<div class="photo" style="width:58px;height:58px">${initials(p.full_name)}</div>`}<div><h3 style="margin:0">${esc(p.full_name||'')}</h3><div class="sub">${esc(p.email||'')} • ${esc(p.phone||'')}</div></div></div><div class="detail-grid"><div class="detail"><small>Education</small><b>${esc(a.education||'—')}</b></div><div class="detail"><small>Experience</small><b>${esc(a.experience_years||0)} years</b></div><div class="detail"><small>Expertise</small><b>${esc(a.expertise?.join(', ')||'—')}</b></div><div class="detail"><small>Languages</small><b>${esc(a.languages?.join(', ')||'—')}</b></div><div class="detail"><small>Requested Fee</small><b>₹${Number(a.requested_fee||0).toLocaleString('en-IN')}</b></div><div class="detail"><small>Status</small><b>${esc(a.status)}</b></div></div><div class="detail" style="margin-top:10px"><small>Bio</small><b>${esc(a.bio||'—')}</b></div>`;$('#modal').classList.add('open')}
function closeModal(){$('#modal').classList.remove('open')}
async function astrologers(){const x=await api('/api/admin?action=astrologers'),rows=(x.astrologers||[]).map(a=>`<tr><td>#${esc(a.rank_position||'—')}</td><td><div class="profile-cell">${a.avatar_url?`<img class="photo" src="${esc(a.avatar_url)}">`:`<div class="photo">${initials(a.full_name||'A')}</div>`}<div><b class="name">${esc(a.full_name||'—')}</b><div class="sub">${esc(a.email||'—')}</div></div></div></td><td>${esc(a.rank_score||0)}</td><td>⭐ ${esc(a.rating_avg||0)}</td><td>₹${Number(a.fee_per_minute??a.fee??0).toFixed(2)}<br><small>${Number(a.discount||0)}% OFF</small></td><td>${esc(a.completed_chats||0)}</td><td>${esc(a.accepted_requests||0)}</td><td>${esc(a.missed_requests||0)}</td><td>${esc(a.response_seconds_avg||0)}s</td><td>${a.blocked?'<span class="pill rejected">Blocked</span>':(a.online?'<span class="pill approved">● Online</span>':'<span class="pill">Offline</span>')}</td><td><button class="btn" onclick="editAstro('${a.id}',${a.fee||0},${a.discount||0},${!!a.online})">Edit</button> <button class="btn ${a.blocked?'btn-ok':'btn-danger'}" onclick="blockAstro('${a.id}',${!a.blocked})">${a.blocked?'Unblock':'Block'}</button></td></tr>`).join('');$('#content').innerHTML=`<div class="panel"><div class="panel-head"><div><h2>Astrologers & Performance</h2><p>View profiles, rankings, online status, pricing and access controls.</p></div><button class="btn btn-primary" onclick="recalc()">↻ Recalculate Ranking</button></div><div class="table-wrap"><table class="table"><thead><tr><th>Rank</th><th>Astrologer</th><th>Score</th><th>Rating</th><th>Price / Min</th><th>Completed</th><th>Accepted</th><th>Missed</th><th>Response</th><th>Status</th><th>Action</th></tr></thead><tbody>${rows||'<tr><td colspan="11"><div class="empty">No astrologers found.</div></td></tr>'}</tbody></table></div></div>`} 
async function blockAstro(id,v){const reason=v?(prompt('Block reason','Admin action')||'Admin action'):'';try{await api('/api/admin?action=user',{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify({user_id:id,blocked:v,blocked_reason:reason})});toast(v?'Astrologer blocked':'Astrologer unblocked');show('astrologers')}catch(e){toast(e.message,'err')}}
async function recalc(){try{await api('/api/admin?action=recalculate-ranks',{method:'POST'});toast('Ranking recalculated');show('astrologers')}catch(e){toast(e.message,'err')}}
async function editAstro(id,fee,discount,online){const nf=prompt('Price per minute (₹)',fee);if(nf===null)return;const current=[0,25,50,75].includes(Number(discount))?Number(discount):0;const nd=prompt('Discount चुनें: 0, 25, 50 या 75 (%)',String(current));if(nd===null)return;const d=Number(nd);if(![0,25,50,75].includes(d)){toast('केवल 0%, 25%, 50% या 75% discount चुनें','err');return}try{await api('/api/admin?action=astrologer',{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify({astrologer_id:id,fee:+nf,fee_per_minute:+nf,discount:d,online})});toast('Price + discount updated');show('astrologers')}catch(e){toast(e.message,'err')}}
async function users(){const q=prompt('Search name/email/mobile (optional)','')||'';const x=await api('/api/admin?action=users&q='+encodeURIComponent(q)),rows=(x.users||[]).map(u=>{const name=String(u.full_name||'User'),phone=String(u.phone||''),role=String(u.role||'user'),id=String(u.id||'');return `<tr><td><div class="profile-cell"><div class="photo">${initials(name||u.email||'U')}</div><div><b class="name">${esc(name||'—')}</b><div class="sub">${esc(u.email||'—')}</div></div></div></td><td>${esc(phone||'—')}</td><td>${esc(role)}</td><td>${role==='user'?`<span class="pill approved">${Number(u.free_chat_minutes||0)} free min</span><br><span class="sub">Wallet ₹${Number(u.wallet_balance||0).toLocaleString('en-IN',{minimumFractionDigits:2,maximumFractionDigits:2})}</span>`:'—'}</td><td>${u.blocked?'<span class="pill rejected">Blocked</span>':'<span class="pill approved">Active</span>'}</td><td>${new Date(u.created_at).toLocaleString()}</td><td>${role==='user'?`<button type="button" class="btn btn-purple" onclick="window.grantFree('${esc(id)}','${esc(name).replace(/'/g,'&#39;')}');return false;">+ Free Min</button> <button type="button" class="btn btn-ok" onclick="window.addWallet('${esc(id)}','${esc(name).replace(/'/g,'&#39;')}');return false;">+ Wallet ₹</button> `:''}<button type="button" class="btn" data-admin-action="edit" data-user-id="${esc(id)}" data-user-name="${esc(name)}" data-user-phone="${esc(phone)}" data-user-role="${esc(role)}">Edit</button> <button type="button" class="btn ${u.blocked?'btn-ok':'btn-danger'}" data-admin-action="block" data-user-id="${esc(id)}" data-blocked="${u.blocked?'false':'true'}">${u.blocked?'Unblock':'Block'}</button></td></tr>`}).join('');$('#content').innerHTML=`<div class="panel"><div class="panel-head"><div><h2>Users & Access</h2><p>Users के free chat minutes भी यहीं से manage करें।</p></div><button type="button" class="btn btn-primary" data-admin-action="refresh-users">↻ Search / Refresh</button></div><div class="table-wrap"><table class="table"><thead><tr><th>User</th><th>Mobile</th><th>Role</th><th>Free Minutes</th><th>Status</th><th>Joined</th><th>Actions</th></tr></thead><tbody>${rows||'<tr><td colspan="7"><div class="empty">No users found.</div></td></tr>'}</tbody></table></div></div>`}
async function addWallet(id,name){try{const n=window.prompt(`कितना Wallet Balance ${name} को add करना है? (₹)`,'100');if(n===null)return;const amount=Number(String(n).replace(/,/g,''));if(!Number.isFinite(amount)||amount<=0)return toast('Amount सही डालें','err');const d=window.prompt('Reason','Admin wallet credit');if(d===null)return;if(!window.confirm(`₹${amount.toFixed(2)} wallet में add करें?`))return;toast('Wallet update हो रहा है...');await api('/api/admin?action=wallet-adjust',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({user_id:id,amount,type:'credit',description:d.trim()||'Admin wallet credit'})});toast(`₹${amount.toFixed(2)} wallet में successfully add हो गया`,'ok');await users()}catch(e){toast(e.message||'Wallet update failed','err');console.error(e)}}

async function grantFree(id,name){try{const n=window.prompt(`कितने Free Chat Minutes ${name} को दें?`,'10');if(n===null)return;const minutes=Math.floor(Number(String(n).replace(/,/g,''))||0);if(minutes<=0)return toast('Minutes सही डालें','err');const d=window.prompt('Offer/Reason','Admin free chat offer');if(d===null)return;toast('Free minutes update हो रहे हैं...');await api('/api/admin?action=free-minutes',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({user_id:id,minutes,description:d.trim()||'Admin free chat offer'})});toast(`${minutes} free minutes successfully added`,'ok');await users()}catch(e){toast(e.message||'Free minutes update failed','err');console.error(e)}}
async function editUser(id,name,phone,role){const n=prompt('Full name',name);if(n===null)return;const ph=prompt('Phone',phone);if(ph===null)return;const r=prompt('Role: user / astrologer / admin',role);if(r===null)return;const role2=r.trim().toLowerCase();if(!['user','astrologer','admin'].includes(role2)){toast('Invalid role','err');return}try{await api('/api/admin?action=user',{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify({user_id:id,full_name:n,phone:ph,role:role2})});toast('User details updated');show('users')}catch(e){toast(e.message,'err')}}
async function blockUser(id,v){const reason=v?(prompt('Block reason','Policy violation')||'Admin action'):'';try{await api('/api/admin?action=user',{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify({user_id:id,blocked:v,blocked_reason:reason})});toast(v?'User blocked':'User unblocked');show('users')}catch(e){toast(e.message,'err')}}
async function payments(){const [x,f]=await Promise.all([api('/api/admin?action=payments'),api('/api/admin?action=finance')]);const rows=(x.payments||[]).map(p=>`<tr><td>${new Date(p.created_at).toLocaleString()}</td><td>${esc(p.user?.full_name||'')}</td><td>₹${esc(p.amount)}</td><td>${esc(p.purpose||'general')}<div class="sub">${esc(p.gateway_payment_id||p.reference||'—')}</div></td><td>${statusPill(p.status)}</td><td>${p.status==='pending'?`<button class="btn btn-ok" onclick="payAction('${p.id}','approved')">Approve</button> <button class="btn btn-danger" onclick="payAction('${p.id}','rejected')">Reject</button>`:'—'}</td></tr>`).join('');const payouts=(f.payouts||[]).map(p=>`<tr><td>${esc(p.period_start)} → ${esc(p.period_end)}</td><td>${esc(p.astrologer_id)}</td><td>₹${Number(p.gross_amount||0).toLocaleString('en-IN')}</td><td>₹${Number(p.commission_amount||0).toLocaleString('en-IN')}</td><td>₹${Number(p.net_amount||0).toLocaleString('en-IN')}</td><td>${statusPill(p.status)}</td><td>${p.status!=='paid'?`<button class="btn" onclick="payoutAction('${p.id}','processing')">Processing</button> <button class="btn btn-ok" onclick="payoutAction('${p.id}','paid')">Mark Paid</button>`:'Paid'}</td></tr>`).join('');$('#content').innerHTML=`<div class="panel"><div class="panel-head"><div><h2>Payments & Finance</h2><p>Payment approvals, commission and astrologer monthly payouts.</p></div><div class="row"><button class="btn btn-primary" onclick="generatePayouts()">Generate Previous Month Payouts</button></div></div><div style="padding:15px;border-bottom:1px solid #333"><div class="row"><label style="font-weight:800">Admin Commission % <input id="commissionInput" type="number" min="0" max="100" step="0.1" value="${Number(f.settings?.commission_percent??20)}" style="margin-left:8px;width:110px;padding:9px;background:#111;color:#fff;border:1px solid #555;border-radius:8px"></label><button class="btn btn-purple" onclick="saveCommission()">Save Commission</button><span class="sub">Astrologer को net earning = gross − commission.</span></div></div><div class="table-wrap"><h3 style="padding:12px 14px 0">Customer Payments</h3><table class="table"><thead><tr><th>Date</th><th>User</th><th>Amount</th><th>Purpose / Reference</th><th>Status</th><th>Action</th></tr></thead><tbody>${rows||'<tr><td colspan="6"><div class="empty">No payments found.</div></td></tr>'}</tbody></table></div><div class="table-wrap" style="margin-top:14px"><h3 style="padding:12px 14px 0">Astrologer Payouts</h3><p style="padding:0 14px;color:#aaa;font-size:12px">Previous month earnings are payable in the next month between the 1st and 10th.</p><table class="table"><thead><tr><th>Period</th><th>Astrologer</th><th>Gross</th><th>Commission</th><th>Net Payable</th><th>Status</th><th>Action</th></tr></thead><tbody>${payouts||'<tr><td colspan="7"><div class="empty">No payouts generated.</div></td></tr>'}</tbody></table></div></div>`}

async function chats(){const x=await api('/api/admin?action=conversations'),rows=(x.conversations||[]).map(c=>`<tr><td>${esc(c.user?.full_name||'')}</td><td>${esc(c.astrologer?.full_name||c.admin?.full_name||'Admin Support')}</td><td>${statusPill(c.status)}</td><td>${esc(c.missed_by||'—')}</td><td>${new Date(c.created_at).toLocaleString()}</td><td><button class="btn" onclick="viewMessages('${c.id}')">Messages</button> <button class="btn" onclick="location.href='/chat.html?conversation_id='+encodeURIComponent('${c.id}')">Live Read</button> <button class="btn btn-danger" onclick="forceClose('${c.id}')">Close</button></td></tr>`).join('');$('#content').innerHTML=`<div class="panel"><div class="panel-head"><div><h2>Chat Monitor</h2><p>Monitor requests, accepted chats and archived conversations.</p></div></div><div class="table-wrap"><table class="table"><thead><tr><th>User</th><th>Astrologer / Admin</th><th>Status</th><th>Missed By</th><th>Created</th><th>Action</th></tr></thead><tbody>${rows||'<tr><td colspan="6"><div class="empty">No chats found.</div></td></tr>'}</tbody></table></div><div id="chatmsg"></div></div>`}

async function poojas(){try{const [px,bx]=await Promise.all([api('/api/admin?action=poojas'),api('/api/admin?action=pooja-bookings')]);const ps=px.poojas||[],bs=bx.bookings||[];const prow=ps.map(p=>`<tr><td>${p.image_url?`<img class="photo" src="${esc(p.image_url)}">`:'🪔'}</td><td><b>${esc(p.name)}</b><div class="sub">${esc(p.description||'')}</div></td><td>${esc(p.astrologer?.full_name||'—')}</td><td>₹${Number(p.price||0).toLocaleString('en-IN')}</td><td>${p.active?'<span class="pill approved">Active</span>':'<span class="pill rejected">Hidden</span>'}</td><td><button class="btn ${p.active?'btn-danger':'btn-ok'}" onclick="togglePooja('${p.id}',${p.active})">${p.active?'Hide':'Activate'}</button></td></tr>`).join('');const brow=bs.map(b=>`<tr><td>${esc(b.user?.full_name||b.user_name||'—')}<div class="sub">${esc(b.phone||'')}</div></td><td>${esc(b.pooja?.name||'—')}</td><td>${esc(b.astrologer?.full_name||'—')}</td><td>${esc(b.preferred_date||'')} ${esc(String(b.preferred_time||'').slice(0,5))}</td><td>₹${Number(b.amount||0).toLocaleString('en-IN')}</td><td>${statusPill(b.status)}</td><td>${b.status==='pending'?`<button class="btn btn-ok" onclick="poojaBookingAction('${b.id}','confirmed')">Confirm</button> <button class="btn btn-danger" onclick="poojaBookingAction('${b.id}','rejected')">Reject</button>`:b.status==='confirmed'?`<button class="btn btn-ok" onclick="poojaBookingAction('${b.id}','completed')">Completed</button> <button class="btn" onclick="poojaBookingAction('${b.id}','cancelled')">Cancel</button>`:'—'}</td></tr>`).join('');$('#content').innerHTML=`<div class="panel"><div class="panel-head"><div><h2>🪔 Pooja Management</h2><p>Monitor astrologer Pooja services and every user booking.</p></div><button class="btn btn-primary" onclick="show('poojas')">↻ Refresh</button></div><div style="padding:14px"><h3 style="margin:4px 0 10px">Pooja Services</h3><div class="table-wrap"><table class="table"><thead><tr><th>Image</th><th>Pooja</th><th>Astrologer</th><th>Price</th><th>Status</th><th>Action</th></tr></thead><tbody>${prow||'<tr><td colspan="6"><div class="empty">No Pooja services.</div></td></tr>'}</tbody></table></div><h3 style="margin:22px 0 10px">Pooja Bookings</h3><div class="table-wrap"><table class="table"><thead><tr><th>User</th><th>Pooja</th><th>Astrologer</th><th>Date / Time</th><th>Amount</th><th>Status</th><th>Action</th></tr></thead><tbody>${brow||'<tr><td colspan="7"><div class="empty">No Pooja bookings.</div></td></tr>'}</tbody></table></div></div></div>`}catch(e){$('#content').innerHTML=`<div class="panel"><div class="empty"><h3>Something went wrong</h3><p>${esc(e.message)}</p><button class="btn btn-primary" onclick="show('poojas')">Retry</button></div></div>`}}

async function jyotish(){const x=await api('/api/admin?action=jyotish'),cs=x.courses||[];const rows=cs.map(c=>`<tr><td><b>${esc(c.title)}</b><div class="sub">${esc(c.description||'')}</div></td><td>${c.video_url?`<a class="btn" href="${esc(c.video_url)}" target="_blank" rel="noopener">▶ Video</a>`:'—'}</td><td>${c.pdf_url?`<a class="btn" href="${esc(c.pdf_url)}" target="_blank" rel="noopener">📄 PDF</a>`:'—'}</td><td>${c.published?'<span class="pill approved">Published</span>':'<span class="pill rejected">Hidden</span>'}</td><td>${Number(c.order)||0}</td><td><button class="btn" onclick='editJyotish(${JSON.stringify(c).replace(/'/g,"&#39;")})'>Edit</button> <button class="btn btn-danger" onclick="deleteJyotish('${esc(c.id)}')">Delete</button></td></tr>`).join('');$('#content').innerHTML=`<div class="panel"><div class="panel-head"><div><h2>📚 Jyotish Learning</h2><p>Admin can continuously add video links and PDF study material. Published content appears automatically on the public Jyotish Learning page.</p></div><button class="btn btn-primary" onclick="newJyotish()">＋ Add Lesson</button></div><div style="padding:18px"><div id="jyForm" class="detail" style="display:none;margin-bottom:15px"><h3 id="jyFormTitle" style="margin-top:0">Add Lesson</h3><div style="display:grid;gap:10px;grid-template-columns:1fr 1fr"><label><small>Title</small><input class="input" id="jy_title" placeholder="उदाहरण: ग्रहों का परिचय"></label><label><small>Order</small><input class="input" id="jy_order" type="number" value="0"></label></div><label style="display:block;margin-top:10px"><small>Description</small><textarea class="input" id="jy_desc" rows="3" style="width:100%;resize:vertical" placeholder="इस पाठ में क्या सीखेंगे..."></textarea></label><label style="display:block;margin-top:10px"><small>Video Link</small><input class="input" id="jy_video" style="width:100%" placeholder="https://youtube.com/... या कोई direct video link"></label><div style="margin-top:10px"><small>PDF</small><div style="display:flex;gap:8px;flex-wrap:wrap;align-items:center"><input id="jy_pdf" type="file" accept="application/pdf,.pdf"><span id="jy_pdf_status" class="sub">PDF upload optional</span></div></div><div style="display:flex;gap:8px;align-items:center;margin-top:12px"><label><input id="jy_published" type="checkbox" checked> Published</label><button class="btn btn-primary" onclick="saveJyotish()">Save Lesson</button><button class="btn" onclick="cancelJyotish()">Cancel</button></div></div><div class="table-wrap"><table class="table"><thead><tr><th>Lesson</th><th>Video</th><th>PDF</th><th>Status</th><th>Order</th><th>Action</th></tr></thead><tbody>${rows||'<tr><td colspan="6"><div class="empty">No learning content yet. Add the first lesson.</div></td></tr>'}</tbody></table></div></div></div>`}

function editJyotish(c){jyEditing=c.id;jyPdfUrl=c.pdf_url||'';jyPdfName=c.pdf_name||'';$('#jyForm').style.display='block';$('#jyFormTitle').textContent='Edit Lesson';$('#jy_title').value=c.title||'';$('#jy_desc').value=c.description||'';$('#jy_video').value=c.video_url||'';$('#jy_order').value=Number(c.order)||0;$('#jy_published').checked=c.published!==false;$('#jy_pdf').value='';$('#jy_pdf_status').textContent=c.pdf_url?'Existing PDF kept unless replaced':'PDF upload optional';window.scrollTo({top:0,behavior:'smooth'})}
function cancelJyotish(){jyEditing=null;jyPdfUrl='';jyPdfName='';$('#jyForm').style.display='none'}
async function saveJyotish(){try{const title=$('#jy_title').value.trim();if(!title)throw Error('Title is required');const f=$('#jy_pdf').files[0];if(f&&f.type!=='application/pdf'&&!f.name.toLowerCase().endsWith('.pdf'))throw Error('Only PDF files are allowed');let pdfUrl=jyPdfUrl,pdfName=jyPdfName;if(f){if(f.size>50*1024*1024)throw Error('PDF must be 50 MB or smaller');$('#jy_pdf_status').textContent='Preparing upload...';const u=await api('/api/admin?action=jyotish-upload-url',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({filename:f.name,content_type:'application/pdf'})});const r=await fetch(u.upload_url,{method:'PUT',headers:{'Content-Type':'application/pdf'},body:f});if(!r.ok)throw Error('PDF upload failed');pdfUrl=u.public_url;pdfName=f.name;$('#jy_pdf_status').textContent='PDF uploaded'}const body={id:jyEditing||'',title,description:$('#jy_desc').value.trim(),video_url:$('#jy_video').value.trim(),pdf_url:pdfUrl,pdf_name:pdfName,order:Number($('#jy_order').value||0),published:$('#jy_published').checked};await api('/api/admin?action=jyotish',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});toast('Jyotish lesson saved');await jyotish()}catch(e){toast(e.message,'err')}}
async function deleteJyotish(id){if(!confirm('Delete this Jyotish lesson?'))return;try{await api('/api/admin?action=jyotish&id='+encodeURIComponent(id),{method:'DELETE',headers:{'Content-Type':'application/json'},body:JSON.stringify({id})});toast('Lesson deleted');await jyotish()}catch(e){toast(e.message,'err')}}
async function offers(){const [o,s]=await Promise.all([api('/api/admin?action=chat-offers'),api('/api/admin?action=settings')]);const rows=(o.offers||[]).map(x=>`<tr><td><b>${esc(x.name)}</b></td><td>${Number(x.minutes)||0}</td><td>${esc(x.target)}</td><td>${new Date(x.start_at).toLocaleString()}<br>→ ${new Date(x.end_at).toLocaleString()}</td><td>${x.active?'<span class="pill approved">Active</span>':'<span class="pill rejected">Off</span>'}</td><td><button class="btn btn-danger" onclick="deleteOffer('${x.id}')">Delete</button></td></tr>`).join('');$('#content').innerHTML=`<div class="panel"><div class="panel-head"><div><h2>🎁 Free Chat & Festival Offers</h2><p>Festival/occasion पर सभी users को automatic free chat minutes दें। User पहली बार chat शुरू करेगा तो active offer claim होगा।</p></div></div><div style="padding:18px;border-bottom:1px solid #1a3353"><div style="display:grid;gap:10px;grid-template-columns:repeat(2,minmax(0,1fr))"><input class="input" id="off_name" placeholder="Offer name — Diwali Special"><input class="input" id="off_minutes" type="number" min=1 value="10" placeholder="Free minutes"><select class="select" id="off_target"><option value="all">सभी users</option><option value="selected">Selected users</option></select><label class="detail"><small>Start</small><input class="input" id="off_start" type="datetime-local"></label><label class="detail"><small>End</small><input class="input" id="off_end" type="datetime-local"></label></div><button class="btn btn-primary" style="margin-top:12px" onclick="createOffer()">＋ Create Festival Offer</button><div class="sub" style="margin-top:8px">Selected users के लिए user IDs अभी admin API में accepted हैं; सभी users के लिए Target = सभी users चुनें।</div></div><div class="table-wrap"><table class="table"><thead><tr><th>Offer</th><th>Minutes</th><th>Target</th><th>Validity</th><th>Status</th><th>Action</th></tr></thead><tbody>${rows||'<tr><td colspan="6"><div class="empty">No festival offers.</div></td></tr>'}</tbody></table></div></div>`}
async function createOffer(){const name=$('#off_name').value.trim(),minutes=Math.floor(Number($('#off_minutes').value)||0),start=$('#off_start').value,end=$('#off_end').value;if(!name||minutes<=0||!start||!end)return toast('Offer name, minutes, start और end भरें','err');try{await api('/api/admin?action=festival-offer',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name,minutes,target:$('#off_target').value,start_at:new Date(start).toISOString(),end_at:new Date(end).toISOString(),active:true})});toast('Festival offer created');show('offers')}catch(e){toast(e.message,'err')}}
async function deleteOffer(id){if(!confirm('इस festival offer को delete करें?'))return;try{await api('/api/admin?action=festival-offer-delete',{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify({id})});toast('Offer deleted');show('offers')}catch(e){toast(e.message,'err')}}
async function settings(){const x=await api('/api/admin?action=settings'),s=x.settings||{},co=s.chat_offer_settings||{},ro=s.recharge_offer_settings||{};$('#content').innerHTML=`<div class="panel"><div class="panel-head"><div><h2>Platform Settings</h2><p>Free minutes, festival offers और recharge bonus यहीं से control करें।</p></div><button class="btn btn-primary" onclick="saveSettings()">Save Settings</button></div><div style="padding:18px;display:grid;gap:12px;grid-template-columns:repeat(2,minmax(0,1fr))"><label class="detail"><small>Platform Name</small><input class="input" id="set_platform_name" value="${esc(s.platform_name||'Bhavishya Gyani')}"></label><label class="detail"><small>Chat Rate</small><input class="input" id="set_chat_rate" type="number" min="0" value="${esc(s.chat_rate??0)}"></label><label class="detail"><small>Default Discount %</small><input class="input" id="set_default_discount" type="number" min="0" max="100" value="${esc(s.default_discount??0)}"></label><label class="detail"><small>Currency</small><input class="input" id="set_currency" value="${esc(s.currency||'INR')}"></label><label class="detail"><small>New User Free Chat Minutes</small><input class="input" id="set_new_user_minutes" type="number" min="0" value="${Number(co.new_user_free_minutes||0)}"></label><label class="detail"><small>Recharge Extra %</small><input class="input" id="set_recharge_pct" type="number" min="0" max="100" step="0.1" value="${Number(ro.percent||0)}"></label><label class="detail"><small>Recharge Offer Start</small><input class="input" id="set_recharge_start" type="datetime-local" value="${ro.start_at?new Date(ro.start_at).toISOString().slice(0,16):''}"></label><label class="detail"><small>Recharge Offer End</small><input class="input" id="set_recharge_end" type="datetime-local" value="${ro.end_at?new Date(ro.end_at).toISOString().slice(0,16):''}"></label><label class="detail" style="display:flex;gap:8px;align-items:center"><input id="set_recharge_active" type="checkbox" ${ro.active?'checked':''}> Recharge bonus active</label><label class="detail"><small>Support WhatsApp</small><input class="input" id="set_support_whatsapp" value="${esc(s.support_whatsapp||'')}"></label><label class="detail"><small>Maintenance Mode</small><select class="select" id="set_maintenance_mode"><option value="false" ${s.maintenance_mode?'':'selected'}>Off</option><option value="true" ${s.maintenance_mode?'selected':''}>On</option></select></label></div></div>`}
async function saveSettings(){const settings={platform_name:$('#set_platform_name').value.trim(),chat_rate:Number($('#set_chat_rate').value||0),default_discount:Number($('#set_default_discount').value||0),currency:$('#set_currency').value.trim()||'INR',support_whatsapp:$('#set_support_whatsapp').value.trim(),maintenance_mode:$('#set_maintenance_mode').value==='true',chat_offer_settings:{new_user_free_minutes:Math.max(0,Math.floor(Number($('#set_new_user_minutes').value||0)))},recharge_offer_settings:{active:$('#set_recharge_active').checked,percent:Math.max(0,Math.min(100,Number($('#set_recharge_pct').value||0))),start_at:$('#set_recharge_start').value?new Date($('#set_recharge_start').value).toISOString():null,end_at:$('#set_recharge_end').value?new Date($('#set_recharge_end').value).toISOString():null}};try{await api('/api/admin?action=settings',{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify({settings})});toast('Platform settings saved')}catch(e){toast(e.message,'err')}}
async function audit(){const x=await api('/api/admin?action=audit'),rows=(x.logs||[]).map(l=>`<tr><td>${new Date(l.created_at).toLocaleString()}</td><td>${esc(l.admin?.full_name||'')}</td><td>${esc(l.action)}</td><td><pre style="white-space:pre-wrap;color:#9fb1cd">${esc(JSON.stringify(l.details))}</pre></td></tr>`).join('');$('#content').innerHTML=`<div class="panel"><div class="panel-head"><div><h2>Audit Log</h2><p>Administrative actions recorded by the platform.</p></div></div><div class="table-wrap"><table class="table"><thead><tr><th>Date</th><th>Admin</th><th>Action</th><th>Details</th></tr></thead><tbody>${rows||'<tr><td colspan="4"><div class="empty">No audit events.</div></td></tr>'}</tbody></table></div></div>`}
async function logout(){try{if(window.SM_SUPABASE?.signOut)await window.SM_SUPABASE.signOut()}catch(e){}localStorage.removeItem('bgToken_admin');location.replace('/')}
document.addEventListener('click',async e=>{const b=e.target.closest('[data-admin-action]');if(!b)return;const a=b.dataset.adminAction;try{if(a==='free')return await grantFree(b.dataset.userId,b.dataset.userName||'User');if(a==='wallet')return await addWallet(b.dataset.userId,b.dataset.userName||'User');if(a==='edit')return await editUser(b.dataset.userId,b.dataset.userName||'',b.dataset.userPhone||'',b.dataset.userRole||'user');if(a==='block')return await blockUser(b.dataset.userId,b.dataset.blocked==='true');if(a==='refresh-users')return await show('users')}catch(err){toast(err.message||'Action failed','err')}});
window.grantFree=grantFree;window.addWallet=addWallet;Object.assign(window,{show,appAction,viewApplication,blockAstro,recalc,editAstro,users,addWallet,grantFree,editUser,blockUser,payments,saveCommission,generatePayouts,payoutAction,payAction,chats,forceClose,viewMessages,reviews,reviewAction,kundlis,viewKundli,poojas,togglePooja,poojaBookingAction,jyotish,newJyotish,editJyotish,cancelJyotish,saveJyotish,deleteJyotish,offers,createOffer,deleteOffer,settings,saveSettings,audit,logout,closeModal});
(async()=>{try{const x=await api('/api/me');if(x.user?.role!=='admin')throw Error('Admin only');$('#identity').textContent=x.user.name||x.user.email||'Admin';await show('overview')}catch(e){$('#content').innerHTML=`<div class="panel"><div class="empty"><h3>Access denied</h3><p>${esc(e.message)}</p><a class="btn btn-primary" href="/admin-login.html">Admin Login</a></div></div>`}})();
</script>

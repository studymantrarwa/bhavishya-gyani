<!doctype html><html lang="hi"><head>
<script src="/auth-guard.js"></script><script>BG_AUTH.check("user");</script><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Bhavishya Gyani Kundli PDF</title><style>
body{font-family:Arial,"Noto Sans Devanagari",sans-serif;color:#111;background:#fff;margin:0}.wrap{max-width:900px;margin:auto;padding:24px}.top{display:flex;justify-content:space-between;align-items:center;gap:12px;border-bottom:2px solid #111;padding-bottom:12px}.btn{padding:10px 14px;border:1px solid #111;background:#fff;border-radius:8px}.card{border:1px solid #ccc;border-radius:10px;padding:14px;margin:14px 0;break-inside:avoid}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}.item{padding:8px;border-bottom:1px solid #eee}.muted{color:#666;font-size:12px}.table{width:100%;border-collapse:collapse}.table th,.table td{border:1px solid #ccc;padding:6px;text-align:left;font-size:12px}.chart{width:min(520px,100%);margin:10px auto}.chart svg{width:100%;height:auto;border:1px solid #111}.note{font-size:11px;color:#666;line-height:1.5}@media print{.no-print{display:none!important}.wrap{padding:8px}body{font-size:11px}.card{margin:8px 0}}
</style></head><body><div class="wrap"><div class="top"><div><h1 style="margin:0">Bhavishya Gyani</h1><div class="muted">Vedic Kundli Report • Swiss Ephemeris • Lahiri</div></div><button class="btn no-print" onclick="window.print()">🖨️ Save / Print PDF</button></div><div id="out">Loading…</div></div><script>
const d=JSON.parse(localStorage.getItem('studyMantraLastKundli')||'null');const e=v=>String(v??'—').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
if(!d){document.getElementById('out').innerHTML='<div class="card">Kundli data नहीं मिली। पहले Free Kundli calculate करें।</div>'}else{const p=d.birthDetails?.person||{},bc=d.birthDetails?.birthChart||{},av=d.advanced?.ashtakavarga,s=d.advanced?.sadeSati,tr=d.advanced?.transits||{};const planets=Object.entries(d.planets||{}).map(([k,v])=>`<tr><td>${e(k)}</td><td>${e(v.signName)}</td><td>${e(v.house)}</td><td>${Number(v.degreeInSign||0).toFixed(3)}°</td><td>${e(v.nakshatra?.name)}</td><td>${e(v.nakshatra?.pada)}</td></tr>`).join('');const sav=(av?.sarva||[]).map((x,i)=>`<tr><td>${i+1}</td><td>${e(d.charts?.D1?.[i]?.signName||'')}</td><td>${x}</td></tr>`).join('');document.getElementById('out').innerHTML=`<div class="card"><h2>${e(p.name||'Kundli')}</h2><div class="grid"><div class="item"><b>जन्म</b><br>${e(p.dob)} ${e(p.time)}</div><div class="item"><b>स्थान</b><br>${e(p.place)}</div><div class="item"><b>लग्न</b><br>${e(bc.lagnaHi||d.lagna?.signName)}</div><div class="item"><b>चंद्र राशि</b><br>${e(bc.rashiHi)}</div><div class="item"><b>नक्षत्र</b><br>${e(bc.nakshatraHi)} • पाद ${e(bc.pada)}</div><div class="item"><b>अयनांश</b><br>Lahiri</div></div></div><div class="card"><h2>D1 / Rashi — North Indian</h2><div id="d1"></div><h2>D9 / Navamsa — North Indian</h2><div id="d9"></div></div><div class="card"><h2>ग्रह स्थिति</h2><table class="table"><tr><th>ग्रह</th><th>राशि</th><th>भाव</th><th>अंश</th><th>नक्षत्र</th><th>पाद</th></tr>${planets}</table></div><div class="card"><h2>विम्शोत्तरी दशा</h2><table class="table"><tr><th>महादशा</th><th>आरंभ</th><th>समाप्ति</th></tr>${(d.dasha?.mahadasha||[]).map(x=>`<tr><td>${e(x.lord)}</td><td>${e(x.start)}</td><td>${e(x.end)}</td></tr>`).join('')}</table></div><div class="card"><h2>गोचर / Transit</h2><table class="table"><tr><th>ग्रह</th><th>राशि</th><th>वक्री</th></tr>${Object.entries(tr).filter(([k])=>!['sadeSati'].includes(k)).map(([k,v])=>`<tr><td>${e(k)}</td><td>${e(v.signName)}</td><td>${v.retrograde?'हाँ':'नहीं'}</td></tr>`).join('')}</table></div><div class="card"><h2>साढ़ेसाती</h2><div>${s?.active?`सक्रिय — ${e(s.phase)}`:'वर्तमान गोचर के अनुसार सक्रिय नहीं है।'}</div><div class="muted">नatal Moon sign: ${e(s?.natalMoonSign)} · Transit Saturn sign: ${e(s?.saturnSign)}</div></div><div class="card"><h2>अष्टकवर्ग</h2><table class="table"><tr><th>राशि क्रम</th><th>राशि</th><th>SAV बिंदु</th></tr>${sav}</table><p class="note">Sarvashtakavarga कुल ${e(av?.total)} बिंदु। सात ग्रहों की Bhinnashtakavarga और SAV गणना chart के ग्रह-स्थान से की गई है।</p></div><div class="card"><h2>महत्वपूर्ण सूचना</h2><p class="note">यह रिपोर्ट पारंपरिक वैदिक ज्योतिषीय गणना के लिए है। इसे वैज्ञानिक या निश्चित भविष्यवाणी के रूप में न लें। PDF बनाने के लिए ऊपर “Save / Print PDF” दबाकर device के print dialog में “Save as PDF” चुनें।</p></div>`}
function chartSvg(ch){const pos={1:[50,15],2:[16,15],3:[16,34],4:[24,50],5:[16,66],6:[16,85],7:[50,85],8:[84,85],9:[84,66],10:[76,50],11:[84,34],12:[84,15]},planet={1:[50,35],2:[26,12],3:[13,35],4:[33,50],5:[13,65],6:[27,88],7:[50,65],8:[73,88],9:[87,65],10:[67,50],11:[87,35],12:[73,12]},lines=[[0,0,100,100],[100,0,0,100],[50,0,0,50],[50,0,100,50],[0,50,50,100],[100,50,50,100]];let svg='<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg"><rect x=".5" y=".5" width="99" height="99" fill="white" stroke="black"/>';for(const l of lines)svg+=`<line x1="${l[0]}" y1="${l[1]}" x2="${l[2]}" y2="${l[3]}" stroke="black"/>`;for(const h of ch||[]){const hp=pos[h.house],pp=planet[h.house];if(!hp)continue;svg+=`<text x="${hp[0]}" y="${hp[1]}" text-anchor="middle" font-size="4" font-weight="bold">${e(h.sign)}</text>`;(h.planets||[]).forEach((x,i)=>svg+=`<text x="${pp[0]}" y="${pp[1]+i*4}" text-anchor="middle" font-size="3.2" fill="#8a1c1c">${e(({Sun:'Su',Moon:'Mo',Mars:'Ma',Mercury:'Me',Jupiter:'Ju',Venus:'Ve',Saturn:'Sa',Rahu:'Ra',Ketu:'Ke'})[x]||x)}</text>`)}return svg+'</svg>'}if(d){document.getElementById('d1').innerHTML='<div class="chart">'+chartSvg(d.charts?.D1)+'</div>';document.getElementById('d9').innerHTML='<div class="chart">'+chartSvg(d.charts?.D9)+'</div>'}</script><script src="/astrologer-global-chat.js"></script></body></html>

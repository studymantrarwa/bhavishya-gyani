<!doctype html><html lang="hi"><head>
<script src="/auth-guard.js"></script><script>BG_AUTH.check(["user","astrologer"]);</script><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Voice Call — Bhavishya Gyani</title><script src="/supabase-client.js"></script>
<style>body{margin:0;background:#0d0f12;color:#fff;font-family:system-ui,-apple-system,"Noto Sans Devanagari",sans-serif}.wrap{max-width:520px;margin:auto;min-height:100vh;display:grid;place-items:center;padding:20px}.card{width:100%;background:#1b1e23;border:1px solid #353a42;border-radius:22px;padding:24px;text-align:center;box-shadow:0 20px 70px #0008}.avatar{width:104px;height:104px;border-radius:50%;object-fit:cover;background:#343941;display:grid;place-items:center;margin:0 auto 14px;font-size:34px;font-weight:900;border:3px solid #ffc400}.name{font-size:23px;font-weight:900}.state{color:#b5bcc6;margin:8px 0 22px}.btn{border:0;border-radius:50%;width:64px;height:64px;margin:6px;background:#ffc400;color:#111;font-size:22px;font-weight:900;cursor:pointer}.red{background:#ff414c;color:#fff}.dark{background:#343940;color:#fff}.status{margin-top:14px;padding:10px;border-radius:10px;background:#14161a;color:#aeb6c0;font-size:12px;min-height:18px}.hidden{display:none}.wait{font-size:13px;color:#ffc400}</style></head><body><div class="wrap"><div class="card"><div id="av" class="avatar">☎</div><div id="name" class="name">Voice Call</div><div id="state" class="state">Preparing call…</div><div id="wait" class="wait"></div><audio id="remote" autoplay playsinline></audio><div><button id="startAudio" class="btn dark hidden">🔊</button><button id="mute" class="btn dark hidden">🎙</button><button id="end" class="btn red">✕</button></div><div id="status" class="status">Microphone will be requested only after the call is accepted.</div></div></div>
<script>
const cid=new URLSearchParams(location.search).get('conversation_id');let me=null,conv=null,pc=null,local=null,muted=false,pollTimer=null,signalTimer=null,seen=new Set(),remoteReady=false,pendingIce=[],iceServers=[{urls:'stun:stun.l.google.com:19302'},{urls:'stun:stun.cloudflare.com:3478'}],restartTried=false;
const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
async function api(url,opt={}){const t=await window.SM_SUPABASE.getAccessToken();if(!t)throw Error('Login required');opt.headers={...(opt.headers||{}),Authorization:'Bearer '+t};const r=await fetch(url,opt);const j=await r.json().catch(()=>({}));if(!r.ok)throw Error(j.error||'Request failed');return j}
function setStatus(t){$('#status').textContent=t}
function setOther(c){const other=me?.user?.role==='astrologer'?c.user:c.astrologer;$('#name').textContent=other?.full_name||'Voice Call';if(other?.avatar_url){const img=document.createElement('img');img.id='av';img.className='avatar';img.src=other.avatar_url;img.alt='';$('#av').replaceWith(img)}}
async function getConv(){const x=await api('/api/chat?conversation_id='+encodeURIComponent(cid));conv=x.conversation;setOther(conv);return conv}
async function pollCallState(){try{const c=await getConv();if(['call_rejected','missed','closed'].includes(c.status)){setStatus(c.status==='call_rejected'?'Call rejected':'Call ended');$('#state').textContent='Call closed';clearInterval(pollTimer);setTimeout(()=>location.href='/chat.html?conversation_id='+encodeURIComponent(cid),700);return}if(c.status==='call_accepted'&&!pc){$('#state').textContent='Voice call';$('#wait').textContent='';await startMedia();}}catch(e){setStatus(e.message)}}
async function startMedia(){try{setStatus('Requesting microphone permission…');await ensurePeer();if(me.user.role==='user' && !seen.has('offer')){seen.add('offer');const offer=await pc.createOffer({offerToReceiveAudio:true});await pc.setLocalDescription(offer);await sendSignal({type:'offer',payload:{offer:pc.localDescription}});setStatus('Calling… waiting for connection');}else setStatus('Waiting for the other side…');startSignalPolling()}catch(e){setStatus('Microphone/call error: '+e.message)}}
async function enableAudio(){try{const a=$('#remote');a.muted=false;await a.play()}catch(e){setStatus('Audio start करने के लिए 🔊 दबाएँ')}}
async function loadIceServers(){try{const x=await api('/api/config?call=1');if(Array.isArray(x.iceServers)&&x.iceServers.length)iceServers=x.iceServers;setStatus(x.turnConfigured?'Voice network ready (TURN enabled)':'Voice network ready (STUN only)')}catch(e){}}
async function ensurePeer(){if(pc)return;await loadIceServers();pc=new RTCPeerConnection({iceServers,iceCandidatePoolSize:10});pc.onicecandidate=e=>{if(e.candidate)sendSignal({type:'ice',payload:{candidate:e.candidate}}).catch(()=>{})};pc.ontrack=e=>{$('#remote').srcObject=e.streams[0];remoteReady=true;$('#startAudio').classList.remove('hidden');enableAudio();$('#state').textContent='Connected';setStatus('Voice call connected')};pc.oniceconnectionstatechange=()=>{const s=pc.iceConnectionState;if(s==='checking')setStatus('Connecting voice…');if(s==='connected'||s==='completed')setStatus('Voice connection established');if(s==='failed'){setStatus('Voice network failed — retrying ICE…');if(!restartTried&&pc.restartIce){restartTried=true;setTimeout(()=>{try{pc.restartIce()}catch(e){}},700)}}};pc.onconnectionstatechange=()=>{if(['failed','disconnected'].includes(pc.connectionState))setStatus('Connection: '+pc.connectionState);if(pc.connectionState==='connected'){$('#state').textContent='Connected';setStatus('Voice call connected')};if(pc.connectionState==='closed')setStatus('Call ended')};local=await navigator.mediaDevices.getUserMedia({audio:true,video:false});local.getTracks().forEach(t=>pc.addTrack(t,local));$('#mute').classList.remove('hidden')}
async function sendSignal(signal){await api('/api/call-signaling',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({conversationId:cid,signal})})}
async function signalPoll(){if(!pc)return;try{const x=await api('/api/call-signaling?conversation_id='+encodeURIComponent(cid));for(const s of x.signals||[]){if(seen.has(s.id)||s.sender_id===me.user.id)continue;seen.add(s.id);if(s.signal.type==='offer'&&me.user.role==='astrologer'){await pc.setRemoteDescription(s.signal.payload.offer);remoteReady=true;for(const c of pendingIce){try{await pc.addIceCandidate(c)}catch(e){} }pendingIce=[];const answer=await pc.createAnswer();await pc.setLocalDescription(answer);await sendSignal({type:'answer',payload:{answer:pc.localDescription}});setStatus('Voice call connected')}else if(s.signal.type==='answer'&&me.user.role==='user'){await pc.setRemoteDescription(s.signal.payload.answer);remoteReady=true;for(const c of pendingIce){try{await pc.addIceCandidate(c)}catch(e){} }pendingIce=[];setStatus('Voice call connected')}else if(s.signal.type==='ice'){if(remoteReady){try{await pc.addIceCandidate(s.signal.payload.candidate)}catch(e){}}else pendingIce.push(s.signal.payload.candidate)}}}catch(e){}}
function startSignalPolling(){if(signalTimer)return;signalTimer=setInterval(signalPoll,500);signalPoll()}
async function endCall(){try{await api('/api/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action:'close',conversationId:cid})})}catch(e){}try{await api('/api/call-signaling?conversation_id='+encodeURIComponent(cid),{method:'DELETE'})}catch(e){}cleanup()}
function cleanup(){clearInterval(pollTimer);clearInterval(signalTimer);if(local)local.getTracks().forEach(t=>t.stop());if(pc)pc.close();location.href='/chat.html?conversation_id='+encodeURIComponent(cid)}
$('#startAudio').onclick=enableAudio;
$('#mute').onclick=()=>{if(!local)return;muted=!muted;local.getAudioTracks().forEach(t=>t.enabled=!muted);$('#mute').textContent=muted?'🔇':'🎙'};
$('#end').onclick=endCall;
(async()=>{try{if(!cid)throw Error('Call ID missing');const x=await api('/api/me');me=x;await getConv();if(['call_requested_user','call_requested_astrologer'].includes(conv.status)){const caller=conv.status==='call_requested_user'?'User':'Astrologer';$('#state').textContent='Waiting for acceptance';$('#wait').textContent=caller+' ने call request भेजी है.';setStatus('Recipient must Accept/Reject the call.');pollTimer=setInterval(pollCallState,1500);return}if(conv.status!=='call_accepted')throw Error('Call is not active');await startMedia();pollTimer=setInterval(pollCallState,1500)}catch(e){alert(e.message);location.href='/chat.html?conversation_id='+encodeURIComponent(cid)}})();
</script><script src="/call-global.js"></script></body></html>

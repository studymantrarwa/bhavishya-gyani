<!doctype html><html lang="hi"><head>
<script src="/auth-guard.js"></script><script>BG_AUTH.check(["user","astrologer"]);</script><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Voice Call — Bhavishya Gyani</title><script src="/supabase-client.js"></script>
<style>body{margin:0;background:#0d0f12;color:#fff;font-family:system-ui,-apple-system,"Noto Sans Devanagari",sans-serif}.wrap{max-width:520px;margin:auto;min-height:100vh;display:grid;place-items:center;padding:20px}.card{width:100%;background:#1b1e23;border:1px solid #353a42;border-radius:22px;padding:24px;text-align:center;box-shadow:0 20px 70px #0008}.avatar{width:104px;height:104px;border-radius:50%;object-fit:cover;background:#343941;display:grid;place-items:center;margin:0 auto 14px;font-size:34px;font-weight:900;border:3px solid #ffc400}.name{font-size:23px;font-weight:900}.state{color:#b5bcc6;margin:8px 0 22px}.btn{border:0;border-radius:50%;width:64px;height:64px;margin:6px;background:#ffc400;color:#111;font-size:22px;font-weight:900;cursor:pointer}.red{background:#ff414c;color:#fff}.dark{background:#343940;color:#fff}.status{margin-top:14px;padding:10px;border-radius:10px;background:#14161a;color:#aeb6c0;font-size:12px;min-height:18px}.hidden{display:none}.wait{font-size:13px;color:#ffc400}.tiny{font-size:10px;color:#737b86;margin-top:8px}</style></head><body><div class="wrap"><div class="card"><div id="av" class="avatar">☎</div><div id="name" class="name">Voice Call</div><div id="state" class="state">Preparing call…</div><div id="wait" class="wait"></div><audio id="remote" autoplay playsinline></audio><div><button id="startAudio" class="btn dark hidden">🔊</button><button id="mute" class="btn dark hidden">🎙</button><button id="end" class="btn red">✕</button></div><div id="status" class="status">Secure voice connection preparing…</div><div id="diag" class="tiny"></div></div></div>
<script>
'use strict';
const cid=new URLSearchParams(location.search).get('conversation_id');
let me=null,conv=null,pc=null,local=null,muted=false,pollTimer=null,signalTimer=null,seen=new Set(),remoteReady=false,pendingIce=[],iceServers=[],isRestarting=false,restartCount=0,lastState='new';
const $=s=>document.querySelector(s);
async function api(url,opt={}){const t=await window.SM_SUPABASE.getAccessToken();if(!t)throw Error('Login required');opt.headers={...(opt.headers||{}),Authorization:'Bearer '+t};const r=await fetch(url,opt);const j=await r.json().catch(()=>({}));if(!r.ok)throw Error(j.error||'Request failed');return j}
function setStatus(t){$('#status').textContent=t}
function diag(t){$('#diag').textContent=t||''}
function setOther(c){const other=me?.user?.role==='astrologer'?c.user:c.astrologer;$('#name').textContent=other?.full_name||'Voice Call';if(other?.avatar_url){const img=document.createElement('img');img.id='av';img.className='avatar';img.src=other.avatar_url;img.alt='';$('#av').replaceWith(img)}}
async function getConv(){const x=await api('/api/chat?conversation_id='+encodeURIComponent(cid));conv=x.conversation;setOther(conv);return conv}
async function loadIce(){try{const x=await api('/api/turn-credentials');iceServers=x.iceServers||[];diag(x.turnConfigured?'TURN relay ready':'Direct/STUN only — TURN not configured');}catch(e){const x=await api('/api/config?call=1');iceServers=x.iceServers||[];diag(x.turnConfigured?'TURN relay ready':'Direct/STUN only — TURN not configured')}}
async function ensurePeer(){if(pc)return;await loadIce();pc=new RTCPeerConnection({iceServers,iceCandidatePoolSize:4,bundlePolicy:'max-bundle',rtcpMuxPolicy:'require'});
 pc.onicecandidate=e=>{if(e.candidate)sendSignal({type:'ice',payload:{candidate:e.candidate}}).catch(()=>{})};
 pc.onicecandidateerror=e=>{diag('ICE '+(e.errorCode||'error')+' '+(e.errorText||''));};
 pc.ontrack=e=>{const stream=e.streams?.[0]||new MediaStream([e.track]);$('#remote').srcObject=stream;$('#startAudio').classList.remove('hidden');enableAudio();$('#state').textContent='Connected';setStatus('Voice call connected')};
 pc.oniceconnectionstatechange=()=>{const s=pc.iceConnectionState;lastState=s;if(s==='checking')setStatus('Connecting voice…');if(s==='connected'||s==='completed')setStatus('Voice connection established');if(s==='disconnected'){setStatus('Network changed — reconnecting voice…');scheduleRestart()}if(s==='failed'){setStatus('Voice path failed — switching/restarting…');scheduleRestart()}};
 pc.onconnectionstatechange=()=>{const s=pc.connectionState;if(s==='connected'){$('#state').textContent='Connected';setStatus('Voice call connected')}else if(s==='disconnected'){setStatus('Voice temporarily disconnected — reconnecting…');scheduleRestart()}else if(s==='failed'){setStatus('Voice connection failed — retrying…');scheduleRestart()}else if(s==='closed')setStatus('Call ended')};
 pc.onicegatheringstatechange=()=>{if(pc.iceGatheringState==='complete')diag(iceServers.some(x=>String(x.urls||'').includes('turn'))?'TURN candidates gathered':'ICE candidates gathered')};
 local=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:true,noiseSuppression:true,autoGainControl:true},video:false});local.getTracks().forEach(t=>pc.addTrack(t,local));$('#mute').classList.remove('hidden')}
async function sendSignal(signal){await api('/api/call-signaling',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({conversationId:cid,signal})})}
async function makeOffer(iceRestart=false){if(!pc||me.user.role!=='user'||isRestarting)return;try{isRestarting=true;if(iceRestart&&pc.restartIce)pc.restartIce();const offer=await pc.createOffer(iceRestart?{iceRestart:true}:{offerToReceiveAudio:true});await pc.setLocalDescription(offer);await sendSignal({type:'offer',payload:{offer:pc.localDescription}});setStatus(iceRestart?'Reconnecting voice…':'Calling… waiting for connection');}finally{isRestarting=false}}
function scheduleRestart(){if(me?.user?.role!=='user'||isRestarting||restartCount>=3)return;restartCount++;setTimeout(()=>{if(pc&&['connected','checking','disconnected','failed'].includes(pc.iceConnectionState))makeOffer(true).catch(()=>{})},1000*restartCount)}
async function applyIce(c){try{if(!c)return;if(remoteReady)await pc.addIceCandidate(c);else pendingIce.push(c)}catch(e){}}
async function signalPoll(){if(!pc)return;try{const x=await api('/api/call-signaling?conversation_id='+encodeURIComponent(cid));for(const s of x.signals||[]){if(seen.has(s.id)||s.sender_id===me.user.id)continue;seen.add(s.id);const type=s.signal?.type;
 if(type==='offer'&&me.user.role==='astrologer'){await pc.setRemoteDescription(s.signal.payload.offer);remoteReady=true;for(const c of pendingIce.splice(0))await applyIce(c);const answer=await pc.createAnswer();await pc.setLocalDescription(answer);await sendSignal({type:'answer',payload:{answer:pc.localDescription}});setStatus('Voice connection negotiating…')}
 else if(type==='answer'&&me.user.role==='user'){await pc.setRemoteDescription(s.signal.payload.answer);remoteReady=true;for(const c of pendingIce.splice(0))await applyIce(c);setStatus('Voice connection negotiating…')}
 else if(type==='ice')await applyIce(s.signal.payload.candidate);
 }}catch(e){}}
function startSignalPolling(){if(signalTimer)return;signalTimer=setInterval(signalPoll,350);signalPoll()}
async function startMedia(){try{setStatus('Requesting microphone permission…');await ensurePeer();if(me.user.role==='user')await makeOffer(false);else setStatus('Waiting for the caller…');startSignalPolling()}catch(e){setStatus('Microphone/call error: '+e.message)}}
async function enableAudio(){try{const a=$('#remote');a.muted=false;await a.play();setStatus('Voice call connected')}catch(e){setStatus('Tap 🔊 once to enable call audio')}}
async function pollCallState(){try{const c=await getConv();if(['call_rejected','missed','closed'].includes(c.status)){setStatus(c.status==='call_rejected'?'Call rejected':'Call ended');$('#state').textContent='Call closed';clearInterval(pollTimer);setTimeout(()=>location.href='/chat.html?conversation_id='+encodeURIComponent(cid),700);return}if(c.status==='call_accepted'&&!pc){$('#state').textContent='Voice call';$('#wait').textContent='';await startMedia()}}catch(e){setStatus(e.message)}}
async function endCall(){try{await api('/api/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action:'close',conversationId:cid})})}catch(e){}try{await api('/api/call-signaling?conversation_id='+encodeURIComponent(cid),{method:'DELETE'})}catch(e){}cleanup()}
function cleanup(){clearInterval(pollTimer);clearInterval(signalTimer);if(local)local.getTracks().forEach(t=>t.stop());if(pc)pc.close();location.href='/chat.html?conversation_id='+encodeURIComponent(cid)}
$('#startAudio').onclick=enableAudio;
$('#mute').onclick=()=>{if(!local)return;muted=!muted;local.getAudioTracks().forEach(t=>t.enabled=!muted);$('#mute').textContent=muted?'🔇':'🎙'};
$('#end').onclick=endCall;
(async()=>{try{if(!cid)throw Error('Call ID missing');const x=await api('/api/me');me=x;await getConv();if(['call_requested_user','call_requested_astrologer'].includes(conv.status)){const caller=conv.status==='call_requested_user'?'User':'Astrologer';$('#state').textContent='Waiting for acceptance';$('#wait').textContent=caller+' ने call request भेजी है.';setStatus('Recipient must Accept/Reject the call.');pollTimer=setInterval(pollCallState,1500);return}if(conv.status!=='call_accepted')throw Error('Call is not active');await startMedia();pollTimer=setInterval(pollCallState,1500)}catch(e){alert(e.message);location.href='/chat.html?conversation_id='+encodeURIComponent(cid)}})();
</script><script src="/call-global.js"></script></body></html>

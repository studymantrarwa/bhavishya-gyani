<!doctype html><html lang="hi"><head><script src="/auth-guard.js"></script><script>BG_AUTH.check(["user","astrologer"]);</script><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Voice Call — Bhavishya Gyani</title><script src="/supabase-client.js"></script><style>body{margin:0;background:#111;color:#fff;font-family:system-ui,-apple-system,"Noto Sans Devanagari",sans-serif}.wrap{max-width:520px;margin:auto;min-height:100vh;display:grid;place-items:center;padding:20px}.card{width:100%;background:#202125;border:1px solid #3a3b40;border-radius:22px;padding:22px;text-align:center}.avatar{width:100px;height:100px;border-radius:50%;object-fit:cover;background:#444;display:grid;place-items:center;margin:0 auto 14px;font-size:34px;font-weight:900;border:3px solid #ffc400}.name{font-size:23px;font-weight:900}.state{color:#aaa;margin:8px 0 20px}.btn{border:0;border-radius:50%;width:62px;height:62px;margin:6px;background:#ffc400;color:#111;font-size:22px;font-weight:900}.red{background:#ff414c}.dark{background:#34353a;color:#fff}.status{margin-top:12px;padding:9px;border-radius:10px;background:#17181a;color:#aaa;font-size:12px}.hidden{display:none}</style></head><body><div class="wrap"><div class="card"><div id="av" class="avatar">☎</div><div id="name" class="name">Voice Call</div><div id="state" class="state">Connecting…</div><audio id="remote" autoplay playsinline></audio><div><button id="mute" class="btn dark hidden">🎙</button><button id="end" class="btn red">✕</button></div><div id="status" class="status">Microphone permission will be requested when the call starts.</div></div></div><script>
const cid=new URLSearchParams(location.search).get('conversation_id');let me=null,conv=null,sb=null,ch=null,pc=null,local=null,muted=false,iceQueue=[],remoteSet=false,ended=false;const $=s=>document.querySelector(s);const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
async function api(url,opt={}){const t=await window.SM_SUPABASE.getAccessToken();if(!t)throw Error('Login required');opt.headers={...(opt.headers||{}),Authorization:'Bearer '+t};const r=await fetch(url,opt);const j=await r.json().catch(()=>({}));if(!r.ok)throw Error(j.error||'Request failed');return j}
function status(t){$('#status').textContent=t}
async function flushIce(){if(!pc||!remoteSet||!iceQueue.length)return;const q=iceQueue.splice(0);for(const c of q)try{await pc.addIceCandidate(c)}catch(e){}}
async function setup(){if(!cid)throw Error('Conversation missing');me=await api('/api/me');const x=await api('/api/chat?conversation_id='+encodeURIComponent(cid));conv=x.conversation;if(!conv||conv.channel!=='call')throw Error('This is not a voice call');if(conv.status!=='accepted')throw Error('Voice call is not active yet');const other=me.user.role==='astrologer'?conv.user:conv.astrologer;$('#name').textContent=other?.full_name||'Voice Call';if(other?.avatar_url)$('#av').outerHTML=`<img id="av" class="avatar" src="${esc(other.avatar_url)}">`;$('#state').textContent='Voice call connected';sb=await window.SM_SUPABASE.init();if(!sb)throw Error('Supabase Realtime is not configured');ch=sb.channel('call:'+cid);ch.on('broadcast',{event:'offer'},async p=>{if(me.user.role!=='astrologer')return;await ensurePeer(false);await pc.setRemoteDescription(p.payload.offer);remoteSet=true;await flushIce();const answer=await pc.createAnswer();await pc.setLocalDescription(answer);await ch.send({type:'broadcast',event:'answer',payload:{answer}});status('Connected')});ch.on('broadcast',{event:'answer'},async p=>{if(me.user.role!=='user'||!pc)return;await pc.setRemoteDescription(p.payload.answer);remoteSet=true;await flushIce();status('Connected')});ch.on('broadcast',{event:'ice'},async p=>{const c=p.payload?.candidate;if(!c||!pc)return;if(!remoteSet){iceQueue.push(c);return}try{await pc.addIceCandidate(c)}catch(e){}});ch.on('broadcast',{event:'hangup'},()=>finish(false));await ch.subscribe();await ensurePeer(me.user.role==='user');if(me.user.role==='user')await startOffer()}
async function ensurePeer(){if(pc)return;pc=new RTCPeerConnection({iceServers:[{urls:'stun:stun.l.google.com:19302'}]});pc.onicecandidate=e=>{if(e.candidate&&ch)ch.send({type:'broadcast',event:'ice',payload:{candidate:e.candidate}})};pc.ontrack=e=>{$('#remote').srcObject=e.streams[0]};pc.onconnectionstatechange=()=>{const st=pc.connectionState;status('Call: '+st);if(st==='failed')setTimeout(()=>finish(true),1000)};local=await navigator.mediaDevices.getUserMedia({audio:true,video:false});local.getTracks().forEach(t=>pc.addTrack(t,local));$('#mute').classList.remove('hidden')}
async function startOffer(){const offer=await pc.createOffer();await pc.setLocalDescription(offer);await ch.send({type:'broadcast',event:'offer',payload:{offer}});status('Calling… waiting for astrologer')}
function finish(send=true){if(ended)return;ended=true;try{if(send&&ch)ch.send({type:'broadcast',event:'hangup',payload:{}})}catch(e){}if(local)local.getTracks().forEach(t=>t.stop());if(pc)pc.close();location.href='/chat.html?conversation_id='+encodeURIComponent(cid)}
$('#mute').onclick=()=>{if(!local)return;muted=!muted;local.getAudioTracks().forEach(t=>t.enabled=!muted);$('#mute').textContent=muted?'🔇':'🎙'};$('#end').onclick=()=>finish(true);setup().catch(e=>{alert(e.message);location.href='/chat.html?conversation_id='+encodeURIComponent(cid)});
</script></body></html>

<!doctype html><html lang="hi"><head><script src="/auth-guard.js"></script><script>BG_AUTH.check("user");</script><script src="/supabase-client.js"></script><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Bhavishya Gyani — Refer & Earn</title><style>:root{--gold:#ffc400;--bg:#090a0b;--card:#17181b;--line:#303136;--muted:#aaa}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:#fff;font-family:system-ui,-apple-system,"Noto Sans Devanagari",sans-serif}.app{max-width:620px;margin:auto;min-height:100vh}.top{height:62px;background:var(--gold);color:#111;display:flex;align-items:center;padding:0 15px;gap:12px}.top a{font-size:27px;color:#111;text-decoration:none}.brand{font-size:20px;font-weight:900}.card{margin:14px;background:var(--card);border:1px solid var(--line);border-radius:17px;padding:18px}.code{font-size:28px;font-weight:900;letter-spacing:2px;text-align:center;padding:15px;background:#0b0b0b;border:1px dashed #777;border-radius:12px}.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}.stat{padding:13px;background:#111;border:1px solid var(--line);border-radius:11px;text-align:center}.num{font-size:24px;font-weight:900;color:var(--gold)}.muted{color:var(--muted);font-size:12px}.btn{width:100%;padding:12px;border:0;border-radius:10px;background:var(--gold);color:#111;font-weight:900;margin-top:10px}.field{margin-top:14px}.field input{width:100%;padding:12px;border-radius:10px;border:1px solid #444;background:#0d0d0d;color:#fff}.msg{display:none;margin-top:10px;padding:10px;border-radius:9px}.show{display:block}.ok{background:#10321f;color:#baf5cf}.err{background:#3a1111;color:#ffbaba}</style></head><body><div class="app"><header class="top"><a href="/">‹</a><div class="brand">रेफर करें और कमाएं</div></header><div class="card"><div class="muted">आपका Referral Code</div><div id="code" class="code">Loading…</div><button id="share" class="btn">Share Referral</button><div class="stats"><div class="stat"><div id="count" class="num">0</div><div class="muted">Successful Referrals</div></div><div class="stat"><div id="points" class="num">0</div><div class="muted">Reward Points</div></div></div></div><div class="card"><b>Referral Code Apply करें</b><div class="field"><input id="applyCode" placeholder="Friend का referral code"></div><button id="apply" class="btn">Apply Code</button><div id="msg" class="msg"></div></div></div><script>const $=s=>document.querySelector(s);let code='';function show(t,ok=false){$('#msg').textContent=t;$('#msg').className='msg show '+(ok?'ok':'err')}async function api(u,o={}){const t=await window.SM_SUPABASE.getAccessToken();o.headers={...(o.headers||{}),Authorization:'Bearer '+t};const r=await fetch(u,o),j=await r.json().catch(()=>({}));if(!r.ok)throw Error(j.error||'Request failed');return j}async function load(){try{const j=await api('/api/referral');code=j.code;$('#code').textContent=code;$('#count').textContent=j.referral_count||0;$('#points').textContent=j.reward_points||0}catch(e){$('#code').textContent=e.message}}$('#share').onclick=async()=>{const text=`Bhavishya Gyani join करें। मेरा referral code: ${code}`;try{if(navigator.share)await navigator.share({title:'Bhavishya Gyani',text});else{await navigator.clipboard.writeText(text);alert('Referral text copied')}}catch(e){}};$('#apply').onclick=async()=>{try{const j=await api('/api/referral',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({code:$('#applyCode').value.trim().toUpperCase()})});show(j.message||'Referral applied','ok');load()}catch(e){show(e.message)}};load();</script><script src="/astrologer-global-chat.js"></script></body></html>

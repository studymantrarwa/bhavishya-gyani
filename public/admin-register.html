<!doctype html><html lang="hi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Bhavishya Gyani — New Admin Registration</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="/supabase-client.js"></script><style>*{box-sizing:border-box}body{margin:0;min-height:100vh;background:#070707;color:#fff;font-family:system-ui,-apple-system,"Noto Sans Devanagari",sans-serif;display:grid;place-items:center;padding:18px}.card{width:min(460px,100%);background:#111;border:1px solid #292929;border-radius:20px;padding:24px;box-shadow:0 20px 60px #000}.logo{text-align:center;font-size:30px;color:#f2bd18}.brand{text-align:center;font-size:24px;font-weight:900;margin:5px}.sub{text-align:center;color:#999;font-size:13px;margin:6px 0 20px}.field{margin:12px 0}.field label{display:block;color:#ddd;font-size:13px;margin-bottom:6px}.field input{width:100%;padding:13px;border-radius:10px;border:1px solid #363636;background:#080808;color:#fff}.btn{width:100%;padding:13px;border:0;border-radius:10px;background:#f2bd18;color:#111;font-weight:900;margin-top:8px}.secondary{background:#222;color:#fff}.msg{display:none;padding:11px;border-radius:10px;margin:12px 0;font-size:13px}.msg.show{display:block}.err{background:#3a1111;color:#ffbaba;border:1px solid #692222}.ok{background:#10321f;color:#baf5cf;border:1px solid #236b40}.hint{background:#17140a;border:1px solid #4c3c0e;color:#d8c98a;padding:11px;border-radius:10px;font-size:12px;line-height:1.5;margin:12px 0}.small{text-align:center;color:#777;font-size:12px;margin-top:14px}a{color:#f2bd18;text-decoration:none}</style></head><body><div class="card"><div class="logo">☀</div><div class="brand">New Admin Registration</div><div class="sub">Bhavishya Gyani वेबसाइट के लिए नया Admin account बनाएँ।</div><div class="hint">Security के लिए registration protected है। आप या तो existing Admin के login session से registration कर सकते हैं, या Vercel में सेट किया गया <b>ADMIN_REGISTRATION_CODE</b> डाल सकते हैं।</div><div id="msg" class="msg"></div><form id="f"><div class="field"><label>Admin Name</label><input id="name" required maxlength="80" placeholder="Admin Name"></div><div class="field"><label>Email</label><input id="email" type="email" autocomplete="username" required placeholder="admin@example.com"></div><div class="field"><label>Mobile Number</label><input id="phone" type="tel" maxlength="20" placeholder="9876543210"></div><div class="field"><label>Admin Password</label><input id="pass" type="password" autocomplete="new-password" required minlength="6" placeholder="कम से कम 6 characters"></div><div class="field"><label>Confirm Password</label><input id="pass2" type="password" autocomplete="new-password" required minlength="6" placeholder="Password दोबारा लिखें"></div><div class="field"><label>Admin Registration Code</label><input id="code" type="password" autocomplete="off" placeholder="Registration code"></div><button class="btn" id="submit">Create Admin Account</button></form><button class="btn secondary" type="button" onclick="location.href='/admin-login.html'">← Admin Login</button><div class="small"><a href="/">← Home</a></div></div><script>const $=s=>document.querySelector(s);function msg(t,c='err'){const e=$('#msg');e.textContent=t;e.className='msg show '+c}$('#f').onsubmit=async e=>{e.preventDefault();const pass=$('#pass').value;if(pass!==$('#pass2').value)return msg('Password और Confirm Password अलग हैं।');$('#submit').disabled=true;try{const token=localStorage.getItem('studyMantraToken');const headers={'Content-Type':'application/json'};if(token)headers.Authorization='Bearer '+token;const r=await fetch('/api/admin-register',{method:'POST',headers,body:JSON.stringify({full_name:$('#name').value.trim(),email:$('#email').value.trim(),phone:$('#phone').value.trim(),password:pass,registration_code:$('#code').value})});const j=await r.json().catch(()=>({}));if(!r.ok)throw Error(j.error||'Registration failed');msg('Admin account सफलतापूर्वक बन गया। अब Admin Login करें।','ok');setTimeout(()=>location.href='/admin-login.html',1200)}catch(err){msg(err.message||'Registration failed')}finally{$('#submit').disabled=false}};</script></body></html>

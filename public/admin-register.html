<!doctype html><html lang="hi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin Registration — Bhavishya Gyani</title></head><body style="background:#070707;color:#fff;font-family:system-ui;padding:20px"><main style="max-width:460px;margin:auto;background:#151515;padding:22px;border-radius:18px"><h1>New Admin Registration</h1><p>Registration code जरूरी है। Default fresh setup code: <b>1234</b>. इसे बाद में बदलें।</p><div id="m"></div><form id="f"><p>Name<br><input id="n" required style="width:100%;padding:12px"></p><p>Email<br><input id="e" type="email" required style="width:100%;padding:12px"></p><p>Mobile<br><input id="ph" style="width:100%;padding:12px"></p><p>Password<br><input id="p" type="password" minlength="6" required style="width:100%;padding:12px"></p><p>Confirm Password<br><input id="p2" type="password" minlength="6" required style="width:100%;padding:12px"></p><p>Registration Code<br><input id="c" type="password" required style="width:100%;padding:12px"></p><button style="width:100%;padding:13px">Create Admin Account</button></form><p><a href="/admin-login.html">Admin Login</a></p></main><script src="/supabase-client.js"></script><script>const $=s=>document.querySelector(s);$('#f').onsubmit=async e=>{e.preventDefault();if($('#p').value!==$('#p2').value)return $('#m').textContent='Passwords match नहीं हैं';try{const r=await fetch('/api/admin-register',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({full_name:$('#n').value.trim(),email:$('#e').value.trim(),phone:$('#ph').value,password:$('#p').value,registration_code:$('#c').value})});const j=await r.json();if(!r.ok)throw Error(j.error);$('#m').textContent='Admin account बन गया। अब Admin Login करें.';setTimeout(()=>location.href='/admin-login.html',900)}catch(x){$('#m').textContent=x.message}}</script></body></html>
